[defaults]
inventory          = inventory.ini
roles_path         = roles
callback_plugins   = callback_plugins
callbacks_enabled  = profile_tasks
stdout_callback    = ansible.builtin.default
# Render task results (notably `debug: msg:` multi-line strings, e.g. the incus
# storage-pool status block) as a YAML literal block instead of the default
# escaped-JSON one-liner / quoted list - so multi-line output is actually readable.
callback_result_format = yaml
display_skipped_hosts = false
diff_always        = True
retry_files_enabled = False
# `inject_facts_as_vars` explicitly set to False: every role here accesses
# facts via the `ansible_facts['fact_name']` form, NOT the deprecated
# top-level shortcuts (`ansible_env`, `ansible_user_id`, `ansible_os_family`,
# etc.). Setting False here disables the shortcuts entirely so any future
# accidental use fails loudly instead of silently riding the deprecation
# warning. ansible-core 2.24 will flip the default to False anyway; this
# adopts the new default early.
inject_facts_as_vars = False
# Header injected via `{{ ansible_managed }}` into every rendered template.
# Default Ansible format is uninformatively terse; this one tells future-you /
# future-readers exactly where the source-of-truth lives so the file doesn't
# get hand-edited only to be silently overwritten on the next playbook run.
ansible_managed    = MANAGED BY ANSIBLE - DO NOT EDIT. Source template: {file} (mtime %Y-%m-%d %H:%M:%S). Rendered by {uid} on {host}.
