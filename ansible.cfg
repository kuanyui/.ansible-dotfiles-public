[defaults]
inventory          = inventory.ini
roles_path         = roles
callback_plugins   = callback_plugins
callbacks_enabled  = profile_tasks
stdout_callback    = ansible.builtin.default
display_skipped_hosts = false
diff_always        = True
retry_files_enabled = False
# `inject_facts_as_vars` deliberately left at default (True): our existing roles
# (zsh, container_*, podman) reference facts via `ansible_env.*` shortcut.
# The apparmor repo had this set to False but its own tasks use the longer
# `ansible_facts['env']` form, so the upstream value didn't matter to it.
# Header injected via `{{ ansible_managed }}` into every rendered template.
# Default Ansible format is uninformatively terse; this one tells future-you /
# future-readers exactly where the source-of-truth lives so the file doesn't
# get hand-edited only to be silently overwritten on the next playbook run.
ansible_managed    = MANAGED BY ANSIBLE - DO NOT EDIT. Source template: {file} (mtime %Y-%m-%d %H:%M:%S). Rendered by {uid} on {host}.
