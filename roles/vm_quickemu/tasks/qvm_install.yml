---
# Install the `qvm` launcher + its shell completions. VM data is qvm's own
# runtime concern (`~/.local/share/qvm/`, created on first `qvm init`) - the
# role deploys nothing there on purpose (uninstall must never touch VMs).

- name: Ensure `vm_quickemu_bin_dir` + completion dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ vm_quickemu_bin_dir }}"
    - "{{ vm_quickemu_zsh_completion_dir }}"
    - "{{ vm_quickemu_bash_completion_dir }}"

- name: Install `qvm` to `{{ vm_quickemu_bin_dir }}/qvm`
  ansible.builtin.copy:
    src: qvm
    dest: "{{ vm_quickemu_bin_dir }}/qvm"
    mode: "0755"

- name: Install `qvm` zsh completion to `{{ vm_quickemu_zsh_completion_dir }}/_qvm`
  ansible.builtin.copy:
    src: completions/_qvm
    dest: "{{ vm_quickemu_zsh_completion_dir }}/_qvm"
    mode: "0644"

- name: Install `qvm` bash completion to `{{ vm_quickemu_bash_completion_dir }}/qvm`
  ansible.builtin.copy:
    src: completions/qvm.bash
    dest: "{{ vm_quickemu_bash_completion_dir }}/qvm"
    mode: "0644"

# ---------- Produce the SHARED provision-asset cache (consumed by `qvm provision`) ----------
# The SAME cache ivm uses (JSON registries + feature-first dotfiles tree), produced by the
# internal `_shared_prebuilt_provision_assets` role into
# `~/.local/share/ansible-managed/shared-prebuilt-provision-assets/`. `qvm provision` reads
# it (its DEFAULT_SHARED_ASSETS_ROOT). Regenerable + SHARED with ivm - so it is REF-COUNTED
# at uninstall (see qvm_uninstall.yml), not owned by either launcher's subdir.
- name: Produce the shared provision-asset cache (`roles/_shared_prebuilt_provision_assets`)
  ansible.builtin.include_role:
    name: _shared_prebuilt_provision_assets
