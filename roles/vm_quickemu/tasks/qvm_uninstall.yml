---
# Remove `qvm` + this role's subdir. Does NOT delete any VMs: qvm's runtime
# data (`~/.local/share/qvm/` - disks, confs, keys) is deliberately OUTSIDE
# `vm_quickemu_root`, so this rm can never erase a VM. Per-VM removal:
# `qvm delete`. Packages are never removed (system-shared).

- name: Remove the `qvm` binary `{{ vm_quickemu_bin_dir }}/qvm`
  ansible.builtin.file:
    path: "{{ vm_quickemu_bin_dir }}/qvm"
    state: absent

- name: Wipe `vm_quickemu`'s subdir `{{ vm_quickemu_root }}` (completions; siblings under `ansible-managed/` untouched; `~/.local/share/qvm/` VM data untouched)
  ansible.builtin.file:
    path: "{{ vm_quickemu_root }}"
    state: absent

# The SHARED provision-asset cache is CO-PRODUCED by vm_incus + vm_quickemu - REF-COUNTED:
# remove it ONLY when the OTHER consumer (ivm) is absent, so uninstalling qvm doesn't break
# `ivm provision` (and vice versa; see roles/vm_incus/tasks/ivm_uninstall.yml + CLAUDE.md).
- name: Load the shared-asset producer's defaults (for `_shared_prebuilt_provision_assets_dir`)
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../_shared_prebuilt_provision_assets/defaults/main.yml"

- name: Check whether `ivm` (the other shared-cache consumer) is still installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/ivm"
  register: _other_launcher_ivm

- name: Wipe the SHARED provision-asset cache `{{ _shared_prebuilt_provision_assets_dir }}` (only when ivm is NOT installed)
  ansible.builtin.file:
    path: "{{ _shared_prebuilt_provision_assets_dir }}"
    state: absent
  when: not _other_launcher_ivm.stat.exists
