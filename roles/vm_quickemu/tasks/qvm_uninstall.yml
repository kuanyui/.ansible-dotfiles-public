---
# Remove `qvm` + this role's subdir. Does NOT delete any VMs: qvm's runtime
# data (`~/.local/share/qvm/` - disks, confs, keys) is deliberately OUTSIDE
# `vm_quickemu_root`, so this rm can never erase a VM. Per-VM removal:
# `qvm delete`. Packages are never removed (system-shared).

- name: Remove the `qvm` binary `{{ vm_quickemu_bin_dir }}/qvm`
  ansible.builtin.file:
    path: "{{ vm_quickemu_bin_dir }}/qvm"
    state: absent

- name: Wipe `vm_quickemu`'s subdir `{{ vm_quickemu_root }}` (completions; siblings under `ansible-managed/` untouched; `~/.local/share/qvm/` VM data untouched)
  ansible.builtin.file:
    path: "{{ vm_quickemu_root }}"
    state: absent

# The SHARED provision-asset cache is CO-PRODUCED by vm_incus + vm_quickemu + vm_podman -
# REF-COUNTED across all THREE: remove it ONLY when NEITHER other consumer (ivm, pvm) is
# installed, so uninstalling qvm doesn't break `ivm`/`pvm` (and vice versa; see the matching
# steps in their uninstall tasks + CLAUDE.md).
- name: Load the shared-asset producer's defaults (for `_shared_prebuilt_provision_assets_dir`)
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../_shared_prebuilt_provision_assets/defaults/main.yml"

- name: Check whether `ivm` (a shared-cache consumer) is still installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/ivm"
  register: _other_launcher_ivm

- name: Check whether `pvm` (a shared-cache consumer) is still installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/pvm"
  register: _other_launcher_pvm

- name: Wipe the SHARED provision-asset cache `{{ _shared_prebuilt_provision_assets_dir }}` (only when NEITHER ivm nor pvm is installed)
  ansible.builtin.file:
    path: "{{ _shared_prebuilt_provision_assets_dir }}"
    state: absent
  when:
    - not _other_launcher_ivm.stat.exists
    - not _other_launcher_pvm.stat.exists
