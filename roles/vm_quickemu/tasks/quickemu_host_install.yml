---
# Host-level package prep for `roles/vm_quickemu`. Included from tasks/main.yml
# (gated on `not vm_quickemu_skip_host_setup`). All steps are probe-gated, so a
# fully-set-up host is a no-op that never prompts for sudo. No daemon, no
# storage pool, no group - quickemu is just packages (compare
# roles/vm_incus/tasks/incus_host_install.yml).

# ---------- quickemu itself ----------
# Official-repo availability (repology, checked 2026-06): Debian 13+/Ubuntu
# 25.04+ and Fedora 41+ ship `quickemu`; openSUSE (Tumbleweed AND Leap) does
# NOT package it at all. Per the project's no-third-party-repos posture the
# role installs it only where the OFFICIAL repo has it; on openSUSE it WARNS
# loudly with manual instructions and continues (qvm itself dies with an
# install hint when `quickemu`/`quickget` is missing at runtime).

- name: Install `quickemu` via official distro repo (Debian / Fedora; only if the binary is missing)
  ansible.builtin.include_role:
    name: _install_distro_packages
  vars:
    install_distro_packages:
      Debian:
        install: [quickemu]
        probe: command -v quickemu
      RedHat:
        install: [quickemu]
        probe: command -v quickemu
  when: ansible_facts['os_family'] in ['Debian', 'RedHat']

- name: WARN that openSUSE ships no `quickemu` package (install it manually; the role continues)
  ansible.builtin.debug:
    msg: |
      ============================================================
       openSUSE has NO official `quickemu` package (Tumbleweed and
       Leap both - repology, 2026-06). This role will NOT add a
       third-party repo. Install manually, e.g.:
      ============================================================

        sudo zypper install --no-confirm qemu spice-gtk
        git clone https://github.com/quickemu-project/quickemu ~/.local/opt/quickemu
        ln -s ~/.local/opt/quickemu/{quickemu,quickget} ~/.local/bin/

       `qvm` is installed regardless and will error with this hint
       until `quickemu` is on PATH.
      ============================================================
  when: ansible_facts['os_family'] == 'Suse'

# ---------- virt-builder (the debian/fedora prebuilt-image path) ----------
# Same package on ALL three families (repology, 2026-06: Debian 12+, Fedora
# 39+, openSUSE TW + Leap 15.5+ official repos). Mirrors the existing
# guestfs-tools step in roles/vm_incus.

- name: Install `guestfs-tools` (provides `virt-builder` for GPG-verified prebuilt debian/fedora images; only if `virt-builder` is missing)
  ansible.builtin.include_role:
    name: _install_distro_packages
  vars:
    install_distro_packages:
      Debian:
        install: [guestfs-tools]
        probe: command -v virt-builder
      Suse:
        install: [guestfs-tools]
        probe: command -v virt-builder
      RedHat:
        install: [guestfs-tools]
        probe: command -v virt-builder

# ---------- xorriso (the tumbleweed cloud-init seed ISO) ----------
# `qvm init tumbleweed` builds a NoCloud seed ISO; qvm probes for any of
# xorriso / genisoimage / mkisofs at runtime, so an already-present alternative
# satisfies the probe and nothing is installed.

- name: Install `xorriso` (builds the cloud-init seed ISO for `qvm init tumbleweed`; skipped when any of `xorriso`/`genisoimage`/`mkisofs` is present)
  ansible.builtin.include_role:
    name: _install_distro_packages
  vars:
    install_distro_packages:
      Debian:
        install: [xorriso]
        probe: command -v xorriso || command -v genisoimage || command -v mkisofs
      Suse:
        install: [xorriso]
        probe: command -v xorriso || command -v genisoimage || command -v mkisofs
      RedHat:
        install: [xorriso]
        probe: command -v xorriso || command -v genisoimage || command -v mkisofs
