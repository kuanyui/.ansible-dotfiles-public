---
- name: Check whether install manifest `{{ incus_workstations_manifest_path }}` exists
  ansible.builtin.stat:
    path: "{{ incus_workstations_manifest_path }}"
  register: _incus_workstations_manifest_stat

- name: Bail out early if manifest is missing
  ansible.builtin.meta: end_play
  when: not _incus_workstations_manifest_stat.stat.exists

- name: Slurp install manifest
  ansible.builtin.slurp:
    src: "{{ incus_workstations_manifest_path }}"
  register: _incus_workstations_manifest_raw

- name: Parse install manifest
  ansible.builtin.set_fact:
    _incus_workstations_manifest: "{{ _incus_workstations_manifest_raw.content | b64decode | from_yaml }}"

- name: Show recorded paths before removal
  ansible.builtin.debug:
    var: _incus_workstations_manifest

# Note: we do NOT touch the actual Incus VMs created by these launchers.
# That's the user's responsibility per-VM (`v-<name> rma`), because:
#   1. Workstation VMs are deliberately persistent (snapshots, long-running
#      state); blindly nuking them on `unapply` would be a footgun.
#   2. Bulk-deleting all `v-*` VMs could clobber agents' VMs from
#      `roles/incus_agents` (same name prefix).
# To wipe specific VMs: `v-<name> rma` (one) or `incus list ^v- ; incus delete ...`
# (manual review + delete).

- name: Remove launchers from `~/.local/bin/` (outside `{{ incus_workstations_root }}`)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ _incus_workstations_manifest.workstations | map(attribute='launcher_path') | list }}"

- name: Wipe `incus_workstations`'s own subdir `{{ _incus_workstations_manifest.incus_workstations_root | default(incus_workstations_root) }}` (completions, VM dotfiles staging, manifest itself; siblings under `ansible-managed/` untouched)
  ansible.builtin.file:
    path: "{{ _incus_workstations_manifest.incus_workstations_root | default(incus_workstations_root) }}"
    state: absent
