# How to Reload Tmux Config:
#
# This can be done either from within tmux, by pressing Ctrl+B and then : to bring up a command prompt, and typing:
#
# :source-file ~/.tmux.conf
#
# Or simply from a shell:
#
# $ tmux source-file ~/.tmux.conf

#======================================================
# Terminal
#======================================================
set-option -g default-shell /bin/zsh
set -g default-terminal "xterm-256color"
#set -g default-terminal "screen-256color"

#======================================================
# Reload Configuration
#======================================================
bind-key R source-file ~/.tmux.conf  # don't use double quote in here.

#======================================================
# Prefix
#======================================================
unbind C-b
unbind M-C-b
unbind M-B
set -g prefix M-=
#set -g prefix C-b

#======================================================
# Copy & Paste
#======================================================
#     [    enter copy-mode
#     ]    paste-buffer
bind-key C-y paste-buffer
bind-key M-y choose-buffer   # list-buffers 相較下就沒什麼用

#======================================================
# Navigation
#======================================================
bind-key = last-window
bind-key M-= last-window

bind-key M-BSpace next-window
bind-key M-DC next-window
bind-key BSpace next-window

bind-key - previous-window
bind-key M-- previous-window

#======================================================
# Session
#======================================================
bind-key z kill-session

#======================================================
# Pan
#======================================================
# bind-key h select-layout even-horizontal
# bind-key v select-layout even-vertical

# Split the current pane; the new pane opens in the current pane's directory.
# Keys follow the DIVIDER-LINE intuition, i.e. the OPPOSITE of tmux's -h/-v names:
#   Alt+h = Horizontal divider line -> top/bottom stack -> split-window -v
#   Alt+v = Vertical   divider line -> left/right split  -> split-window -h
bind-key M-h split-window -v -c "#{pane_current_path}"
bind-key M-v split-window -h -c "#{pane_current_path}"

# Move focus between panes (prefix, then Alt+s/x/z/c). Layout centred on x:
# s=up, x=down, z=left, c=right. `-r` = repeatable within repeat-time (press prefix
# once, then tap directions). NB: bare `z` is kill-session; Alt+z is move-left.
bind-key -r M-s select-pane -U
bind-key -r M-x select-pane -D
bind-key -r M-z select-pane -L
bind-key -r M-c select-pane -R

bind-key k confirm-before -p "kill-window #W? (y/n)" kill-window

#======================================================
# Interface
#======================================================
# Mouse support (tmux >= 2.1): one switch for click-to-select-pane, click-to-select-
# window, drag-to-resize, and wheel-scroll (enters copy-mode). Replaces the pre-2.1
# mode-mouse / mouse-select-pane / mouse-select-window / mouse-resize-pane options.
# Note: with mouse on, drag-to-select is captured by tmux; hold Shift to use the
# terminal's own text selection / clipboard.
set -g mouse on
# Pane titles: draw a coloured label on each pane's border instead of a bare thin
# line, so the focused split stands out (tmux >= 2.3).
# NOTE: `pane-border-status top` does NOT auto-hide for a single pane - it draws the
# line even with one pane. To show it "only when split", default it off and let a
# window-layout-changed hook flip it to top only while the window holds >1 pane
# (verified on tmux 3.5: 1 pane -> off, 2+ panes -> top).
set -g pane-border-status off
set-hook -g window-layout-changed 'if-shell -F "#{==:#{window_panes},1}" "set -w pane-border-status off" "set -w pane-border-status top"'
# Active pane: orange label; inactive: dim grey. Inline `fill=` does NOT span the
# border line in pane-border-format (it stayed only under the text), so keep a coloured
# label and just widen it: the trailing spaces below are right padding that extend the
# coloured block rightward. Adjust the number of trailing spaces to taste.
# Keep each attribute in its own #[...] - a comma in #[fg=x,bg=y] would break the
# #{?pane_active,...,...} conditional's comma parsing.
set -g pane-border-format "#{?pane_active,#[bg=#ff8700]#[fg=#3a3a3a]#[bold],#[bg=#5a5a5a]#[fg=#bcbcbc]} #P #{pane_current_command}            #[default]"
set -g pane-border-style "fg=#5a5a5a"
set -g pane-active-border-style "fg=#ff8700"

#======================================================
# Status Bar
#======================================================
set-option -g display-time 10000  # the duration that message displaying in status-bar (milliseconds)
set-option -g status on
set-option -g status-interval 1
# set-option -g status-utf8 on  # [DEPRECATED?]

setw -g window-status-format "#[fg=orange]#[bg=#5a5a5a] #I:#[bg=#5a5a5a]#[fg=white]#W"
setw -g window-status-current-format "#[bg=#5a5a5a]#[fg=#ff8700,bold] [ #I:#[fg=#ff8700,bold]#[bg=#5a5a5a]#W ]"
#setw -g window-status-content-attr bold,blink,reverse  # [DEPRECATED?]
set-option -g status-justify "left"
set-option -g status-left-length 60
set-option -g status-right-length 90
set-option -g status-position bottom
set -g status-fg white
set -g status-bg "#5a5a5a"
# `#H` is tmux's built-in hostname (from gethostname), not the shell's $HOSTNAME:
# `#(echo $HOSTNAME)` renders blank wherever the shell doesn't export HOSTNAME (this
# VM's sh doesn't), and it also forks a shell every status refresh. `#H` needs neither.
set -g status-left '#[bg=#afd7ff]#[fg=#005f87] #(echo $USER) #[fg=#5fafd7]@ #[fg=#333333]#H '
set -g status-right "#{?client_prefix,#[reverse]<Prefix>#[noreverse] ,} #{session_name}:#{window_index}.#{pane_index} | #[bg=#d7ff87]#[fg=#3a3a3a] %Y-%m-%d | #[fg=#008700]%H:%M:%S "

bind-key , command-prompt -I "#W" "rename-window '%%'"

# set -g status-left '#[bg=#5fafd7]#[fg=#ffffff] #(echo $USER) #[bg=#5a5a5a]#[fg=#5fafd7]'
