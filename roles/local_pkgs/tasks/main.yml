---
- name: Skip `local_pkgs` role unless `setup_local_pkgs` is true
  ansible.builtin.debug:
    msg: "Skipping local_pkgs (setup_local_pkgs={{ setup_local_pkgs | default(false) }})."
  when: not setup_local_pkgs | default(false) | bool

# =============================================
# Create per-tool subdirs under `~/.local-pkgs/`
# =============================================
# `bin/` is created up-front so the first `npm install -g foo` etc. does not
# have to mkdir. The other dirs (`lib/`, `share/`, ...) each tool creates
# itself as needed.

- name: Create `{{ target_home }}/.local-pkgs/<tool>/bin/` for each of npm / pip / pipx / cargo / go
  ansible.builtin.file:
    path: "{{ target_home }}/.local-pkgs/{{ item }}/bin"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_group }}"
    mode: "0755"
  loop:
    - npm
    - pip
    - pipx
    - cargo
    - go
  when: setup_local_pkgs | default(false) | bool

# =============================================
# Deploy the env file sourced by `.zshrc` / `.bashrc`
# =============================================
# Sourced unconditionally by the shell rc templates (with an `[ -f ... ]`
# guard). When `setup_local_pkgs: false`, the file is absent and the guard
# makes the source line a no-op.

- name: Deploy `{{ target_home }}/.local-pkgs/local-pkgs.env.sh`
  ansible.builtin.copy:
    src: local-pkgs.env.sh
    dest: "{{ target_home }}/.local-pkgs/local-pkgs.env.sh"
    owner: "{{ target_user }}"
    group: "{{ target_group }}"
    mode: "0644"
  when: setup_local_pkgs | default(false) | bool

# =============================================
# Deploy `~/.config/pip/pip.conf` so `pip install foo` defaults to --user
# =============================================

- name: Ensure `{{ target_home }}/.config/pip/` exists
  ansible.builtin.file:
    path: "{{ target_home }}/.config/pip"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_group }}"
    mode: "0755"
  when: setup_local_pkgs | default(false) | bool

- name: Deploy `{{ target_home }}/.config/pip/pip.conf` (defaults `pip install` to `--user`)
  ansible.builtin.copy:
    src: pip.conf
    dest: "{{ target_home }}/.config/pip/pip.conf"
    owner: "{{ target_user }}"
    group: "{{ target_group }}"
    mode: "0644"
  when: setup_local_pkgs | default(false) | bool
