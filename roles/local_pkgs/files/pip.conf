# =============================================================================
# Make `pip install foo` default to --user mode, writing into $PYTHONUSERBASE
# (set to ~/.local-pkgs/pip by ~/.local-pkgs/local-pkgs.env.sh).
#
# Inside a venv pip ignores `user = true` and writes to the venv as normal,
# so this does not break venv workflows.
[install]
user = true
