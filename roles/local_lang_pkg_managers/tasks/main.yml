---
# Redirect npm / pip / pipx / cargo / go GLOBAL installs out of `~/.local/{bin,share}`
# into a dedicated `~/.local-lang-pkg-managers/<tool>/` tree, so `~/.local/` stays
# reserved for XDG + ansible-managed dotfiles. Opt-in: run only via its dedicated
# playbook / `make apply-local-lang-pkg-managers` (no `setup_*` gate - the role runs
# unconditionally when included). See README.md for the rationale.

- name: Create `{{ target_home }}/.local-lang-pkg-managers/<tool>/bin/` for each of npm / pip / pipx / cargo / go
  ansible.builtin.file:
    path: "{{ target_home }}/.local-lang-pkg-managers/{{ item }}/bin"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_group }}"
    mode: "0755"
  loop:
    - npm
    - pip
    - pipx
    - cargo
    - go

# The env file is sourced by `.zshrc` / `.bashrc` behind an `[ -f ... ]` guard, so
# when this role was never applied the file is absent and the source line no-ops.
- name: Deploy `{{ target_home }}/.local-lang-pkg-managers/local-lang-pkg-managers.env.sh`
  ansible.builtin.copy:
    src: local-lang-pkg-managers.env.sh
    dest: "{{ target_home }}/.local-lang-pkg-managers/local-lang-pkg-managers.env.sh"
    owner: "{{ target_user }}"
    group: "{{ target_group }}"
    mode: "0644"

- name: Ensure `{{ target_home }}/.config/pip/` exists
  ansible.builtin.file:
    path: "{{ target_home }}/.config/pip"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_group }}"
    mode: "0755"

- name: Deploy `{{ target_home }}/.config/pip/pip.conf` (defaults `pip install` to `--user`)
  ansible.builtin.copy:
    src: pip.conf
    dest: "{{ target_home }}/.config/pip/pip.conf"
    owner: "{{ target_user }}"
    group: "{{ target_group }}"
    mode: "0644"
