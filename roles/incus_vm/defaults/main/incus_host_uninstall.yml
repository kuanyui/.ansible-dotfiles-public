---
# Per-step toggles for tasks/incus_host_uninstall.yml (run on
# `incus_vm_state: absent`, gated also on `not incus_vm_skip_host_setup`).
# Loaded automatically (Ansible reads every file in defaults/main/).
#
# DESIGN: each teardown step is OFF by default, so a plain `incus_vm_state:
# absent` removes ONLY the user-space `ivm` tool (tasks/ivm_uninstall.yml) and
# does NOTHING to the host's incus daemon/state. You opt INTO each reversal by
# flipping its toggle. This makes the destructive teardown granular and explicit
# - the same footgun-avoidance posture as ivm_uninstall.yml refusing to delete
# VMs. The distro `incus` / `guestfs-tools` PACKAGES are NEVER removed (no
# toggle): uninstalling this role should not yank packages the rest of the
# system may use.
#
# FULL TEARDOWN ("reset incus to fresh-installed, keep packages"): easiest is
#   make unapply-incus-host
# which runs the uninstall playbook with every destructive toggle EXCEPT group
# removal (see INCUS_VM_HOST_TEARDOWN_FLAGS in the Makefile; add group removal or
# customize by overriding it). `make unapply-incus-vm` is the safe one - removes
# only `ivm`, no toggles, no become. To set the toggles by hand instead -
#   ansible-playbook playbooks/incus_vm_uninstall.yml --ask-become-pass \
#     -e incus_vm_uninstall_delete_all_instances=true \
#     -e incus_vm_uninstall_delete_autocreated_user_projects=true \
#     -e incus_vm_uninstall_delete_incusbr0_network=true \
#     -e incus_vm_uninstall_delete_default_storage_pool=true \
#     -e incus_vm_uninstall_disable_incus_daemon_and_socket=true \
#     -e incus_vm_uninstall_revert_firewalld_incusbr0_zone=true \
#     -e incus_vm_uninstall_remove_user_from_incus_group=true
#
# DEPENDENCY: deleting the `default` storage pool requires that nothing still
# references it - no instances (`delete_all_instances`) AND no per-user project
# (each `user-*` project's auto default profile pins the shared pool, so
# `delete_autocreated_user_projects` too). The task order in
# tasks/incus_host_uninstall.yml enforces this; just enable the prerequisites.

# Reverse of "Add user to `incus` group". Removes the invoking user from the
# `incus` group. Reversible (re-add by re-running install). NOTE: after this the
# user loses CLI access to any still-existing VMs in their `user-<uid>` project
# until re-added + re-login; the VM disks themselves are untouched.
incus_vm_uninstall_remove_user_from_incus_group: false

# Reverse of "Ensure `incusbr0` is in the firewalld `trusted` zone". Moves
# `incusbr0` back out of `trusted` (to the firewalld default zone). Host-local,
# low risk, no-op on non-firewalld hosts or if `incusbr0` is already gone.
incus_vm_uninstall_revert_firewalld_incusbr0_zone: false

# Reverse of "Ensure `incus.service` / `incus-user.socket` started + enabled".
# Stops + disables BOTH. WARNING: shared host state - this stops incus for ALL
# users and ALL projects on the host, not just this role's VMs. Leave false
# unless you really want the daemon down.
incus_vm_uninstall_disable_incus_daemon_and_socket: false

# DESTRUCTIVE. Deletes every incus instance in every project (`incus delete
# --force`). Irreversibly destroys VM disks + snapshots. Prerequisite for
# deleting the `default` storage pool.
incus_vm_uninstall_delete_all_instances: false

# Deletes the per-user projects (`user-*`) and per-user bridges (`incusbr-*`)
# that incus-user AUTO-CREATES for unprivileged `incus`-group members. The role
# does not create these, but a full teardown clears them (this is what wipes a
# half-baked `incusbr-1000` that came up with no IPv4). Deletes instances in
# those projects as part of removing them. ALSO a prerequisite for deleting the
# `default` pool: each user-* project's auto default profile pins that pool.
incus_vm_uninstall_delete_autocreated_user_projects: false

# Reverse of preseed's `incusbr0` bridge. Detaches the default-project `default`
# profile's `eth0`, then deletes the `incusbr0` network. Orthogonal to the
# storage pool below - a separate toggle so you can drop the bridge without
# touching VM data (or vice versa).
incus_vm_uninstall_delete_incusbr0_network: false

# DESTRUCTIVE. Reverse of preseed's `default` storage pool. Detaches the
# default-project `default` profile's `root`, then deletes the pool - which
# ERASES its contents (the btrfs/zfs loop file or the dir tree = your VM disks).
# Fails unless nothing references it: see DEPENDENCY above (enable
# `delete_all_instances` + `delete_autocreated_user_projects`).
incus_vm_uninstall_delete_default_storage_pool: false

# Confirmation gate (tasks/incus_host_uninstall.yml, Step 0). When ANY toggle
# above is on, the teardown prints what it will do + the equivalent copy-paste
# command and requires typing `yes` before any destructive step. Set true to skip
# that prompt for non-interactive automation (the steps + command are still
# logged). Default false = always confirm. The safe `unapply-incus-vm` path (all
# toggles off) never prompts regardless.
incus_vm_uninstall_assume_yes: false
