---
# Host-level incus daemon prep vars (see tasks/incus_host_install.yml). Folded in
# from the former `_incus_host_setup` role. Loaded automatically: Ansible reads
# every file in a role's `defaults/main/` directory.
# (Uninstall toggles live in the sibling defaults/main/incus_host_uninstall.yml.)

# `incus_vm_skip_host_setup`: skip the host-level prep
# (`tasks/incus_host_install.yml`: apt install incus + guestfs-tools, daemon
# enable+start, `incus-user.socket` enable+start, `incus` group add (lower-privilege
# than `incus-admin`; the client auto-detects `unix.socket.user`), `incus admin
# init --preseed`). Only the user-space `ivm` install runs. Used by the sandbox
# / by users who manage incus themselves. Off by default.
incus_vm_skip_host_setup: false

# `incus_install_assume_yes`: skip the interactive first-time storage-pool
# confirmation (the `pause` in `tasks/incus_host_install.yml`). Off by default, so
# a first-time `make incus-install` prompts before `incus admin init` bakes in the
# pool layout. Set true for non-interactive runs (CI / cron / direct
# `ansible-playbook`). Mirrors `incus_vm_uninstall_assume_yes`. Once a `default`
# pool exists the confirmation is skipped regardless (nothing is re-applied).
incus_install_assume_yes: false

# ---------- Storage pool config (preseed-only, first-time init) ----------
# These three vars feed into the `default` storage_pool block of
# `templates/incus_preseed.yml.j2`. They are EFFECTIVE ONLY at first-time
# `incus admin init --preseed`; already-initialized incus won't be re-pointed.
# To change pool layout after the fact: `incus storage create <new-pool> ...`
# + manual `incus move` of VMs, then `incus storage delete default`.
#
# ---------- Why this project's default is `btrfs` + loop file on `/home` ----------
# The project targets hosts where `/` is a small btrfs system partition (often
# ~160-180 GB; openSUSE Tumbleweed installer defaults look like this) and
# `/home` is a much larger ext4 partition (e.g. 1.8 TB). Putting Incus VM
# disks directly on `/` would run it out of space fast.
#
# So the role's default is: create a btrfs loop file at `/home/incus-storage.img`
# (sparse - actual `/home` usage starts near zero and grows as VMs write),
# point the `default` pool at it. btrfs gives cheap CoW snapshots; the loop
# file gets us btrfs semantics without repartitioning ext4 `/home`.
#
# Override in `host_vars/<hostname>.yml` for any machine that doesn't fit:
# see Examples block below.


# Examples for `host_vars/<hostname>.yml`:
#
#   # (this role's default - no override needed) btrfs loop file on `/home`.
#   # Recommended for the project's typical hosts (small btrfs `/`, big ext4
#   # `/home`); CoW makes per-VM disk + snapshot cheap.
#   incus_storage_pool_driver: btrfs
#   incus_storage_pool_source: /home/incus-storage.img
#   incus_storage_pool_size: 500GiB
#
#   # Override: Incus's built-in default behavior (dir backend at
#   # `/var/lib/incus/storage-pools/default/` on `/`). No CoW. Only fine on
#   # hosts where `/` has plenty of free space.
#   incus_storage_pool_driver: dir
#   incus_storage_pool_source: ""
#   incus_storage_pool_size: ""
#
#   # Override: plain dir on a sidecar disk mounted at /data
#   incus_storage_pool_driver: dir
#   incus_storage_pool_source: /data/vm/incus
#   incus_storage_pool_size: ""
#
#   # Override: zfs loop file on /home
#   incus_storage_pool_driver: zfs
#   incus_storage_pool_source: /home/incus-storage.zfs
#   incus_storage_pool_size: 500GiB



# `incus_storage_pool_driver`: which backend Incus creates the `default` pool
# with. Affects per-VM disk cost + snapshot semantics:
#   - `dir`        full copy per VM, no CoW. Works on any FS. Slow snapshots.
#   - `btrfs`      CoW reference per VM + per snapshot, near-zero space cost.
#                  This role's default (see rationale above).
#   - `zfs`        same idea, ZFS clones. Requires zfsutils on host.
#   - `lvm-thin`   thin LV per VM. Requires an LVM thin pool already configured.
incus_storage_pool_driver: btrfs

# `incus_storage_pool_source`: where the pool lives on disk. Semantics
# depend on `incus_storage_pool_driver`. See
# https://linuxcontainers.org/incus/docs/main/reference/storage_btrfs/
# (and the equivalent zfs / lvm pages) for the official enumeration:
#
#   - `dir`:    A directory path; Incus drops VM root.img files inside.
#               Empty -> Incus default `/var/lib/incus/storage-pools/default/`.
#
#   - `btrfs`:  (a) EMPTY source (+ `incus_storage_pool_size`) -> the ONLY
#                   incus-CREATED loop file: a sparse `.img` at
#                   `/var/lib/incus/disks/<pool>.img` (on `/`), btrfs inside. For a
#                   big `/home`, relocate `/var/lib/incus` first (docs/incus-host-setup.md).
#               (b) Existing btrfs SUBVOLUME path. No size, no loop file.
#               (c) Existing BLOCK DEVICE. `mkfs.btrfs` on it. No size.
#               (!) A plain file path that doesn't exist (e.g. `/home/incus-storage.img`)
#                   does NOT make a loop file - incus runs `btrfs subvolume create`
#                   on it and FAILS on non-btrfs `/home` ("Inappropriate ioctl").
#
#   - `zfs`:    (a) EMPTY source (+ size) -> file-vdev zpool loop at the default
#                   path (on `/`). (b) Existing dataset name (no leading `/`).
#                   (c) Block device. (!) A plain file path is REJECTED at validation.
#
#   - `lvm-thin`: Name of an existing LVM thin pool (`<vg>/<thinpool>`, no leading
#               `/`), already created on the host.
#
# Project default: a btrfs loop file on `/home`. incus itself can ONLY create a
# loop file at `/var/lib/incus/disks/` (on `/`), so the ROLE builds this one: when
# `driver` is `btrfs`, this `source` is a `.img` file path (existing or not), and a
# `size` is set, the role `truncate`s + `mkfs.btrfs`-es the file and loop-mounts it
# (via /etc/fstab) at `incus_storage_pool_loop_mountpoint`, then points the pool at
# that mount. Put the `.img` on whatever big disk you want. Other forms still work
# unchanged: empty (incus's own loop on `/`), an existing btrfs subvolume / zfs
# dataset / block device, or `dir` driver + a directory (no CoW).
incus_storage_pool_source: /home/incus-storage.img

# Where the role loop-mounts the btrfs `.img` above (only used when it builds a loop
# file). Just a mount point on `/` - the real blocks live in the `.img` on its disk.
incus_storage_pool_loop_mountpoint: /var/lib/incus-storage

# `incus_storage_pool_size`: the loop file's declared size - used both by the role's
# `.img` build (when `source` is a file path) and by incus's own empty-source loop.
# Sparse: actual disk use starts near zero and grows. Leave EMPTY for an existing
# subvolume / dataset / block device / dir. Sizes: `GiB` / `TiB`, e.g. `500GiB`.
incus_storage_pool_size: 500GiB
