---
# `incus_vm_skip_host_setup`: skip the shared host-level prep
# (`roles/_incus_host_setup`: apt install incus + guestfs-tools, daemon
# enable+start, `incus-admin` group add, `incus admin init --preseed`). Only the
# user-space `ivm` install runs. Used by the sandbox / by users who manage incus
# themselves. Off by default.
incus_vm_skip_host_setup: false

# `incus_vm_state`:
#   - `present` (default): install the `ivm` engine + schema + example
#     templates + the staged user/root dotfiles.
#   - `absent`: remove the `ivm` binary + this role's subdir. Does NOT delete
#     any incus VMs (those are the user's; use `ivm delete` per-VM).
incus_vm_state: present

# This role's own subdir under `~/.local/share/ansible-managed/` (sibling of
# `incus-agents/`). Holds `vm.schema.json`, `vm-templates/`, and the `vm-rootfs/`
# dotfiles staging that `ivm` pushes into guests. Uninstall = `rm -rf` it.
incus_vm_root: "{{ ansible_facts['env']['HOME'] }}/.local/share/ansible-managed/incus-vm"
incus_vm_bin_dir: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
