---
# Stage the guest VM's shell dotfiles host-side, in TWO variants (`user` +
# `root`), for `ivm` to push into the guest at `init` time. Internal to
# `roles/incus_vm` (folded in from the former `_incus_guest_setup_dotfiles` once
# incus_vm became the sole consumer); the caller (install.yml) passes the
# staging root as `incus_vm_dotfiles_staging_root`.
#
# Renders ONE tree per ansible_os_family (the only distro-dependent bit of the
# dotfiles is the min-install helper in `.zshrc.j2`: `apt-min` vs `zypper-min`
# / `dnf-min`). Which families to produce is controlled by
# `incus_vm_dotfiles_ansible_os_families` (default `['Debian']`):
#   <root>/vm-rootfs/<ansible_os_family>/home/user/   (is_root=false)
#   <root>/vm-rootfs/<ansible_os_family>/root/        (is_root=true)
# `ivm` pushes the subtree matching the template's `os.distro` -> ansible_os_family.
# The push sends `<family>/home/user` -> /home/user and `<family>/root` ->
# /root. `user` and `root` are different identities, so each needs its own
# `is_root` render (e.g. root gets the red prompt, no redundant `sudo`). Mirrors
# how `roles/container_templates` renders per-`who` dotfiles.
#
# LINUX/unix guests only. A future Windows guest needs a different host-side
# payload (unattend.xml / cloudbase-init) and has no shell dotfiles.

- name: Assert `incus_vm_dotfiles_staging_root` was provided by the caller
  ansible.builtin.assert:
    that:
      - incus_vm_dotfiles_staging_root is defined
      - incus_vm_dotfiles_staging_root | length > 0
    fail_msg: >-
      `incus_vm_dotfiles_staging_root` must be set by the caller, e.g.
      `{{ incus_vm_root | default('<unset>') }}`.
      Staging is created at `<root>/vm-rootfs/<ansible_os_family>/{home/user,root}`.

- name: "Stage dotfiles per `incus_vm_dotfiles_ansible_os_families` entry (one tree per family)"
  ansible.builtin.include_tasks: _stage_family.yml
  loop: "{{ incus_vm_dotfiles_ansible_os_families | default(['Debian']) }}"
  loop_control:
    loop_var: incus_vm_dotfiles_ansible_os_family
