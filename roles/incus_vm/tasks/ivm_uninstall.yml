---
# Remove `ivm` + this role's subdir. Does NOT delete any incus VMs:
#   - they are deliberately persistent (snapshots, long-running state);
#   - bulk-deleting our `v-*` / tagged VMs would be a footgun.
# To remove a VM: `ivm delete` in its dir, or `incus list` + `incus delete`.

- name: Remove the `ivm` binary `{{ incus_vm_bin_dir }}/ivm`
  ansible.builtin.file:
    path: "{{ incus_vm_bin_dir }}/ivm"
    state: absent

- name: Wipe `incus_vm`'s subdir `{{ incus_vm_root }}` (schema, templates, dotfiles staging; siblings under `ansible-managed/` untouched)
  ansible.builtin.file:
    path: "{{ incus_vm_root }}"
    state: absent
