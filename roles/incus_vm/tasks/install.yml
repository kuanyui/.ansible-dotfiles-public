---
# Install the `ivm` engine (replaces the old per-entry bash launchers). The
# engine reads VM templates at runtime and drives incus from the HOST; the guest
# gets no ansible/python. See files/ivm + REDESIGN.md / IMPLEMENTATION_PLAN.md.
# Host-level prep (apt incus, `incus admin init`, group add) is shared with
# `roles/incus_agents` via `roles/_incus_host_setup` (run from tasks/main.yml).

- name: Ensure `ivm` host deps (PyYAML + jsonschema) via `roles/_install_distro_packages`
  ansible.builtin.include_role:
    name: _install_distro_packages
  vars:
    install_distro_packages:
      Debian:
        install: [python3-yaml, python3-jsonschema]
        probe: 'python3 -c "import yaml, jsonschema"'
      Suse:
        install: [python3-PyYAML, python3-jsonschema]
        probe: 'python3 -c "import yaml, jsonschema"'
      RedHat:
        install: [python3-pyyaml, python3-jsonschema]
        probe: 'python3 -c "import yaml, jsonschema"'

- name: Ensure `incus_vm_bin_dir` + `incus_vm_root` exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ incus_vm_bin_dir }}"
    - "{{ incus_vm_root }}"

- name: Install the `ivm` engine to `{{ incus_vm_bin_dir }}/ivm`
  ansible.builtin.copy:
    src: ivm
    dest: "{{ incus_vm_bin_dir }}/ivm"
    mode: "0755"

- name: Install the VM definition schema to `{{ incus_vm_root }}/vm.schema.json`
  ansible.builtin.copy:
    src: vm.schema.json
    dest: "{{ incus_vm_root }}/vm.schema.json"
    mode: "0644"

- name: Install the example VM templates to `{{ incus_vm_root }}/vm-templates/`
  ansible.builtin.copy:
    src: vm-templates/
    dest: "{{ incus_vm_root }}/vm-templates/"
    mode: "0644"

# ---------- Stage VM dotfiles (user + root variants) ----------
# Rendered host-side by the shared `roles/_incus_guest_setup_dotfiles` into
# `{{ incus_vm_root }}/vm-rootfs/{home/user,root}`; `ivm` pushes them into the
# guest at init. Hardcodes Debian for now (multi-distro staging is a later phase).
- name: Stage VM dotfiles (user + root variants) via `roles/_incus_guest_setup_dotfiles`
  ansible.builtin.include_role:
    name: _incus_guest_setup_dotfiles
  vars:
    incus_guest_setup_dotfiles_root: "{{ incus_vm_root }}"

# NOTE: two-level `ivm` shell completion is a later phase (IMPLEMENTATION_PLAN
# phase 3); not installed here yet.
