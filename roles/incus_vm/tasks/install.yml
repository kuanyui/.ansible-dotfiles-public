---
# Install the `ivm` engine (replaces the old per-entry bash launchers). The
# engine reads VM templates at runtime and drives incus from the HOST; the guest
# gets no ansible/python. See files/ivm + REDESIGN.md / IMPLEMENTATION_PLAN.md.
# Host-level prep (apt incus, `incus admin init`, group add) is shared with
# `roles/incus_agents` via `roles/_incus_host_setup` (run from tasks/main.yml).

- name: Ensure `ivm` host deps (PyYAML + jsonschema) via `roles/_install_distro_packages`
  ansible.builtin.include_role:
    name: _install_distro_packages
  vars:
    install_distro_packages:
      Debian:
        install: [python3-yaml, python3-jsonschema]
        probe: 'python3 -c "import yaml, jsonschema"'
      Suse:
        install: [python3-PyYAML, python3-jsonschema]
        probe: 'python3 -c "import yaml, jsonschema"'
      RedHat:
        install: [python3-pyyaml, python3-jsonschema]
        probe: 'python3 -c "import yaml, jsonschema"'

- name: Ensure `incus_vm_bin_dir` + `incus_vm_root` + completion dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ incus_vm_bin_dir }}"
    - "{{ incus_vm_root }}"
    - "{{ incus_vm_zsh_completion_dir }}"
    - "{{ incus_vm_bash_completion_dir }}"

- name: Install the `ivm` engine to `{{ incus_vm_bin_dir }}/ivm`
  ansible.builtin.copy:
    src: ivm
    dest: "{{ incus_vm_bin_dir }}/ivm"
    mode: "0755"

- name: Install the VM definition schema to `{{ incus_vm_root }}/vm.schema.json`
  ansible.builtin.copy:
    src: vm.schema.json
    dest: "{{ incus_vm_root }}/vm.schema.json"
    mode: "0644"

- name: Install the example VM templates to `{{ incus_vm_root }}/vm-templates/`
  ansible.builtin.copy:
    src: vm-templates/
    dest: "{{ incus_vm_root }}/vm-templates/"
    mode: "0644"

# ---------- Materialize the distro_packages bundle registry for `ivm` ----------
# `ivm` runs host-side at `init` time, where ansible (and thus the
# `distro_packages_*` vars) no longer exist. So snapshot the registry to JSON at
# apply time; `ivm` reads it to resolve a template's `distro_package_groups` +
# the always-on `incus_guest_baseline` into a flat per-ansible_os_family package list.
# Single source of truth stays in `roles/distro_packages/defaults/main.yml`.
- name: Load the `distro_packages` bundle registry (sibling role's defaults)
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../distro_packages/defaults/main.yml"

- name: Render the bundle registry to `{{ incus_vm_root }}/package-groups.json`
  ansible.builtin.copy:
    dest: "{{ incus_vm_root }}/package-groups.json"
    mode: "0644"
    content: |
      {{ {
        'basic_tools': distro_packages_basic_tools,
        'sys_tools': distro_packages_sys_tools,
        'net_tools': distro_packages_net_tools,
        'wayland_tools': distro_packages_wayland_tools,
        'incus_guest_baseline': distro_packages_incus_guest_baseline,
      } | to_nice_json }}

# ---------- Stage VM dotfiles (user + root variants, per ansible_os_family) ----------
# Rendered host-side by the shared `roles/_incus_guest_setup_dotfiles` into
# `{{ incus_vm_root }}/vm-rootfs/<ansible_os_family>/{home/user,root}`; at init `ivm`
# pushes the subtree matching the template's `os.distro` -> ansible_os_family (the
# min-install helper differs: apt-min / zypper-min / dnf-min). We stage every
# family `ivm` can target so any template's distro has its tree ready.
- name: Stage VM dotfiles per ansible_os_family via `roles/_incus_guest_setup_dotfiles`
  ansible.builtin.include_role:
    name: _incus_guest_setup_dotfiles
  vars:
    incus_guest_setup_dotfiles_root: "{{ incus_vm_root }}"
    incus_guest_setup_dotfiles_ansible_os_families: [Debian, Suse, RedHat]

# ---------- `ivm` shell completion (two levels: subcommand, then template) ----------
# Auto-discovered by the rc globs (no rc edits): zsh via the
# `ansible-managed/*/zsh-completions` fpath glob, bash via the
# `ansible-managed/*/bash-completions/*` source loop.
- name: Install `ivm` zsh completion to `{{ incus_vm_zsh_completion_dir }}/_ivm`
  ansible.builtin.copy:
    src: completions/_ivm
    dest: "{{ incus_vm_zsh_completion_dir }}/_ivm"
    mode: "0644"

- name: Install `ivm` bash completion to `{{ incus_vm_bash_completion_dir }}/ivm`
  ansible.builtin.copy:
    src: completions/ivm.bash
    dest: "{{ incus_vm_bash_completion_dir }}/ivm"
    mode: "0644"
