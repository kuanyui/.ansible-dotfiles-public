---
# Install `ivm` (the launcher; replaces the old per-entry bash launchers).
# `ivm` reads VM templates at runtime and drives incus from the HOST; the guest
# gets no ansible/python. See files/ivm + REDESIGN.md / IMPLEMENTATION_PLAN.md.
# Host-level prep (apt incus, `incus admin init`, group add) is done by
# tasks/incus_host_install.yml (run from tasks/main.yml).

- name: Ensure `ivm` host deps (PyYAML + jsonschema) via `roles/_install_distro_packages`
  ansible.builtin.include_role:
    name: _install_distro_packages
  vars:
    install_distro_packages:
      Debian:
        install: [python3-yaml, python3-jsonschema]
        probe: 'python3 -c "import yaml, jsonschema"'
      Suse:
        install: [python3-PyYAML, python3-jsonschema]
        probe: 'python3 -c "import yaml, jsonschema"'
      RedHat:
        install: [python3-pyyaml, python3-jsonschema]
        probe: 'python3 -c "import yaml, jsonschema"'

- name: Ensure `incus_vm_bin_dir` + `incus_vm_ivm_dir` + completion dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ incus_vm_bin_dir }}"
    - "{{ incus_vm_ivm_dir }}"
    - "{{ incus_vm_zsh_completion_dir }}"
    - "{{ incus_vm_bash_completion_dir }}"

- name: Install `ivm` to `{{ incus_vm_bin_dir }}/ivm`
  ansible.builtin.copy:
    src: ivm
    dest: "{{ incus_vm_bin_dir }}/ivm"
    mode: "0755"

# Read-only storage inspector shared by `ivm storage-status` AND the `incus-install`
# post-verify step (tasks/incus_host_install.yml runs it via the `script` module).
# Installed here so `ivm storage-status` finds it at `{{ incus_vm_ivm_dir }}/incus_storage_pool.py`.
- name: Install the storage-pool inspector to `{{ incus_vm_ivm_dir }}/incus_storage_pool.py` (powers `ivm storage-status`)
  ansible.builtin.copy:
    src: incus_storage_pool.py
    dest: "{{ incus_vm_ivm_dir }}/incus_storage_pool.py"
    mode: "0755"

- name: Install the VM definition schema to `{{ incus_vm_ivm_dir }}/template.schema.json`
  ansible.builtin.copy:
    src: template.schema.json
    dest: "{{ incus_vm_ivm_dir }}/template.schema.json"
    mode: "0644"

- name: Install the example VM templates to `{{ incus_vm_ivm_dir }}/templates/`
  ansible.builtin.copy:
    src: templates/
    dest: "{{ incus_vm_ivm_dir }}/templates/"
    mode: "0644"

# Record the storage pool layout so `ivm info` + the create/delete preview can show
# the REAL on-disk path - the unprivileged `incus`-group user can't read incus's own
# pool config (admin-only), so ivm reads this instead. Written only when the role set up
# the host (`not incus_vm_skip_host_setup`) AND `_storage.write_record` is true. The record
# content is `_storage.record`, decided by `incus_storage_pool.py resolve` in
# tasks/incus_host_install.yml: on a re-run of an initialized host it is the EXISTING record
# echoed back (so this write is a no-op), never re-derived from the passed/default vars -
# that is what stops a no-var re-run from repointing the record at the wrong `.img`.
# `_storage.write_record` is false when a `default` pool exists WITHOUT a usable record
# (a hand-initialized host, or after `make incus-uninstall-ivm` wiped the subdir): there
# `_storage.record` is just the passed/default VARS - not the live pool - and persisting it
# would make every later run FOLLOW that lie (e.g. the loud loop-img-missing STOP for an
# `.img` that never existed). Such hosts simply keep no record; `status` says "(none)".
- name: Record the storage pool layout to `{{ incus_vm_ivm_dir }}/storage-info.json` (so `ivm info` shows the real `.img` / path even to the unprivileged user; skipped when `_storage.write_record` is false - never record a layout the live pool may not have)
  ansible.builtin.copy:
    dest: "{{ incus_vm_ivm_dir }}/storage-info.json"
    mode: "0644"
    content: "{{ _storage.record | to_nice_json }}\n"
  when:
    - not (incus_vm_skip_host_setup | default(false) | bool)
    - _storage.write_record | bool

# Shared fcitx5 user-config setup script: `ivm` embeds + runs it in a guest with
# `sys.input_method: fcitx5`, and you can run this same copy on the HOST
# (`sh {{ incus_vm_ivm_dir }}/setup-fcitx5-input.sh`) - one source of truth.
- name: Install the fcitx5 setup script to `{{ incus_vm_ivm_dir }}/setup-fcitx5-input.sh`
  ansible.builtin.copy:
    src: setup-fcitx5-input.sh
    dest: "{{ incus_vm_ivm_dir }}/setup-fcitx5-input.sh"
    mode: "0755"

# ---------- Materialize the provision_distro_packages bundle registry for `ivm` ----------
# `ivm` runs host-side at `init` time, where ansible (and thus the
# `provision_distro_packages_*` vars) no longer exist. So snapshot the registry to JSON at
# apply time; `ivm` reads it to resolve a template's `distro_package_groups` +
# the always-on `incus_guest_baseline` into a flat per-ansible_os_family package list.
# Single source of truth stays in `roles/provision_distro_packages/defaults/main.yml`.
- name: Load the `provision_distro_packages` bundle registry (sibling role's defaults)
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../provision_distro_packages/defaults/main.yml"

- name: Render the bundle registry to `{{ incus_vm_ivm_dir }}/distro-package-groups.json`
  ansible.builtin.copy:
    dest: "{{ incus_vm_ivm_dir }}/distro-package-groups.json"
    mode: "0644"
    content: |
      {{ {
        'basic_tools': provision_distro_packages_basic_tools,
        'sys_tools': provision_distro_packages_sys_tools,
        'net_tools': provision_distro_packages_net_tools,
        'wayland_tools': provision_distro_packages_wayland_tools,
        'gui_x11': provision_distro_packages_gui_x11,
        'gui_wayland': provision_distro_packages_gui_wayland,
        'cjk_fonts': provision_distro_packages_cjk_fonts,
        'cjk_input': provision_distro_packages_cjk_input,
        'incus_guest_baseline': provision_distro_packages_incus_guest_baseline,
        'emacs': provision_distro_packages_emacs,
        'dev_qt': provision_distro_packages_dev_qt,
        'dev_android': provision_distro_packages_dev_android,
        'icewm_desktop': provision_distro_packages_icewm_desktop,
        'lxqt_desktop': provision_distro_packages_lxqt_desktop,
      } | to_nice_json }}

# ---------- Materialize the thirdparty_software recipe registry for `ivm` ----------
# Same rationale as the distro bundles above: `ivm` has no ansible at `init` time,
# so snapshot the `roles/provision_thirdparty_software` registry to JSON. `ivm` reads it to run
# a template's `thirdparty_software:` recipes in the guest (probe-then-install, as
# root). Source of truth stays in `roles/provision_thirdparty_software/defaults/main.yml`;
# adding a recipe means adding it to BOTH that file and this render dict.
- name: Load the `thirdparty_software` recipe registry (sibling role's defaults)
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../provision_thirdparty_software/defaults/main.yml"

- name: Render the recipe registry to `{{ incus_vm_ivm_dir }}/thirdparty-software.json`
  ansible.builtin.copy:
    dest: "{{ incus_vm_ivm_dir }}/thirdparty-software.json"
    mode: "0644"
    content: |
      {{ {
        'claude': provision_thirdparty_software_claude,
        'codex': provision_thirdparty_software_codex,
        'dev_rust': provision_thirdparty_software_dev_rust,
        'dev_android': provision_thirdparty_software_dev_android,
      } | to_nice_json }}

# ---------- Stage VM dotfiles (user + root variants, per ansible_os_family) ----------
# Rendered host-side by tasks/stage_dotfiles.yml into
# `{{ incus_vm_ivm_dir }}/rootfs/<ansible_os_family>/{home/user,root}`; at init `ivm`
# pushes the subtree matching the template's `os.distro` -> ansible_os_family (the
# min-install helper differs: apt-min / zypper-min / dnf-min). We stage every
# family `ivm` can target so any template's distro has its tree ready.
- name: Stage VM dotfiles per ansible_os_family (tasks/stage_dotfiles.yml)
  ansible.builtin.include_tasks: stage_dotfiles.yml
  vars:
    incus_vm_dotfiles_staging_root: "{{ incus_vm_ivm_dir }}"
    incus_vm_dotfiles_ansible_os_families: [Debian, Suse, RedHat]

# ---------- Stage emacs config ONCE (distro-independent; NOT per-family) ----------
# The shell dotfiles are staged per ansible_os_family (because `.zshrc`'s min-install
# helper differs: apt-min/zypper-min/dnf-min). The emacs `.el` files are IDENTICAL on
# every distro, so stage ONE copy under config-files/emacs/ (no per-family duplication).
# `ivm` pushes it into a guest's ~/.emacs.d when the `emacs` config set is provisioned
# (`ivm provision emacs`). `user` variant only (is_root=false) - emacs is used as `user`.
- name: Ensure `{{ incus_vm_ivm_dir }}/config-files/emacs` exists (single, distro-independent emacs config tree)
  ansible.builtin.file:
    path: "{{ incus_vm_ivm_dir }}/config-files/emacs"
    state: directory
    mode: "0755"

- name: "Stage emacs config into `{{ incus_vm_ivm_dir }}/config-files/emacs/.emacs.d` (via `roles/emacs deploy-emacs-config.yml`)"
  ansible.builtin.include_role:
    name: emacs
    tasks_from: deploy-emacs-config.yml
  vars:
    target_home: "{{ incus_vm_ivm_dir }}/config-files/emacs"
    target_user: "{{ ansible_facts['user_id'] }}"
    target_group: "{{ ansible_facts['user_id'] }}"
    is_root: false

# ---------- `ivm` shell completion (subcommands, then their args) ----------
# Auto-discovered by the rc globs (no rc edits): zsh via the
# `ansible-managed/*/zsh-completions` fpath glob, bash via the
# `ansible-managed/*/bash-completions/*` source loop.
- name: Install `ivm` zsh completion to `{{ incus_vm_zsh_completion_dir }}/_ivm`
  ansible.builtin.copy:
    src: completions/_ivm
    dest: "{{ incus_vm_zsh_completion_dir }}/_ivm"
    mode: "0644"

- name: Install `ivm` bash completion to `{{ incus_vm_bash_completion_dir }}/ivm`
  ansible.builtin.copy:
    src: completions/ivm.bash
    dest: "{{ incus_vm_bash_completion_dir }}/ivm"
    mode: "0644"
