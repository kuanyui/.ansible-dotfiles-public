---
- name: Skip `incus_vm` role unless `setup_incus_vm` is true
  ansible.builtin.debug:
    msg: "Skipping incus_vm (setup_incus_vm={{ setup_incus_vm | default(false) }})."
  when: not setup_incus_vm | default(false) | bool

- when: setup_incus_vm | default(false) | bool
  block:
    - name: Validate `incus_vm_state` is `present` or `absent`
      ansible.builtin.assert:
        that: incus_vm_state in ['present', 'absent']
        fail_msg: "incus_vm_state must be `present` or `absent`, got `{{ incus_vm_state }}`."

    - name: Run host-level prep (apt install incus + guestfs-tools, preseed init, group add) via tasks/host_setup.yml
      ansible.builtin.include_tasks: host_setup.yml
      when:
        - incus_vm_state == 'present'
        - not (incus_vm_skip_host_setup | default(false) | bool)

    - ansible.builtin.include_tasks: ivm_install.yml
      when: incus_vm_state == 'present'

    - ansible.builtin.include_tasks: ivm_uninstall.yml
      when: incus_vm_state == 'absent'
