# yaml-language-server: $schema=../template.schema.json
template_name: claude
description: "Claude Code agent container (Debian; mounts cwd, hides .git/.vscode)"
image_name: debian:13
image_platform: linux/amd64
tz: host
runtimes:
  - crun
distro_package_groups:
  - tools_basic
  # emacs is NOT a default - run `pvm provision emacs` to add the editor + its ~/.emacs.d on demand
distro_packages:
  - curl
  - git
  - zsh              # the unprivileged user's login shell (+ the zsh dotfiles)
  - ca-certificates  # HTTPS trust for the claude curl|bash installer
thirdparty_software:
  - claude   # curl|bash installer; recipe in roles/provision_thirdparty_software/defaults/main.yml
dotfiles:
  - bash
  - tmux
  - zsh
hide_dirs:
  - .git
  - .vscode
agent:
  command: claude
  display_name: Claude Code
publish_ports: []
