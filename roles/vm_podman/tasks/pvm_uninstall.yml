---
# Remove `pvm` + this role's subdir. Does NOT remove podman (system-shared) or
# any built images/containers - those are pvm's runtime concern (`pvm rma` per
# project; or `podman image prune`). Packages are never removed.

- name: Remove the `pvm` binary `{{ vm_podman_bin_dir }}/pvm`
  ansible.builtin.file:
    path: "{{ vm_podman_bin_dir }}/pvm"
    state: absent

- name: Wipe `vm_podman`'s subdir `{{ vm_podman_root }}` (pvm program data + completions; siblings under `ansible-managed/` untouched; podman image/container storage untouched)
  ansible.builtin.file:
    path: "{{ vm_podman_root }}"
    state: absent

# The SHARED provision-asset cache is CO-PRODUCED by vm_incus + vm_quickemu + vm_podman -
# REF-COUNTED across all THREE: remove it ONLY when NEITHER other consumer (ivm, qvm) is
# installed, so uninstalling pvm never breaks `ivm`/`qvm provision`. The matching steps in
# ivm/qvm uninstall check the other two as well (see CLAUDE.md "Shared prebuilt-asset dirs").
- name: Load the shared-asset producer's defaults (for `_shared_prebuilt_provision_assets_dir`)
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../_shared_prebuilt_provision_assets/defaults/main.yml"

- name: Check whether `ivm` (a shared-cache consumer) is still installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/ivm"
  register: _other_launcher_ivm

- name: Check whether `qvm` (a shared-cache consumer) is still installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/qvm"
  register: _other_launcher_qvm

- name: Wipe the SHARED provision-asset cache `{{ _shared_prebuilt_provision_assets_dir }}` (only when NEITHER ivm nor qvm is installed)
  ansible.builtin.file:
    path: "{{ _shared_prebuilt_provision_assets_dir }}"
    state: absent
  when:
    - not _other_launcher_ivm.stat.exists
    - not _other_launcher_qvm.stat.exists
