---
# Registry of NON-distro install recipes - the sibling of `roles/provision_distro_packages`
# for everything that is NOT an apt/zypper/dnf package name: 3rd-party repos
# (vscode), `curl|bash` installers (agent_claude), npm/pip globals (agent_codex).
#
# Each `provision_thirdparty_software_<name>` is a per-`ansible_os_family` dict. Resolution
# is OVERRIDE, not additive (UNLIKE `provision_distro_packages`, which concatenates
# `__common__` + the family overlay): a piece of software has ONE install method,
# possibly varying by family - so use the host/guest family's entry if defined,
# else `__common__`. Each entry:
#   install_script    REQUIRED  shell run as ROOT in the guest; `su - user -c '...'`
#                               for user-scoped installs (root switches to anyone,
#                               no password).
#   already_installed OPTIONAL  probe run as root; rc 0 -> skip the install
#                               (idempotency, esp. for a future `ivm provision`
#                               re-run). Omit -> always run. Pick a probe that can
#                               only succeed when truly installed (a file test is
#                               more robust than `command -v` when the bin dir is
#                               not on the login PATH).
#
# `roles/_shared_prebuilt_provision_assets` materializes this to the shared
# `thirdparty-software.json` at apply time; `ivm` (later qvm/pvm) reads it and runs
# the recipes in a guest via `incus exec`. A template opts in with
# `thirdparty_software: [<name>]`. Adding a recipe = define it here AND add it to the
# render dict in `roles/_shared_prebuilt_provision_assets/tasks/main.yml` (same
# explicit pattern as the distro bundles). Launcher completions auto-track it (they
# read the rendered JSON at runtime) - no completion edit needed.

provision_thirdparty_software_agent_claude:
  description: "Claude Code CLI (claude.ai install script, user-scoped)"
  __common__:
    already_installed: su - user -c 'command -v claude'
    install_script: |
      # claude.ai/install.sh redirects to a `#!/bin/bash` bootstrap that uses
      # `[[ =~ ]]` - pipe to `bash` (present in the guest), NOT `sh` (dash chokes).
      su - user -c 'curl -fsSL https://claude.ai/install.sh | bash'

provision_thirdparty_software_agent_codex:
  description: "OpenAI Codex CLI (npm global, user-scoped; needs nodejs + npm)"
  __common__:
    # File test, not `command -v`: codex lands in ~/.local/npm_global/bin, which is
    # not necessarily on the login PATH, so a PATH probe could wrongly re-install.
    already_installed: su - user -c 'test -x ~/.local/npm_global/bin/codex'
    install_script: |
      # Needs nodejs + npm from the template's `provision_distro_packages`. npm prefix kept at
      # ~/.local/npm_global for now; switch to the centralize_lang_pkgs_dir tree when
      # that role rename lands (see TODO.md).
      su - user -c 'mkdir -p ~/.local/npm_global && npm config set prefix ~/.local/npm_global && npm install -g @openai/codex'

# Rust via rustup - the official, recommended install (rust-lang.org/tools/install).
# It downloads PREBUILT toolchain binaries (NOT source) into ~/.rustup + ~/.cargo as the
# unprivileged `user`. The stable toolchain already bundles rustc/cargo/clippy/rustfmt;
# rust-analyzer (editor LSP) is added on top - it is NOT in the default profile. Distro
# rustc/cargo are intentionally NOT used: they lag Rust's 6-week stable cadence and can't
# manage toolchains/targets/components the way Rust development expects.
provision_thirdparty_software_dev_rust:
  description: "Rust toolchain via rustup - stable + rust-analyzer (user-scoped)"
  __common__:
    already_installed: su - user -c 'test -x ~/.cargo/bin/cargo'
    install_script: |
      # `-y` is rustup-init's only non-interactive flag (no long-form alias exists);
      # --proto / --tlsv1.2 are the curl flags rust-lang.org documents for the installer.
      su - user -c 'curl --proto "=https" --tlsv1.2 --fail --silent --show-error --location https://sh.rustup.rs | sh -s -- -y'
      su - user -c '~/.cargo/bin/rustup component add rust-analyzer'

# Android SDK (command-line tools), user-scoped under ~/Android/Sdk - the headless half of
# `dev_android`. Pairs with the `dev_android` DISTRO group (JDK + unzip), which cmd_provision
# installs FIRST in the same run, so the JDK sdkmanager needs and the unzip step both have
# their deps ready. Installs platform-tools (adb), a build-tools, and a platform = enough to
# `./gradlew assembleDebug`. NOT the emulator (heavy/GUI/needs host nested virt; add via
# `sdkmanager emulator`). Set ANDROID_HOME=~/Android/Sdk (or a project local.properties) to
# point Gradle/AGP at it.
provision_thirdparty_software_dev_android:
  description: "Android SDK - cmdline-tools, platform-tools, build-tools (user-scoped; pairs with dev_android distro)"
  __common__:
    already_installed: su - user -c 'test -x ~/Android/Sdk/platform-tools/adb'
    install_script: |
      # Google ships cmdline-tools as a build-numbered zip - there is NO stable "latest" URL,
      # so the build number is PINNED (14742923, verified 2026-06-09 against
      # developer.android.com/studio); bump it when it ages. platform / build-tools pinned to
      # API 36 (current stable); `sdkmanager` more as needed. platform-tools is unversioned (latest).
      su - user -c 'set -eu
        ANDROID_SDK_ROOT="$HOME/Android/Sdk"
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        cd "$ANDROID_SDK_ROOT/cmdline-tools"
        curl --fail --silent --show-error --location --output cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
        unzip -q cmdline-tools.zip
        rm cmdline-tools.zip
        rm -rf latest && mv cmdline-tools latest   # the zip extracts to ./cmdline-tools; sdkmanager wants .../latest
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" platform-tools "platforms;android-36" "build-tools;36.0.0"
      '

# Go Version Manager (gvm, moovweb/gvm) - user-scoped, for installing SPECIFIC/old Go
# versions (e.g. go1.9). PAIRS with the `dev_gvm` DISTRO bundle (bison/make/binutils),
# applied first. You typically use EITHER the distro go (`dev_go`) OR gvm-managed versions;
# `gvm use <ver> --default` makes that version your default go (shadowing distro go - that
# is the normal way to drive go through gvm, and fine).
#
# Pinned to commit dd652539 (moovweb/gvm master HEAD, 2023-08-14): gvm has NO usable release
# tag (newest 1.0.22 is from 2014), so a commit SHA is the only pin. Installs are BINARY via
# `gvm install <ver> -B` - downloads the PREBUILT toolchain from go.dev/dl (no source bootstrap).
# gvm STILL hard-requires bison/gcc/binutils/hexdump present (it checks them even for `-B`,
# verified live) - those come from the paired `dev_gvm` distro bundle, applied first.
#
# SUPPLY-CHAIN NOTE (verified against gvm scripts/install, 2026-06): gvm's `-B` path downloads
# over HTTPS from go.dev/dl but does NOT verify the tarball SHA256 (unlike goenv / g / the
# official golang.org/dl wrapper, which do). Integrity rests on TLS alone. Stated, not hidden.
#
# Shell wiring lives in the TEMPLATED ~/.zshrc + ~/.bashrc (file-existence guarded; see
# roles/zsh, roles/bash), so it survives ivm's dotfiles push (which OVERWRITES .zshrc/.bashrc
# AFTER recipes run). The recipe strips gvm-installer's own self-added source lines so the
# template stays the single source.
provision_thirdparty_software_dev_gvm:
  description: "gvm (Go Version Manager) for pinned/old Go e.g. go1.9 - binary installs (-B), alongside distro go"
  __common__:
    already_installed: su - user -c 'test -s ~/.gvm/scripts/gvm'
    install_script: |
      # Pin to a commit SHA (no release tag). gvm-installer takes the git ref as $1; fetch
      # the installer at that ref too. Piped (not `bash < <()`) so the outer login shell need
      # not be bash/zsh.
      su - user -c 'GVM_PIN=dd652539fa4b771840846f8319fad303c7d0a8d2
        curl -s -S -L "https://raw.githubusercontent.com/moovweb/gvm/${GVM_PIN}/binscripts/gvm-installer" | bash -s -- "${GVM_PIN}"'
      # gvm-installer self-appends a `source ~/.gvm/scripts/gvm` line to whatever rc files it
      # detects (not configurable). Strip them so the templated ~/.zshrc/~/.bashrc is the ONE
      # source (no double-source via a surviving .zprofile/.bash_profile/.zshenv). Use `if/fi`,
      # NOT `[ -f ] && sed`: the recipe runs under ivm's `bash -ec`, so a trailing `&&` that is
      # FALSE on the last rc file (e.g. an absent ~/.zshenv) makes the loop exit non-zero and
      # aborts the whole provision. `if/fi` exits 0 when the file is absent.
      su - user -c 'for rc in ~/.bashrc ~/.zshrc ~/.bash_profile ~/.zprofile ~/.profile ~/.zshenv; do
        if [ -f "$rc" ]; then sed -i "/\.gvm\/scripts\/gvm/d" "$rc"; fi
      done'
      su - user -c 'echo "==> gvm ready. Install a version:  gvm install go1.9.7 -B   then:  gvm use go1.9.7" >&2'

# Node Version Manager (nvm, nvm-sh/nvm) - user-scoped, for SPECIFIC/newer Node versions.
# Pinned to v0.40.5 (latest, fixes CVE-2026-10796). Installs nvm + the current LTS Node as
# the default. Coexists with the distro node (`dev_node`); nvm's node takes PATH precedence
# when active.
#
# The installer needs bash (NOT sh). Run with PROFILE=/dev/null so it does NOT self-wire any
# rc file - shell wiring lives in the TEMPLATED ~/.zshrc + ~/.bashrc (guarded; survives the
# dotfiles push that overwrites .zshrc/.bashrc after recipes). nvm is incompatible with a
# preset npm `prefix`; the ivm guest sets none (no conflict) - a guest that ALSO ran the
# `agent_codex` recipe would have ~/.npmrc prefix set, an edge case.
provision_thirdparty_software_dev_nvm:
  description: "nvm (Node Version Manager) v0.40.5 + current LTS Node - alongside distro node"
  __common__:
    # Probe the LAST step's artifact (the `default` alias from `nvm alias default`), NOT just
    # nvm.sh. An install interrupted mid-way (nvm cloned, but `nvm install --lts` not done) then
    # FAILS this probe and correctly RE-RUNS to completion, instead of nvm.sh's mere presence
    # marking it "installed" forever.
    already_installed: su - user -c 'test -f ~/.nvm/alias/default'
    install_script: |
      # PROFILE=/dev/null: no rc self-wiring (the template wires it). Pinned tag v0.40.5.
      su - user -c 'PROFILE=/dev/null bash -c "curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.5/install.sh | bash"'
      # Install the current LTS Node + make it the default for new shells. (One-shot source of
      # nvm.sh here only to drive the install; persistent load is via the template.)
      su - user -c 'export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"; nvm install --lts; nvm alias default "lts/*"'
