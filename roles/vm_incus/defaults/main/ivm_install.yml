---
# `ivm` install vars - its state + where it lands (see tasks/ivm_install.yml).
# Loaded automatically: Ansible reads every file in a role's `defaults/main/` dir.

# `vm_incus_state`:
#   - `present` (default): install `ivm` + schema + example
#     templates + the staged user/root dotfiles.
#   - `absent`: remove the `ivm` binary + this role's subdir. Does NOT delete
#     any incus VMs (those are the user's; use `ivm delete` per-VM).
vm_incus_state: present

# This role's own subdir under `~/.local/share/ansible-managed/`. Holds the
# `ivm/` data dir (`vm_incus_ivm_dir`) + the `{zsh,bash}-completions/` dirs.
# Uninstall = `rm -rf` it.
vm_incus_root: "{{ ansible_facts['env']['HOME'] }}/.local/share/ansible-managed/vm-incus"
vm_incus_bin_dir: "{{ ansible_facts['env']['HOME'] }}/.local/bin"

# `ivm`'s own data root == what `ivm --root` (its DEFAULT_ROOT) points at. Holds
# `template.schema.json`, `templates/`, `rootfs/<ansible_os_family>/` (staged
# dotfiles), and `distro-package-groups.json`. Nested under `vm_incus_root` so the shell
# completions stay a SIBLING (`vm-incus/{zsh,bash}-completions/`, matched by the
# rc globs) - program data and completions kept separate.
vm_incus_ivm_dir: "{{ vm_incus_root }}/ivm"

# `ivm` shell completion. Both dirs live inside `vm_incus_root` so uninstall's
# `rm -rf` cleans them; they are auto-discovered by the rc globs
# (`ansible-managed/*/zsh-completions` in .zshrc.j2, `*/bash-completions/*`
# sourced by .bashrc.j2) - no rc edits, no XDG loader handshake.
vm_incus_zsh_completion_dir: "{{ vm_incus_root }}/zsh-completions"
vm_incus_bash_completion_dir: "{{ vm_incus_root }}/bash-completions"
