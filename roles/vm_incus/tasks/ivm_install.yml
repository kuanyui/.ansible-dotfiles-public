---
# Install `ivm` (the launcher; replaces the old per-entry bash launchers).
# `ivm` reads VM templates at runtime and drives incus from the HOST; the guest
# gets no ansible/python. See files/ivm + REDESIGN.md.
# Host-level prep (apt incus, `incus admin init`, group add) is done by
# tasks/incus_host_install.yml (run from tasks/main.yml).

- name: Ensure `ivm` host deps (PyYAML + jsonschema) via `roles/_install_distro_packages`
  ansible.builtin.include_role:
    name: _install_distro_packages
  vars:
    install_distro_packages:
      Debian:
        install: [python3-yaml, python3-jsonschema]
        probe: 'python3 -c "import yaml, jsonschema"'
      Suse:
        install: [python3-PyYAML, python3-jsonschema]
        probe: 'python3 -c "import yaml, jsonschema"'
      RedHat:
        install: [python3-pyyaml, python3-jsonschema]
        probe: 'python3 -c "import yaml, jsonschema"'

- name: Ensure `vm_incus_bin_dir` + `vm_incus_ivm_dir` + completion dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ vm_incus_bin_dir }}"
    - "{{ vm_incus_ivm_dir }}"
    - "{{ vm_incus_zsh_completion_dir }}"
    - "{{ vm_incus_bash_completion_dir }}"

- name: Install `ivm` to `{{ vm_incus_bin_dir }}/ivm`
  ansible.builtin.copy:
    src: ivm
    dest: "{{ vm_incus_bin_dir }}/ivm"
    mode: "0755"

# Read-only storage inspector shared by `ivm storage-status` AND the `vm-incus-install`
# post-verify step (tasks/incus_host_install.yml runs it via the `script` module).
# Installed here so `ivm storage-status` finds it at `{{ vm_incus_ivm_dir }}/incus_storage_pool.py`.
- name: Install the storage-pool inspector to `{{ vm_incus_ivm_dir }}/incus_storage_pool.py` (powers `ivm storage-status`)
  ansible.builtin.copy:
    src: incus_storage_pool.py
    dest: "{{ vm_incus_ivm_dir }}/incus_storage_pool.py"
    mode: "0755"

- name: Install the VM definition schema to `{{ vm_incus_ivm_dir }}/template.schema.json`
  ansible.builtin.copy:
    src: template.schema.json
    dest: "{{ vm_incus_ivm_dir }}/template.schema.json"
    mode: "0644"

- name: Install the example VM templates to `{{ vm_incus_ivm_dir }}/templates/`
  ansible.builtin.copy:
    src: templates/
    dest: "{{ vm_incus_ivm_dir }}/templates/"
    mode: "0644"

# Record the storage pool layout so `ivm info` + the create/delete preview can show
# the REAL on-disk path - the unprivileged `incus`-group user can't read incus's own
# pool config (admin-only), so ivm reads this instead. Written only when the role set up
# the host (`not vm_incus_skip_host_setup`) AND `_storage.write_record` is true. The record
# content is `_storage.record`, decided by `incus_storage_pool.py resolve` in
# tasks/incus_host_install.yml: on a re-run of an initialized host it is the EXISTING record
# echoed back (so this write is a no-op), never re-derived from the passed/default vars -
# that is what stops a no-var re-run from repointing the record at the wrong `.img`.
# `_storage.write_record` is false when a `default` pool exists WITHOUT a usable record
# (a hand-initialized host, or after `make vm-incus-uninstall-ivm` wiped the subdir): there
# `_storage.record` is just the passed/default VARS - not the live pool - and persisting it
# would make every later run FOLLOW that lie (e.g. the loud loop-img-missing STOP for an
# `.img` that never existed). Such hosts simply keep no record; `status` says "(none)".
- name: Record the storage pool layout to `{{ vm_incus_ivm_dir }}/storage-info.json` (so `ivm info` shows the real `.img` / path even to the unprivileged user; skipped when `_storage.write_record` is false - never record a layout the live pool may not have)
  ansible.builtin.copy:
    dest: "{{ vm_incus_ivm_dir }}/storage-info.json"
    mode: "0644"
    content: "{{ _storage.record | to_nice_json }}\n"
  when:
    - not (vm_incus_skip_host_setup | default(false) | bool)
    - _storage.write_record | bool

# Shared fcitx5 user-config setup script: `ivm` embeds + runs it in a guest with
# `sys.input_method: fcitx5`, and you can run this same copy on the HOST
# (`sh {{ vm_incus_ivm_dir }}/setup-fcitx5-input.sh`) - one source of truth.
- name: Install the fcitx5 setup script to `{{ vm_incus_ivm_dir }}/setup-fcitx5-input.sh`
  ansible.builtin.copy:
    src: setup-fcitx5-input.sh
    dest: "{{ vm_incus_ivm_dir }}/setup-fcitx5-input.sh"
    mode: "0755"

# ---------- Produce the SHARED provision-asset cache (JSON registries + dotfiles) ----------
# `ivm` runs host-side at `init`/`provision` time, where ansible (and the `provision_*`
# registry vars) no longer exist. The shared producer role snapshots both registries to
# JSON + stages the feature-first dotfiles tree into
# `~/.local/share/ansible-managed/shared-prebuilt-provision-assets/`; `ivm` reads from
# there (its DEFAULT_SHARED_ASSETS_ROOT). That dir is SHARED with qvm/pvm, so it is
# produced by the internal `_shared_prebuilt_provision_assets` role - NOT staged here
# (which is why vm_incus no longer renders its own JSON or stages rootfs/ + config-files/).
# Single source of truth stays in the provision_* roles' defaults/.
- name: Produce the shared provision-asset cache (`roles/_shared_prebuilt_provision_assets`)
  ansible.builtin.include_role:
    name: _shared_prebuilt_provision_assets

# ---------- `ivm` shell completion (subcommands, then their args) ----------
# Auto-discovered by the rc globs (no rc edits): zsh via the
# `ansible-managed/*/zsh-completions` fpath glob, bash via the
# `ansible-managed/*/bash-completions/*` source loop.
- name: Install `ivm` zsh completion to `{{ vm_incus_zsh_completion_dir }}/_ivm`
  ansible.builtin.copy:
    src: completions/_ivm
    dest: "{{ vm_incus_zsh_completion_dir }}/_ivm"
    mode: "0644"

- name: Install `ivm` bash completion to `{{ vm_incus_bash_completion_dir }}/ivm`
  ansible.builtin.copy:
    src: completions/ivm.bash
    dest: "{{ vm_incus_bash_completion_dir }}/ivm"
    mode: "0644"
