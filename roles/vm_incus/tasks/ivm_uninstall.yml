---
# Remove `ivm` + this role's subdir. Does NOT delete any incus VMs:
#   - they are deliberately persistent (snapshots, long-running state);
#   - bulk-deleting our `ivm-*` / tagged VMs would be a footgun.
# To remove a VM: `ivm delete` in its dir, or `incus list` + `incus delete`.

- name: Remove the `ivm` binary `{{ vm_incus_bin_dir }}/ivm`
  ansible.builtin.file:
    path: "{{ vm_incus_bin_dir }}/ivm"
    state: absent

- name: Wipe `vm_incus`'s subdir `{{ vm_incus_root }}` (ivm binary data - schema, templates, fcitx5 script, storage-info - plus the completion dirs)
  ansible.builtin.file:
    path: "{{ vm_incus_root }}"
    state: absent

# The SHARED provision-asset cache (shared-prebuilt-provision-assets/) is CO-PRODUCED by
# `vm_incus`, `vm_quickemu` (qvm) AND `vm_podman` (pvm), so it is REF-COUNTED across all
# THREE: this uninstall removes it ONLY when NEITHER other consumer (qvm, pvm) is installed -
# else their `provision`/build would break until a re-apply. The last launcher uninstalled
# wipes it (regenerable cache; see CLAUDE.md "Shared prebuilt-asset dirs").
- name: Load the shared-asset producer's defaults (for `_shared_prebuilt_provision_assets_dir`)
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../_shared_prebuilt_provision_assets/defaults/main.yml"

- name: Check whether `qvm` (a shared-cache consumer) is still installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/qvm"
  register: _other_launcher_qvm

- name: Check whether `pvm` (a shared-cache consumer) is still installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/pvm"
  register: _other_launcher_pvm

- name: Wipe the SHARED provision-asset cache `{{ _shared_prebuilt_provision_assets_dir }}` (only when NEITHER qvm nor pvm is installed)
  ansible.builtin.file:
    path: "{{ _shared_prebuilt_provision_assets_dir }}"
    state: absent
  when:
    - not _other_launcher_qvm.stat.exists
    - not _other_launcher_pvm.stat.exists
