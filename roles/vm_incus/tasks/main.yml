---
- name: Validate `vm_incus_state` is `present` or `absent`
  ansible.builtin.assert:
    that: vm_incus_state in ['present', 'absent']
    fail_msg: "vm_incus_state must be `present` or `absent`, got `{{ vm_incus_state }}`."

- name: Run host-level prep (apt install incus + guestfs-tools, preseed init, group add) via tasks/incus_host_install.yml
  ansible.builtin.include_tasks: incus_host_install.yml
  when:
    - vm_incus_state == 'present'
    - not (vm_incus_skip_host_setup | default(false) | bool)

- ansible.builtin.include_tasks: ivm_install.yml
  when: vm_incus_state == 'present'

# Uninstall mirrors install in REVERSE order: drop the user-space `ivm` tool
# first, then optionally tear down the host-level incus layer. Each host
# teardown step is individually gated by an `vm_incus_uninstall_*` toggle
# (all default false -> safe no-op), so `absent` removes only `ivm` unless
# the toggles are explicitly set. Gated on `not vm_incus_skip_host_setup` to
# match install (a host whose incus we never set up, we never tear down).
- ansible.builtin.include_tasks: ivm_uninstall.yml
  when: vm_incus_state == 'absent'

- ansible.builtin.include_tasks: incus_host_uninstall.yml
  when:
    - vm_incus_state == 'absent'
    - not (vm_incus_skip_host_setup | default(false) | bool)
