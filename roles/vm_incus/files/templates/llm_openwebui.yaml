# yaml-language-server: $schema=../template.schema.json
# Open WebUI server VM: a headless box running the official Open WebUI container via
# rootless podman, reached from the HOST browser at http://<guest-ip>:8080 (incus NAT lets
# the host route to the guest; the LAN cannot). No GUI and no /workspaces mount - a
# single-purpose appliance, not a dev/agent box. First browser visit creates the admin
# account. OpenRouter is pre-wired as the OpenAI-compatible base URL - a FIRST-LAUNCH
# seed only (Open WebUI "PersistentConfig": after first boot the value lives under
# ~/openwebui/data and is edited in the web UI, env ignored); paste your key - and
# change provider/URL any time - in Admin Settings -> Connections.
#
# Self-contained on purpose: the whole install lives in post_install_script, NOT in the
# shared provision_thirdparty_software registry (same appliance doctrine as
# llm_sillytavern.yaml - keeps `ivm provision` from landing it on unrelated VMs).
#
# Backup tiers (same model as every llm_* appliance): app DATA -> host-side `ivm backup` /
# `ivm restore` (the `backup:` block below; tars ~/openwebui into the host's
# ~/Downloads/OpenWebUIBackups/); fast in-place rollback -> `ivm snapshot`; whole-VM
# archive -> `incus export`.
template_name: llm_openwebui
description: "Open WebUI LLM chat server (Debian, headless; rootless podman; OpenRouter pre-wired - paste your key in the web UI; host browser -> guest:8080; backups land in ~/Downloads)"
# Appliance, not a project box: bound to NO host dir (empty = unbound) - target it by name
# anywhere (`ivm shell <vm>`); default instance name is `ivm-llm-openwebui` (no path suffix).
host_bound_dir: ""
# Host-reachable endpoints, queryable later via `ivm info` (annotation of what
# post_install_script sets up; init warns if the port literal vanishes from the script).
services: { webui: 8080 }
# Post-init how-to, shown by `ivm info` (Usage group) - so nothing here needs remembering
# after init. Read live from this file; keep in sync with post_install_script.
usage:
  - "web UI: open the `services` address above in the HOST browser; the FIRST visit creates the admin account"
  - "OpenRouter key: paste it in the web UI (Admin Settings -> Connections) - env pre-wires only the first launch"
  - "backup / restore data: from the HOST `ivm backup <vm>` / `ivm restore latest <vm>` (tars land in the host's ~/Downloads/OpenWebUIBackups/)"
# What `ivm backup` / `ivm restore` operate on, HOST-driven and read LIVE from this file via
# the VM's `user.ivm_template` tag (like `usage`), so a fix here reaches every existing VM:
# stop the per-user `unit`, tar `paths` inside `dir`, restart; tars land in the host's
# `<XDG Download>/<host_downloads_subdir>/`.
backup:
  unit: openwebui
  dir: /home/user
  paths: [openwebui]
  # Files the container created as a non-root container uid map to guest subuids that plain
  # `user` cannot read; inside `podman unshare` they are readable AND ownership round-trips.
  podman_unshare: true
  host_downloads_subdir: OpenWebUIBackups
hw:
  cpu: 2
  memory: 4G
  # The open-webui image alone unpacks to several GB (it bundles torch + a local embedding
  # model); 20G leaves room for image + chat data + a pulled update side by side.
  disk: 20G
os:
  type: linux
  distro: debian
  image:
    source: incus
    uri: debian/13
sys:
  gui: false
  timezone: host
net:
  # NAT (incusbr0) is exactly right for "reached only from the host": the host routes to
  # the guest's bridge IP, the LAN cannot (full rationale in llm_sillytavern.yaml).
  mode: nat
distro_package_groups:
  # rootless podman + passt + aardvark-dns + fuse-overlayfs (+ Debian-only uidmap/nftables);
  # its post_install also adds subuid/subgid ranges for `user`, enables linger and points
  # unqualified image searches at docker.io - all done before post_install_script runs.
  - podman_rootless
distro_packages:
  - dbus-user-session   # per-user D-Bus, so `systemctl --user` works for the user service
# Everything below runs as ROOT after packages install (and after podman_rootless's
# post_install prepared subuids + linger). Heredocs are kept at a FLAT indent on purpose:
# the `|` block strips the common 2 spaces, so the written files (the unit's `[Section]`
# headers, the script) and the heredoc terminators land at column 0.
post_install_script: |
  # Pull the image NOW so registry/network trouble fails the init loudly, instead of the
  # systemd service flapping after first boot. Upstream's documented install is this exact
  # container (their `docker run` line, translated 1:1 to rootless podman in the unit
  # below); re-running just refreshes the moving `:main` tag, so a re-init is an upgrade.
  su - user -c 'mkdir -p ~/openwebui/data && podman pull ghcr.io/open-webui/open-webui:main'
  # Run the container as a PER-USER systemd service (~/.config/systemd/user), the same
  # pattern as llm_sillytavern.yaml: `user` (no sudo) fully controls it, and `ivm backup`
  # stops/starts it for consistent tars. --rm --replace keep restarts clean after a crash;
  # the published 8080 binds on the guest's interfaces, which NAT exposes to the host only.
  # OPENAI_API_BASE_URL pre-wires OpenRouter; it is a FIRST-LAUNCH seed only (Open WebUI
  # "PersistentConfig") - once the data dir exists, the UI-stored value wins and this env
  # is ignored, so later UI changes stick across restarts.
  su - user -c 'mkdir -p ~/.config/systemd/user && cat > ~/.config/systemd/user/openwebui.service' <<'EOF'
  [Unit]
  Description=Open WebUI (rootless podman)
  [Service]
  Type=simple
  ExecStart=/usr/bin/podman run --rm --replace --name openwebui --publish 8080:8080 --env OPENAI_API_BASE_URL=https://openrouter.ai/api/v1 --volume %h/openwebui/data:/app/backend/data ghcr.io/open-webui/open-webui:main
  ExecStop=/usr/bin/podman stop --time 10 openwebui
  Restart=on-failure
  [Install]
  WantedBy=default.target
  EOF
  # enable-linger asks logind to bring up the lingering user manager + its D-Bus
  # ASYNCHRONOUSLY (podman_rootless's post_install already requested it; repeating is a
  # no-op); wait for the user bus socket before driving systemctl --user (else "Failed to
  # connect to bus"). `su` is not a PAM login, so XDG_RUNTIME_DIR and
  # DBUS_SESSION_BUS_ADDRESS are unset - set BOTH (XDG alone is not always enough).
  loginctl enable-linger user
  guest_user_uid="$(id -u user)"
  for _ in $(seq 1 100); do [ -S "/run/user/$guest_user_uid/bus" ] && break; sleep 0.2; done
  su - user -c 'export XDG_RUNTIME_DIR=/run/user/$(id -u); export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"; systemctl --user daemon-reload; systemctl --user enable --now openwebui'
