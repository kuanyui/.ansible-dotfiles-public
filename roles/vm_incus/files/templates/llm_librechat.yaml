# yaml-language-server: $schema=../template.schema.json
# LibreChat server VM: a headless box running upstream's docker-compose deployment -
# trimmed to the minimal api + mongodb pair - via rootless podman-compose, reached from
# the HOST browser at http://<guest-ip>:3080 (incus NAT lets the host route to the guest;
# the LAN cannot). No GUI and no /workspaces mount - a single-purpose appliance, not a
# dev/agent box. Log in as admin@example.com / adminadmin (pre-created at init; login is
# by EMAIL; registration is off - add accounts with
# `podman exec LibreChat npm run create-user -- <email> <name> <username>`). OpenRouter
# is pre-wired; set your API key with ONE in-guest command: `llm-key <key>` (writes
# OPENROUTER_KEY into ~/librechat/.env - which llm-backup carries - and RECREATES the
# compose stack; a mere container restart keeps the old env, see the llm-key
# comment). The UI endpoint list carries the auto-routed "OpenRouter" endpoint PLUS one
# pinned "OpenRouter (<Provider>)" endpoint per curated provider - LibreChat has no UI
# for picking OpenRouter's routed provider (the model dropdown picks only the MODEL),
# so picking an endpoint IS picking the provider; all endpoints share the one key.
# NOT `user_provided`: that mode never fetches the live model list (upstream
# LibreChat#4500/#1028), leaving only the fallback model in the dropdown.
#
# Upstream extras deliberately left out: meilisearch (message full-text search), and
# vectordb + rag_api (RAG file Q&A, which also needs an embedding API key). To add one
# later, copy its service block from upstream's docker-compose.yml into the in-guest
# ~/librechat/docker-compose.yml and restart - no VM rebuild needed.
#
# Self-contained on purpose: the whole install lives in post_install_script, NOT in the
# shared provision_thirdparty_software registry (same appliance doctrine as
# llm_sillytavern.yaml - keeps `ivm provision` from landing it on unrelated VMs).
#
# Backup tiers (same model as llm_sillytavern.yaml / scripts/st-vm-backup): app DATA ->
# in-guest `llm-backup` (tars ~/librechat into host-shared ~/Downloads/LibreChatBackups/);
# fast in-place rollback -> `ivm snapshot`; whole-VM archive -> `incus export`.
template_name: llm_librechat
description: "LibreChat LLM chat server (Debian, headless; rootless podman-compose api+mongodb; OpenRouter pre-wired, ZDR-only auto + per-provider pinned endpoints - set key once with `llm-key <key>` in the VM; host browser -> guest:3080; backups land in ~/Downloads. ACCOUNT: admin@example.com / adminadmin)"
# Appliance, not a project box: bound to NO host dir (empty = unbound) - target it by name
# anywhere (`ivm shell <vm>`); default instance name is `ivm-llm-librechat` (no path suffix).
host_bound_dir: ""
# Host-reachable endpoints, queryable later via `ivm info` (annotation of what
# post_install_script sets up; init warns if the port literal vanishes from the script).
# mongo is deliberately NOT listed: it lives on the compose-internal network only.
services: { webui: 3080 }
# Post-init how-to, shown by `ivm info` (Usage group) - so nothing here needs remembering
# after init. Read live from this file; keep in sync with post_install_script.
usage:
  - "web UI: open the `services` address above in the HOST browser; log in with the EMAIL admin@example.com / adminadmin"
  - "OpenRouter key (set once, survives backups): `ivm shell` into the VM, then `llm-key <your-key>`"
  - "backup / restore chats: in the VM run `llm-backup` / `llm-backup restore latest` (tars land in host-shared ~/Downloads/LibreChatBackups/)"
hw:
  cpu: 2
  memory: 4G
  disk: 15G
os:
  type: linux
  distro: debian
  image:
    source: incus
    uri: debian/13
sys:
  gui: false
  timezone: host
net:
  # NAT (incusbr0) is exactly right for "reached only from the host": the host routes to
  # the guest's bridge IP, the LAN cannot (full rationale in llm_sillytavern.yaml).
  mode: nat
mounts:
  # Host XDG Download <-> guest ~/Downloads: llm-backup writes its tars here, so backups
  # land on the host by themselves (virtio-fs).
  - host: $(xdg-user-dir DOWNLOAD)
    guest: /home/user/Downloads
distro_package_groups:
  # rootless podman + podman-compose + passt + aardvark-dns (container name resolution on
  # the compose network - api finds `mongodb` through it) + fuse-overlayfs (+ Debian-only
  # uidmap/nftables); its post_install also adds subuid/subgid ranges for `user`, enables
  # linger and points unqualified image searches at docker.io.
  - podman_rootless
distro_packages:
  - dbus-user-session   # per-user D-Bus, so `systemctl --user` works for the user service
  - openssl             # generates the one-time .env secrets (JWT_*, CREDS_*) below
dotfiles:
  - bash
  - zsh
# Everything below runs as ROOT after packages install (and after podman_rootless's
# post_install prepared subuids + linger). Heredocs are kept at a FLAT indent on purpose:
# the `|` block strips the common 2 spaces, so the written files (compose keys, the unit's
# `[Section]` headers, the script) and the heredoc terminators land at column 0.
post_install_script: |
  # Create the data dirs and pull both images NOW so registry/network trouble fails the
  # init loudly, instead of the systemd service flapping after first boot. Re-running just
  # refreshes the moving tags (:latest / :8), so a re-init is an upgrade.
  # The api image runs as `node` (container uid 1000 - `USER node` in upstream's
  # Dockerfile), but rootless podman maps the guest user to container uid 0, so freshly
  # mkdir'd bind mounts are container-ROOT-owned and node gets `EACCES: permission
  # denied, open /app/logs/...`. `podman unshare chown` to uid 1000 (the container-side
  # node uid = a guest subuid) hands node its three dirs; llm-backup already tars inside
  # `podman unshare`, so the subuid ownership round-trips through backup/restore.
  # data-node is deliberately NOT chowned - the mongo image entrypoint starts as
  # container root and fixes its own ownership. (The compose-level fix
  # `userns_mode: keep-id` is unavailable here: podman-compose runs services in a pod,
  # and podman rejects --userns together with --pod.)
  su - user -c 'set -eu
    mkdir -p ~/librechat/data-node ~/librechat/images ~/librechat/uploads ~/librechat/logs
    podman unshare chown --recursive 1000:1000 ~/librechat/images ~/librechat/uploads ~/librechat/logs
    podman pull ghcr.io/danny-avila/librechat:latest
    podman pull docker.io/library/mongo:8
  '
  # Trimmed 1:1 from upstream LibreChat docker-compose.yml: api + mongodb only (see the
  # header comment for how to add meilisearch / RAG back). One deviation: fully-qualified
  # image names (no short-name resolution surprises). `restart: unless-stopped` is KEPT
  # from upstream on purpose: the systemd unit below supervises only the podman-compose
  # process, NOT the member containers - when a member crashes, podman-compose stays
  # attached to the survivors and the unit stays "active", so podman's own restart
  # policy is the only member-level supervisor there is (learned the hard way: an api
  # crash left the stack half-dead with no one restarting it).
  su - user -c 'cat > ~/librechat/docker-compose.yml' <<'EOF'
  services:
    api:
      image: ghcr.io/danny-avila/librechat:latest
      container_name: LibreChat
      restart: unless-stopped
      ports:
        - "3080:3080"
      depends_on:
        - mongodb
      env_file: .env
      environment:
        - HOST=0.0.0.0
        - PORT=3080
        - MONGO_URI=mongodb://mongodb:27017/LibreChat
      volumes:
        - ./images:/app/client/public/images
        - ./uploads:/app/uploads
        - ./logs:/app/logs
        - ./librechat.yaml:/app/librechat.yaml
    mongodb:
      image: docker.io/library/mongo:8
      container_name: chat-mongodb
      restart: unless-stopped
      # --noauth mirrors upstream: mongo publishes no ports, so only containers on this
      # compose network (i.e. api) can reach it.
      command: mongod --noauth
      volumes:
        - ./data-node:/data/db
  EOF
  # LibreChat custom-endpoint config (mounted to /app/librechat.yaml by the compose
  # file), GENERATED here: the auto-routed "OpenRouter" endpoint + one PINNED endpoint
  # per entry in the loop below. Why per-provider endpoints: LibreChat's UI picks only
  # the MODEL - it has NO control for OpenRouter's routed provider - so "pick a
  # provider" must be expressed as "pick an endpoint". Every endpoint reads the same
  # `OPENROUTER_KEY` from .env (one `llm-key` sets them all) - NOT `user_provided`:
  # with user_provided the live model fetch is broken upstream (LibreChat#4500/#1028,
  # open since 2023), leaving only the `default` fallback in the dropdown.
  # Guarded like .env, so a re-init never clobbers later hand edits (add/remove
  # providers in the guest file, then `podman restart LibreChat`).
  # Quoting map: outer heredoc is quoted (<<'...'), so the generator script below
  # reaches `bash -s` verbatim; inner STATIC_HEAD is quoted -> literal (keeps
  # `${OPENROUTER_KEY}` for LibreChat's own env substitution); inner PINNED_ENDPOINT
  # is UNQUOTED -> `$provider_slug`/`$provider_label` expand, `\${OPENROUTER_KEY}`
  # stays literal via the backslash.
  su - user -c 'set -eu
    [ -f ~/librechat/librechat.yaml ] && exit 0
    exec bash -s
  ' <<'GENERATE_LIBRECHAT_YAML'
  set -eu
  {
  cat <<"STATIC_HEAD"
  # Custom endpoints - docs: librechat.ai/docs/configuration/librechat_yaml
  # Generated ONCE at init by the llm_librechat ivm template; edit freely, then
  # `podman restart LibreChat` - a re-init keeps this file.
  version: 1.2.1
  cache: true
  endpoints:
    custom:
      # Endpoint NAMES self-describe routing + privacy: "(<who routes / which
      # provider>, <data policy>)". Every endpoint carries `zdr: true` - route ONLY
      # to endpoints with a formal Zero Data Retention policy
      # (openrouter.ai/docs/guides/features/zdr; live list:
      # https://openrouter.ai/api/v1/endpoints/zdr) - EXCEPT the one explicit
      # "(Auto route, data may be collected)" escape hatch below. ZDR is the point
      # of this whole setup: these endpoints exist for questions where privacy
      # matters, so a model with no ZDR endpoint must FAIL ("No allowed providers
      # are available"), never quietly fall back to a retaining one - reach for the
      # escape hatch only when YOU decided the question needs no privacy guarantee.
      # Auto-routed (docs example + `zdr`): OpenRouter picks the provider per request
      # from the ZDR pool. `dropParams: ["stop"]` because OpenRouter models use
      # varied stop tokens - dropping it avoids compatibility errors. `fetch: true`
      # loads the live model list; `default` is ONLY the fallback if that fetch fails.
      - name: "OpenRouter (Auto route, ZDR)"
        apiKey: "${OPENROUTER_KEY}"
        baseURL: "https://openrouter.ai/api/v1"
        models:
          default: ["openrouter/auto"]
          fetch: true
        titleConvo: true
        titleModel: "openrouter/auto"
        dropParams: ["stop"]
        addParams:
          provider:
            zdr: true
        modelDisplayLabel: "OpenRouter (Auto route, ZDR)"
      # The ONE endpoint without `zdr` (upstream docs example, verbatim except
      # apiKey): auto-routed over ALL providers, retaining ones included - for
      # questions that need no privacy guarantee (e.g. when the ZDR pool lacks the
      # model). Picking it is the deliberate opt-out.
      - name: "OpenRouter (Auto route, data may be collected)"
        apiKey: "${OPENROUTER_KEY}"
        baseURL: "https://openrouter.ai/api/v1"
        models:
          default: ["openrouter/auto"]
          fetch: true
        titleConvo: true
        titleModel: "openrouter/auto"
        dropParams: ["stop"]
        modelDisplayLabel: "OpenRouter (Auto route, data may be collected)"
      # Pinned endpoints below, one per provider, via OpenRouter provider routing
      # (openrouter.ai/docs/features/provider-routing): `only` + `allow_fallbacks:
      # false` lock the provider; `zdr` + `data_collection: "deny"` refuse endpoints
      # that retain/collect/train on prompts, so a provider policy change FAILS
      # LOUDLY ("No allowed providers are available") instead of silently leaking data
      # (all 9 pinned providers have ZDR endpoints as of 2026-08). The model
      # dropdown still lists the FULL OpenRouter catalog (the fetch is not
      # per-provider) - picking a model the pinned provider does not host errors with
      # the same "No allowed providers" message; that is expected, pick another model.
      # `titleModel: current_model` = title generation reuses the conversation's
      # model (the auto endpoint's `openrouter/auto` would clash with the pin).
      # Accuracy knob: to REQUIRE full precision on an endpoint, add under `provider:`
      #   quantizations: ["bf16", "fp16", "fp32"]
      # Off by default on purpose: many reputable endpoints are DISCLOSED fp8 (or
      # unknown) and the filter would exclude them; each endpoint's quantization is
      # public on the model's openrouter.ai Providers tab, so serving a lower
      # precision than declared is what third-party evals (e.g. MoonshotAI's
      # K2-Vendor-Verifier) exist to catch - not something a filter can prevent.
  STATIC_HEAD
  # slug:Label pairs, ALPHABETICAL (the UI lists endpoints in this order, auto first).
  # Curated 2026-08: common open-model inference hosts with good serving-accuracy
  # reputations, non-CN-headquartered (per https://openrouter.ai/api/v1/providers),
  # no training / no prompt retention (each verified `training:false,
  # retainsPrompts:false` on its openrouter.ai provider pages) - and data_collection
  # above RE-ENFORCES the no-collection bar per request.
  for pinned_provider_entry in \
    cerebras:Cerebras \
    deepinfra:DeepInfra \
    fireworks:Fireworks \
    groq:Groq \
    nebius:Nebius \
    novita:Novita \
    parasail:Parasail \
    sambanova:SambaNova \
    together:Together
  do
    provider_slug="${pinned_provider_entry%%:*}"
    provider_label="${pinned_provider_entry#*:}"
    cat <<PINNED_ENDPOINT
      - name: "OpenRouter ($provider_label, ZDR)"
        apiKey: "\${OPENROUTER_KEY}"
        baseURL: "https://openrouter.ai/api/v1"
        models:
          default: ["openrouter/auto"]
          fetch: true
        titleConvo: true
        titleModel: "current_model"
        dropParams: ["stop"]
        addParams:
          provider:
            only: ["$provider_slug"]
            allow_fallbacks: false
            zdr: true
            data_collection: "deny"
        modelDisplayLabel: "OpenRouter ($provider_label, ZDR)"
  PINNED_ENDPOINT
  done
  } > ~/librechat/librechat.yaml
  GENERATE_LIBRECHAT_YAML
  # LibreChat secrets, generated ONCE per VM (the guard means a re-init never rotates
  # them). CREDS_KEY/CREDS_IV encrypt provider API keys saved through the UI into mongo -
  # lose them and the keys inside every existing backup become undecryptable, which is why
  # llm-backup tars ~/librechat WITH .env. JWT_* sign login sessions. Upstream requires
  # CREDS_KEY = 64 hex chars, CREDS_IV = 32 hex chars (`openssl rand -hex` prints 2 hex
  # chars per byte).
  su - user -c 'set -eu
    if [ ! -f ~/librechat/.env ]; then
      umask 077
      {
        printf "# Generated once at init by the llm_librechat ivm template.\n"
        printf "# Default account (pre-created at init): admin@example.com / adminadmin - log in\n"
        printf "# with the EMAIL. NAT-only VM (only the host reaches :3080), hence the weak\n"
        printf "# password; the LOGIN form enforces MIN_PASSWORD_LENGTH (default 8) too, which\n"
        printf "# is why it is admin twice. Add accounts with:\n"
        printf "#   podman exec LibreChat npm run create-user -- <email> <name> <username>\n"
        printf "ALLOW_REGISTRATION=false\n"
        printf "# No meilisearch container in the trimmed compose -> keep message search off.\n"
        printf "SEARCH=false\n"
        printf "# LibreChat default SESSION_EXPIRY is 15 MINUTES - constant re-logins. NAT-only\n"
        printf "# single-user box, so long-lived sessions are the right trade (same doctrine as\n"
        printf "# the weak password). Values are JS ms expressions, evaluated by LibreChat.\n"
        printf "SESSION_EXPIRY=(1000 * 60 * 60 * 24) * 30\n"
        printf "REFRESH_TOKEN_EXPIRY=(1000 * 60 * 60 * 24) * 90\n"
        printf "JWT_SECRET=%s\n" "$(openssl rand -hex 32)"
        printf "JWT_REFRESH_SECRET=%s\n" "$(openssl rand -hex 32)"
        printf "CREDS_KEY=%s\n" "$(openssl rand -hex 32)"
        printf "CREDS_IV=%s\n" "$(openssl rand -hex 16)"
        printf "# OpenRouter API key - set it with: llm-key <key>  (do not edit by hand)\n"
        printf "OPENROUTER_KEY=\n"
      } > ~/librechat/.env
    fi
  '
  # Run the compose stack as a PER-USER systemd service (~/.config/systemd/user), the same
  # pattern as llm_sillytavern.yaml: `user` (no sudo) fully controls it, and llm-backup
  # stops/starts it for consistent tars (a stopped mongo makes the raw data-node tar safe).
  su - user -c 'mkdir -p ~/.config/systemd/user && cat > ~/.config/systemd/user/librechat.service' <<'EOF'
  [Unit]
  Description=LibreChat (rootless podman-compose)
  [Service]
  Type=simple
  WorkingDirectory=%h/librechat
  ExecStart=/usr/bin/podman-compose up
  ExecStop=/usr/bin/podman-compose down
  Restart=on-failure
  [Install]
  WantedBy=default.target
  EOF
  # enable-linger asks logind to bring up the lingering user manager + its D-Bus
  # ASYNCHRONOUSLY (podman_rootless's post_install already requested it; repeating is a
  # no-op); wait for the user bus socket before driving systemctl --user (else "Failed to
  # connect to bus"). `su` is not a PAM login, so XDG_RUNTIME_DIR and
  # DBUS_SESSION_BUS_ADDRESS are unset - set BOTH (XDG alone is not always enough).
  loginctl enable-linger user
  guest_user_uid="$(id -u user)"
  for _ in $(seq 1 100); do [ -S "/run/user/$guest_user_uid/bus" ] && break; sleep 0.2; done
  su - user -c 'export XDG_RUNTIME_DIR=/run/user/$(id -u); export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"; systemctl --user daemon-reload; systemctl --user enable --now librechat'
  # One-command API-key setter at ~/.local/bin/llm-key: writes OPENROUTER_KEY into
  # ~/librechat/.env and RECREATES the compose stack. Exists so setting the key never
  # means hand-editing a file.
  su - user -c 'mkdir -p ~/.local/bin && cat > ~/.local/bin/llm-key && chmod +x ~/.local/bin/llm-key' <<'LLMKEY'
  #!/usr/bin/env bash
  # Set the OpenRouter API key for LibreChat: updates OPENROUTER_KEY in ~/librechat/.env
  # and RECREATES the compose stack so the container picks it up. `podman restart` is
  # NOT enough: compose `env_file` is injected at container CREATION, a restarted
  # container keeps its old env (containers/podman-compose#409) - the systemd unit's
  # stop/start = `podman-compose down` / `up` recreates. Usage: llm-key <key>
  set -euo pipefail
  # su/ssh contexts may lack these; systemctl --user needs both to reach the user bus.
  export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
  export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=${XDG_RUNTIME_DIR}/bus}"
  [ "$#" = 1 ] || { printf 'usage: llm-key <openrouter-api-key>\n' >&2; exit 1; }
  librechat_env_file="$HOME/librechat/.env"
  [ -f "$librechat_env_file" ] || { printf 'llm-key: %s not found\n' "$librechat_env_file" >&2; exit 1; }
  if grep -q '^OPENROUTER_KEY=' "$librechat_env_file"; then
    sed --in-place "s|^OPENROUTER_KEY=.*|OPENROUTER_KEY=$1|" "$librechat_env_file"
  else
    printf 'OPENROUTER_KEY=%s\n' "$1" >> "$librechat_env_file"
  fi
  systemctl --user restart librechat
  printf 'llm-key: OpenRouter key set, LibreChat stack recreated - give it a few seconds, then refresh the browser.\n'
  LLMKEY
  # Guest-local backup/restore helper at ~/.local/bin/llm-backup (on PATH via the zsh
  # dotfiles) - same name + interface in every llm_* appliance VM. It writes/reads plain
  # tars under the host-shared ~/Downloads, so backups land on the host by themselves.
  su - user -c 'mkdir -p ~/.local/bin && cat > ~/.local/bin/llm-backup && chmod +x ~/.local/bin/llm-backup' <<'LCSCRIPT'
  #!/usr/bin/env bash
  # LibreChat backup/restore (guest-local, no sudo). Tars ~/librechat (mongo data-node,
  # .env with the CREDS_* decryption secrets, uploads, images, logs, compose file) into
  # ~/Downloads/LibreChatBackups/ (host-shared). Stops the service around the tar so the
  # raw mongo data dir is consistent, and restarts it after. Restore is destructive.
  set -euo pipefail
  # su/cron contexts don't set these, and systemctl --user needs both to reach the user bus.
  export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
  export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=${XDG_RUNTIME_DIR}/bus}"
  APP_DIR="$HOME/librechat"
  BACKUP_DIR="$HOME/Downloads/LibreChatBackups"
  die() { printf 'llm-backup: %s\n' "$1" >&2; exit 1; }
  svc_active() { [ "$(systemctl --user is-active librechat 2>/dev/null || true)" = active ]; }
  svc_stop()  { systemctl --user stop librechat 2>/dev/null || true; }
  svc_start() { systemctl --user start librechat 2>/dev/null || true; }
  usage() {
    printf '%s\n' \
      "llm-backup - LibreChat backup/restore (dir: $BACKUP_DIR)" \
      "  llm-backup [backup]         stop LibreChat, write LCBackup_YYYYMMDD_HHmm.tar, restart" \
      "  llm-backup list             list existing backups" \
      "  llm-backup restore <file>   stop LibreChat, restore a backup (destructive), restart" \
      "  llm-backup restore latest   restore the newest backup" >&2
  }
  do_backup() {
    [ -d "$APP_DIR/data-node" ] || die "no $APP_DIR/data-node - is LibreChat installed?"
    mkdir -p "$BACKUP_DIR"
    local out; out="$BACKUP_DIR/LCBackup_$(date +%Y%m%d_%H%M).tar"
    local was_running=0
    if svc_active; then was_running=1; fi
    svc_stop
    # podman unshare = run inside podman's user namespace: mongo writes data-node as a
    # non-root container uid, which maps to host subuids that plain `user` cannot read;
    # inside the namespace they are readable AND ownership survives backup + restore intact.
    podman unshare tar -C "$HOME" -cf "$out" librechat
    if [ "$was_running" = 1 ]; then svc_start; fi
    sync
    printf 'llm-backup: wrote %s (%s)\n' "$out" "$(du -h "$out" | cut -f1)"
  }
  do_list() {
    ls -lh "$BACKUP_DIR"/LCBackup_*.tar 2>/dev/null || die "no backups in $BACKUP_DIR"
  }
  do_restore() {
    local target="$1" ans
    [ -n "$target" ] || { usage; exit 1; }
    if [ "$target" = latest ]; then
      target="$(ls -1t "$BACKUP_DIR"/LCBackup_*.tar 2>/dev/null | head -n1 || true)"
      [ -n "$target" ] || die "no backups in $BACKUP_DIR"
    fi
    if [ ! -f "$target" ] && [ -f "$BACKUP_DIR/$target" ]; then target="$BACKUP_DIR/$target"; fi
    [ -f "$target" ] || die "not found: $target"
    printf 'llm-backup: this OVERWRITES %s from:\n  %s\nContinue? [y/N] ' "$APP_DIR" "$target"
    read -r ans
    case "$ans" in [yY]*) ;; *) die "aborted" ;; esac
    svc_stop
    podman unshare tar -C "$HOME" -xf "$target"
    svc_start
    sync
    printf 'llm-backup: restored and LibreChat restarted.\n'
  }
  case "${1:-}" in
    ""|backup) do_backup ;;
    list)      do_list ;;
    restore)   do_restore "${2:-}" ;;
    -h|--help) usage ;;
    *)         usage; exit 1 ;;
  esac
  LCSCRIPT
  # LAST step on purpose (interrupting it loses nothing else): pre-create the default
  # account admin@example.com / adminadmin (login is by EMAIL; weak creds are fine on
  # this NAT-only box; admin twice because the LOGIN form enforces MIN_PASSWORD_LENGTH,
  # default 8). create-user runs inside the api container and needs mongo up, so retry
  # until the compose stack is ready - LOUDLY: progress every attempt (a silent wait
  # reads as a hang), each attempt capped by `timeout 20` (a not-yet-up mongo can make
  # the script sit on a ~30s connect timeout), stdin from /dev/null (any unexpected
  # interactive prompt fails fast instead of hanging forever). `--email-verified=true`
  # is REQUIRED, not optional: without the flag create-user (v0.8.7) interactively asks
  # "Email verified? (Y/n)" even when every positional arg is given - with no stdin that
  # question hangs forever (the original init-hang root cause, found the hard way).
  # "already exists" counts as success, which keeps a re-init idempotent.
  su - user -c 'set -eu
    printf "llm_librechat: pre-creating default account admin@example.com (waits for the stack to come up)...\n"
    admin_account_ready=0
    create_user_output=""
    for attempt in $(seq 1 30); do
      if create_user_output="$(timeout 20 podman exec LibreChat npm run create-user -- admin@example.com Admin admin adminadmin --email-verified=true < /dev/null 2>&1)"; then
        admin_account_ready=1
        break
      fi
      case "$create_user_output" in
        *"already exists"*) admin_account_ready=1; break ;;
      esac
      printf "llm_librechat: stack not ready yet (attempt %s/30): %s\n" "$attempt" "$(printf %s "$create_user_output" | head -n 1)"
      sleep 2
    done
    if [ "$admin_account_ready" != 1 ]; then
      printf "%s\n" "$create_user_output" >&2
      printf "llm_librechat: default account creation FAILED after 30 attempts - see output above\n" >&2
      exit 1
    fi
    printf "llm_librechat: default account ready (admin@example.com / adminadmin - log in with the EMAIL).\n"
    printf "llm_librechat: NEXT: set your OpenRouter key - enter the VM and run: llm-key <your-key>\n"
  '
