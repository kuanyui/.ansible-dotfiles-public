# yaml-language-server: $schema=../template.schema.json
# OpenCode agent VM: Node.js + npm `opencode-ai` - a multi-provider TUI agent; pair it
# with OpenRouter via its in-app `/connect` (key lands in-guest, see `usage`).
template_name: agent_opencode
description: "OpenCode agent box (Debian + Node.js + opencode-ai CLI; connect OpenRouter in-app with /connect)"
host_bound_dir: $(pwd)
hw:
  cpu: 4
  memory: 4G
  disk: 10G
os:
  type: linux
  distro: debian
  image:
    source: incus
    uri: debian/13
sys:
  timezone: host
net:
  mode: nat
mounts:
  - host: $(pwd)
    guest: /workspaces/$(basename "$(pwd)")
    shadow:
      - .git
shell_default_dir_after_login: /workspaces/$(basename "$(pwd)")   # `ivm sh` starts in the mounted project (matches the mount's guest path)
thirdparty_software:
  - agent_opencode   # npm install -g opencode-ai (brings its own nodejs + npm deps); recipe in roles/provision/defaults/main/thirdparty_software.yml
dotfiles:
  - bash
  - tmux
  - zsh
usage:
  - "connect OpenRouter (one-time): run `opencode`, then its `/connect` command - pick OpenRouter, paste your API key (stored in-guest at ~/.local/share/opencode/auth.json)"
  - "pick a model: `/models` inside opencode"
