# yaml-language-server: $schema=../template.schema.json
# A BARE openSUSE dev box: baseline + `basic_tools`, nothing else. Tracks
# Tumbleweed (rolling) on purpose, NOT Leap - Leap's repos lack too much (no
# telegram, no fcitx5, ...). No GUI, no mounts; extend per project. The minimal
# openSUSE counterpart of base_debian / base_fedora.
template_name: base_opensuse
description: "bare openSUSE Tumbleweed dev box - baseline + basic_tools, no GUI"
hw:
  cpu: 2
  memory: 4G
  disk: 20G
os:
  type: linux
  distro: opensuse
  image:
    source: incus
    uri: opensuse/tumbleweed
sys:
  gui: false
  timezone: host
net:
  mode: nat
distro_package_groups:
  - basic_tools
dotfiles:
  - bash
  - tmux
  - zsh
