# yaml-language-server: $schema=../template.schema.json
template_name: agent_claude
description: "Claude Code agent box (Debian; mounts cwd + shadows .git/.vscode; claude CLI)"
host_bound_dir: $(pwd)
hw:
  cpu: 4
  memory: 8G
  disk: 30G
  nested_virt: false
os:
  type: linux
  distro: debian
  image:
    source: incus
    uri: debian/13
sys:
  gui: false
  timezone: host
  ssh_server:
    enabled: false
    port: 20023
    root_login: false
    password_login: false
    authorized_keys:
      - ~/.ssh/id_ed25519.pub
net:
  mode: nat
mounts:
  - host: $(pwd)
    guest: /workspaces/$(basename "$(pwd)")
    shadow:
      - .git
      - .vscode
shell_default_dir_after_login: /workspaces/$(basename "$(pwd)")   # `ivm sh` starts in the mounted project (matches the mount's guest path)
distro_package_groups:
  - tools_basic
  # emacs is NOT a default - run `ivm provision emacs` to add the editor + its ~/.emacs.d on demand
distro_packages:
  - curl
  - git
thirdparty_software:
  - agent_claude   # curl|bash installer; recipe in roles/provision/defaults/main/thirdparty_software.yml
