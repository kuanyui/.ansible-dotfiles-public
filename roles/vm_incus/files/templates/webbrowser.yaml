# yaml-language-server: $schema=../template.schema.json
template_name: webbrowser
description: "openSUSE icewm desktop - Firefox + CJK fonts/input, GUI, mounts ~/Downloads"
host_bound_dir: $(pwd)
hw:
  cpu: 4
  memory: 4G
  disk: 20G
  nested_virt: false
os:
  type: linux
  distro: opensuse
  image:
    source: incus
    uri: opensuse/tumbleweed
sys:
  gui: true            # ivm installs spice-vdagent + xdg-user-dirs
  input_method: fcitx5  # ivm writes the IM env vars to /etc/environment
  timezone: host
  ssh_server:
    enabled: false
    port: 20023
    root_login: false
    password_login: false
    authorized_keys:
      - ~/.ssh/id_ed25519.pub
mounts:
  # Host's XDG Download -> guest ~/Downloads, where Firefox saves by default.
  - host: $(xdg-user-dir DOWNLOAD)
    guest: /home/user/Downloads
distro_package_groups:
  - tools_basic
  - gui_x11     # X server + startx + xauth
  - cjk_fonts   # Noto Sans CJK (one pan-CJK font)
  - cjk_input   # fcitx5 + mozc + chewing + gtk/qt frontends
distro_packages:
  # spice-vdagent + xdg-user-dirs from `sys.gui`; fcitx5 from `cjk_input`.
  - MozillaFirefox
  - icewm                 # window manager
  - icewm-theme-branding  # openSUSE-only: the openSUSE default icewm theme/background
  - lightdm               # display manager
dotfiles:
  - bash
  - zsh
post_install_script: |
  systemctl set-default graphical.target
  mkdir -p /etc/lightdm/lightdm.conf.d
  printf '[Seat:*]\nautologin-user=user\nautologin-session=icewm\n' > /etc/lightdm/lightdm.conf.d/autologin.conf
  # --force: openSUSE pre-aliases display-manager.service, so a plain enable collides.
  systemctl enable --force lightdm
  # icewm ignores XDG autostart, so hand-start the things that rely on it from its
  # own startup: spice-vdagent (host<->guest clipboard) + fcitx5 (input method).
  su - user -c 'mkdir -p ~/.config/icewm && printf "#!/bin/sh\nspice-vdagent &\nfcitx5 -d &\n" > ~/.config/icewm/startup && chmod +x ~/.config/icewm/startup'
