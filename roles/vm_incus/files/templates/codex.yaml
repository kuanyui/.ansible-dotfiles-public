# yaml-language-server: $schema=../template.schema.json
# Codex agent VM: the `codex` CLI as a standalone prebuilt binary - no nodejs/npm, and no
# `distro_packages` at all (its installer needs only curl + ca-certificates, from the always-on
# `incus_guest_baseline`, plus Essential-in-Debian tar/coreutils). See the agent_codex recipe.
template_name: codex
description: "Codex agent box (Debian + @openai/codex CLI)"
hw:
  cpu: 4
  memory: 4G
  disk: 10G
os:
  type: linux
  distro: debian
  image:
    source: incus
    uri: debian/13
sys:
  timezone: host
net:
  mode: nat
mounts:
  - host: $(pwd)
    guest: /workspaces/$(basename "$(pwd)")
    shadow:
      - .git
shell_default_dir_after_login: /workspaces/$(basename "$(pwd)")   # `ivm sh` starts in the mounted project (matches the mount's guest path)
thirdparty_software:
  - agent_codex   # chatgpt.com/codex/install.sh -> ~/.local/bin/codex; recipe in roles/provision_thirdparty_software/defaults/main.yml
