# yaml-language-server: $schema=../template.schema.json
# Codex agent VM: Node.js + npm `@openai/codex`.
template_name: codex
description: "Codex agent box (Debian + Node.js + @openai/codex CLI)"
hw:
  cpu: 4
  memory: 4G
  disk: 10G
os:
  type: linux
  distro: debian
  image:
    source: incus
    uri: debian/13
sys:
  timezone: host
net:
  mode: nat
mounts:
  - host: $(pwd)
    guest: /workspaces/$(basename "$(pwd)")
    shadow:
      - .git
shell_default_dir_after_login: /workspaces/$(basename "$(pwd)")   # `ivm sh` starts in the mounted project (matches the mount's guest path)
distro_packages:
  - nodejs
  - npm
thirdparty_software:
  - agent_codex   # npm install -g @openai/codex; recipe in roles/provision_thirdparty_software/defaults/main.yml
