# yaml-language-server: $schema=../template.schema.json
# Codex agent VM: Node.js + npm `@openai/codex`.
template_name: codex
hw:
  cpu: 4
  memory: 4G
  disk: 10G
os:
  type: linux
  distro: debian
  image:
    source: incus
    uri: debian/13
sys:
  timezone: host
net:
  mode: nat
mounts:
  - host: $(pwd)
    guest: /workspaces/$(basename "$(pwd)")
    shadow:
      - .git
distro_packages:
  - nodejs
  - npm
thirdparty_software:
  - codex   # npm install -g @openai/codex; recipe in roles/thirdparty_software/defaults/main.yml
