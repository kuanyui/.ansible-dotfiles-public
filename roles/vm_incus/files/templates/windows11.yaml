# yaml-language-server: $schema=../template.schema.json
template_name: windows11
description: "Windows 11 VM (GUI; secureboot + TPM)"
hw:
  cpu: 4
  memory: 8G
  disk: 64G
  secureboot: true
  tpm: true
os:
  type: windows
  image:
    source: iso
    uri: ~/ISOs/Win11_24H2_x64.iso
sys:
  gui: true
  timezone: host
mounts:
  - host: $(xdg-user-dir DOWNLOAD)
    guest: 'Z:\Downloads'
windows:
  unattend: ~/incus/win11-unattend.xml
  post_install_powershell: |
    winget install --id Mozilla.Firefox -e --silent
