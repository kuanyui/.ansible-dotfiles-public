# yaml-language-server: $schema=../template.schema.json
template_name: claude
description: "Claude Code agent box (Debian; mounts cwd + shadows .git/.vscode; claude CLI + emacs)"
hw:
  cpu: 4
  memory: 8G
  disk: 30G
  nested_virt: false
os:
  type: linux
  distro: debian
  image:
    source: incus
    uri: debian/13
sys:
  gui: false
  timezone: host
  tmpfs:
    - /tmp
    - /var/tmp
  ssh_server:
    enabled: false
    port: 20023
    root_login: false
    password_login: false
    authorized_keys:
      - ~/.ssh/id_ed25519.pub
net:
  mode: nat
mounts:
  - host: $(pwd)
    guest: /workspaces/$(basename "$(pwd)")
    shadow:
      - .git
      - .vscode
distro_package_groups:
  - tools_basic
distro_packages:
  - curl
  - git
thirdparty_software:
  - claude   # curl|bash installer; recipe in roles/provision_thirdparty_software/defaults/main.yml
dotfiles:
  - bash
  - tmux
  - zsh
  - emacs
