# Managed by Ansible - do not edit manually (source: roles/mpv/files/script-opts/touch-gestures.conf)
# Tuning for touch-gestures.lua. Upstream sample from
# github.com/christoph-heinrich/mpv-touch-gestures (touch-gestures.conf).

# valid options are:
# 'playlist' for changing the playlist item by swiping
# 'seek' for seeking by dragging
# (changed from upstream default 'playlist' - we want horizontal drag to seek)
horizontal_drag=seek

# scale seeking based on the duration of the video
proportional_seek=yes

# BASE (slow-drag) gain. With proportional_seek=yes this IS the finger:timeline
# ratio for a slow drag: 0.2 = drag 5 units, the seek bar moves 1 (5:1, fine).
# Lower = finer. The acceleration below only ever speeds UP from this base.
seek_scale=0.2

# LOCAL ADDITIONS (not upstream) - touch-friendly drag-seek. See roles/mpv/README.md
# "Drag-seek acceleration". Defaults tuned for KDE Wayland default touch.
#   seek_deadzone_pixels: ignore movement below this many px. Kills the touch jitter
#     that makes a slow drag shake back and forth. RAISE if still jittery.
#   seek_accel_*: a fast flick speeds up from the seek_scale base, NEVER slower than
#     it (gain is floored at 1), up to a hard ceiling of seek_scale * seek_accel_max_gain
#     (default 0.2 * 5 = 1.0 = a fast full-screen swipe scrubs the whole video).
#     - seek_accel_exponent: how quickly it ramps. 1 = no acceleration (always the
#       base ratio). 1.25 = gentle, 2 = steep.
#     - seek_accel_pixels_ref: per-event px speed where acceleration starts (gain 1
#       below it). Must be > 0.
#     - seek_accel_max_gain: the fast ceiling multiplier. LOWER it to cap the fast
#       seek rate lower.
# Also: on LONG videos `proportional_seek=yes` makes even the base feel coarse (the
# bar spans the whole film); set proportional_seek=no above for a duration-independent
# fixed px->seconds feel.
seek_deadzone_pixels=6
seek_accel_exponent=1.7
seek_accel_pixels_ref=10
seek_accel_max_gain=5

# Pause playback while scrubbing (so the video does not keep playing under your
# finger mid-drag); the pre-drag play/pause state is restored when you let go.
# Set to no to keep playing while you drag.
seek_pause_while_dragging=yes
