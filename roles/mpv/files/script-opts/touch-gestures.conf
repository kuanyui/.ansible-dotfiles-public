# Managed by Ansible - do not edit manually (source: roles/mpv/files/script-opts/touch-gestures.conf)
# Tuning for touch-gestures.lua. Upstream sample from
# github.com/christoph-heinrich/mpv-touch-gestures (touch-gestures.conf).

# valid options are:
# 'playlist' for changing the playlist item by swiping
# 'seek' for seeking by dragging
# (changed from upstream default 'playlist' - we want horizontal drag to seek)
horizontal_drag=seek

# scale seeking based on the duration of the video
proportional_seek=yes

# scale factor for seeking. Lower = less sensitive = finer control / less
# overshoot (try 0.5 if a full-screen drag jumps too far). Raise if too slow.
seek_scale=1
