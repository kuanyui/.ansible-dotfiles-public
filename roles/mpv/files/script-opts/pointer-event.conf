# Managed by Ansible - do not edit manually (source: roles/mpv/files/script-opts/pointer-event.conf)
# Wires pointer-event.lua's detected events to touch-gestures.lua (script name
# `touch_gestures`). Upstream sample from
# github.com/christoph-heinrich/mpv-touch-gestures (pointer-event.conf).
# NOTE: left_long points at uosc's menu - needs the uosc script installed;
# without it, a long-press just logs a "binding not found" warning (harmless).

# Margins = area pointer-event ignores. left/right/top = 0 so the full-width
# left/center/right thirds AND the top speed row are active; the bottom 130 px is
# left out so taps there fall through to the on-screen controller / uosc bottom bar.
margin_left=0
margin_right=0
margin_top=0
margin_bottom=130
ignore_left_single_long_while_window_dragging=yes
# single now goes through touch-gestures.lua for POSITIONAL dispatch (top = speed,
# middle = seek/pause), not a plain `cycle pause`.
left_single=script-message-to touch_gestures single
left_double=script-message-to touch_gestures double
left_long=script-binding uosc/menu-blurred
left_drag_start=script-message-to touch_gestures drag_start
left_drag_end=script-message-to touch_gestures drag_end
left_drag=script-message-to touch_gestures drag
