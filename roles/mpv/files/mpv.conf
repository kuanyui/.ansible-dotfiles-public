# Managed by Ansible - do not edit manually (source: roles/mpv/files/mpv.conf)
#
# README
# --autofit=640x360 can make mpv won't automatically modify geometry when loading new file, unless you manually adjust it.

###########
# General #
###########

#save-position-on-quit
#no-border                               # no window title bar
msg-module                              # prepend module name to log messages
msg-color                               # color log messages on terminal
term-osd-bar                            # display a progress bar on the terminal
use-filedir-conf                        # look for additional config files in the directory of the opened file
#pause                                   # no autoplay
keep-open                               # keep the player open when a file's end is reached
autofit-larger=100%x95%                 # resize window in case it's larger than W%xH% of the screen
cursor-autohide-fs-only                 # don't autohide the cursor in window mode, only fullscreen
input-media-keys=yes                    # enable/disable OSX media keys
cursor-autohide=1000                    # autohide the curser after 1s
prefetch-playlist=yes
force-seekable=yes

# Never move the window by dragging the video area. On touchscreens a
# one-finger drag is emulated as a left-button drag (input-touch-emulate-mouse
# defaults to yes), so with window-dragging on, any swipe flings the whole
# window around; it also steals drag events from the touch-gesture scripts
# (pointer-event.lua explicitly warns when window-dragging is on). Window moving
# stays available through the compositor: title bar drag or KWin's Meta+drag -
# mpv cannot and does not block those. Replaces a dropped per-machine profile
# from the stow era, now unconditional.
window-dragging=no

# JSON IPC socket - uncomment to control mpv from external scripts via socat
# (`echo '<command>' | socat - /tmp/mpvsocket`, e.g. bound to KDE global
# shortcuts). Off by default: anything that can write to the socket controls
# the player.
# https://mpv.io/manual/stable/#json-ipc
#input-ipc-server=/tmp/mpvsocket

screenshot-format=png
screenshot-png-compression=8
screenshot-template='~/Desktop/%F (%P) %n'

hls-bitrate=max                         # use max quality for HLS streams

[ytdl-desktop]
profile-desc=cond:is_desktop()
ytdl-format=bestvideo[height<=?1080][fps<=?30][protocol!=http_dash_segments]+bestaudio/best

[ytdl-laptop]
profile-desc=cond:is_laptop()
ytdl-format=bestvideo[height<=?1080][fps<=?30][vcodec!=?vp9][protocol!=http_dash_segments]+bestaudio/best

# NOTE (migration from the legacy stow dotfiles): a few per-machine profiles
# were dropped here - they keyed on hostname fragments (a device fingerprint in
# a public repo), and their condition mechanism does not work on Linux anyway
# (the HOSTNAME env var is rarely set for GUI launches). One of them carried
# input-ipc-server; that moved to the General section above, commented out.
# Another carried no-window-dragging for a touchscreen machine; that became
# the unconditional `window-dragging=no` in the General section.

[default]
loop-playlist=inf
#loop-file=inf

#########
# Cache #
#########

cache=yes
cache-secs=10                           # how many seconds of audio/video to prefetch if the cache is active


#############
# OSD / OSC #
#############

osd-level=1                             # enable osd and display --osd-status-msg on interaction
osd-duration=2500                       # hide the osd after x ms
osd-status-msg='${time-pos} / ${duration}${?percent-pos:　(${percent-pos}%)}${?frame-drop-count:${!frame-drop-count==0:　Dropped: ${frame-drop-count}}}\n${?chapter:Chapter: ${chapter}}'

osd-font='Source Sans Pro'
osd-font-size=32
osd-color='#CCFFFFFF'                   # ARGB format
osd-border-color='#DD322640'            # ARGB format
#osd-shadow-offset=1                    # pixel width for osd text and progress bar
osd-bar-align-y=0                       # progress bar y alignment (-1 top, 0 centered, 1 bottom)
osd-border-size=2                       # size for osd text and progress bar
osd-bar-h=5                             # height of osd bar as a fractional percentage of your screen height
osd-bar-w=60                            # width of " " "


#############
# Subtitles #
#############

sub-auto=fuzzy                          # external subs don't have to match the file name exactly to autoload
sub-file-paths-append=ass               # search for external subs in these relative subdirectories
sub-file-paths-append=srt
sub-file-paths-append=sub
sub-file-paths-append=subs
sub-file-paths-append=subtitles

demuxer-mkv-subtitle-preroll            # try to correctly show embedded subs when seeking
embeddedfonts=yes                       # use embedded fonts for SSA/ASS subs
sub-fix-timing=no                       # do not try to fix gaps (which might make it worse in some cases)
sub-ass-style-overrides=Kerning=yes     # allows you to override style parameters of ASS scripts (renamed from sub-ass-force-style, which now warns at startup)
sub-use-margins
sub-ass-force-margins

# the following options only apply to subtitles without own styling (i.e. not ASS but e.g. SRT)
sub-font="Source Sans Pro Semibold"
sub-font-size=36
sub-color="#FFFFFFFF"
sub-border-color="#FF262626"
sub-border-size=3.2
sub-shadow-offset=1
sub-shadow-color="#33000000"
sub-spacing=0.5


#############
# Languages #
#############

slang=enm,en,eng             # automatically select these subtitles (decreasing priority)
alang=ja,jp,jpn,en,eng       # automatically select these audio tracks (decreasing priority)


#########
# Audio #
#########

audio-file-auto=fuzzy                   # external audio doesn't has to match the file name exactly to autoload
audio-pitch-correction=yes              # automatically insert scaletempo when playing with higher speed
volume-max=200                          # maximum volume in %, everything above 100 results in amplification
volume=100                              # default volume, 100 = unchanged


################
# Video Output #
################

# Active VOs (and some other options) are set conditionally
# See here for more information: https://github.com/wm4/mpv-scripts/blob/master/auto-profiles.lua
# on_battery(), is_laptop() and is_dektop() are my own additional functions imported from scripts/auto-profiles-functions.lua

# Defaults for all profiles
#
# vo=wlshm, NOT gpu: plain `mpv` runs confined by the no-GPU AppArmor profile
# `local_pathbased_mpv` (roles/apparmor), which denies X11 (xauth) and every
# /dev/dri node. Under that confinement `vo=gpu` cannot create ANY context
# (X11 -> denied silently, Wayland-GBM -> /dev/dri/card* denied) and mpv plays
# audio with no window. wlshm = Wayland shared-memory software output - needs
# neither X11 nor a DRM node, so it works inside the confinement.
# Hardware playback goes through the GPU launcher (ansible-mpv-gpu.desktop ->
# local_attachmentless_mpv_gpu), which must pass `--vo=gpu` on its command line
# to override this default AND needs the card-node grant - see TODO.md (deferred).
vo=wlshm
tscale=oversample                      # [sharp] oversample <-> linear (triangle) <-> catmull_rom <-> mitchell <-> gaussian <-> bicubic [smooth]
opengl-early-flush=no
opengl-pbo=yes
sigmoid-slope=10


[high-quality]
profile-desc=cond:is_desktop() and get('width', math.huge) < 3840
#scale=ewa_hanning
#scale-radius=3.2383154841662362 hanning with this radius is broken on OSX due to OpenGL driver bug
scale=ewa_lanczossharp
cscale=ewa_lanczossoft
dscale=mitchell
scale-antiring=0
cscale-antiring=0
dither-depth=auto
correct-downscaling=yes
sigmoid-upscaling=yes
deband=yes
hwdec=no

[mid-quality]
profile-desc=cond:(is_laptop() and not on_battery() and get('width', math.huge) < 1920) or (is_desktop() and get('width', math.huge) >= 3840)
scale=spline36
cscale=bilinear
dscale=mitchell
scale-antiring=1.0
cscale-antiring=1.0
dither-depth=auto
correct-downscaling=yes
sigmoid-upscaling=yes
deband=yes
hwdec=no

[low-quality]
profile-desc=cond:is_laptop() and (on_battery() or get('width', math.huge) >= 1920)
scale=bilinear
cscale=bilinear
dscale=bilinear
scale-antiring=0
cscale-antiring=0
dither-depth=no
correct-downscaling=no
sigmoid-upscaling=no
deband=no
hwdec=auto

[60FPS]
profile-desc=cond:is_laptop() and get('container-fps', 0) >= 59
scale=bilinear
cscale=bilinear

[4K]
profile-desc=cond:get('width', -math.huge) >= 3840
vd-lavc-threads=32

[4K-inverted]
profile-desc=cond:get('width', math.huge) < 3840
vd-lavc-threads=0

###################################
# Protocol Specific Configuration #
###################################

[protocol.https]
#cache=yes
#cache-default=500000                    # size in KB
#cache-backbuffer=250000                 # size in KB
cache-secs=100                           # how many seconds of audio/video to prefetch
#user-agent='Mozilla/5.0 (Macintosh; Intel Mac OS X 10.11; rv:47.0) Gecko/20100101 Firefox/47.0'

[protocol.http]
#cache=yes
#cache-default=500000                    # size in KB
#cache-backbuffer=250000                 # size in KB
cache-secs=100                           # how many seconds of audio/video to prefetch
#user-agent='Mozilla/5.0 (Macintosh; Intel Mac OS X 10.11; rv:47.0) Gecko/20100101 Firefox/47.0'
