---
# Whether this host has a GUI (decides GUI `emacs` vs the `-nox` build below). A
# host property whose sole consumer is this role, so it lives here; override in
# group_vars / host_vars for a headless host.
has_gui_support: true

_emacs_itself_nox_package_names:
  Debian: emacs-nox
  RedHat: emacs-nw
  Suse: emacs-nox

emacs_itself_package_name: >-
  {{ has_gui_support | ternary(
    'emacs',
    _emacs_itself_nox_package_names[ansible_facts['os_family']]
  ) }}

emacs_packages_debian:
  - elpa-helm-core
  - elpa-vertico
  - elpa-marginalia
  - elpa-orderless
  - elpa-magit
  - elpa-diff-hl
  - elpa-rainbow-delimiters
  - elpa-markdown-mode
  - elpa-systemd
  - elpa-company
  - elpa-flycheck
  - elpa-dockerfile-mode
  - elpa-git-commit
  - elpa-jinja2-mode
  - elpa-projectile
  # manually installed
  # - elpa-undo-tree
  # - elpa-yaml-mode

emacs_packages_redhat:
  - emacs-magit
  - emacs-yaml-mode
  - emacs-dockerfile-mode
  - emacs-flycheck
  - emacs-flycheck-pycheckers
  - emacs-json-mode
  - emacs-company-mode
  # manually installed
  # - emacs-undo-tree
