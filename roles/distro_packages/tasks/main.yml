---
# Install the enabled `distro_packages_*` bundles (defaults/main.yml), toggled
# by the `distro_packages_install_*` booleans (group_vars/all.yml). The actual
# install is delegated to `roles/_install_distro_packages` so there is ONE
# multi-distro install path (ansible-core-only; shells `zypper` on openSUSE
# rather than `ansible.builtin.package` -> `community.general.zypper`). This
# role only decides WHICH bundles; `_install_distro_packages` decides HOW.

- name: Initialize `_distro_packages_enabled_bundles` to empty
  ansible.builtin.set_fact:
    _distro_packages_enabled_bundles: []

- name: Collect enabled bundles (toggled by `distro_packages_install_*`)
  ansible.builtin.set_fact:
    _distro_packages_enabled_bundles: "{{ _distro_packages_enabled_bundles + [item.bundle] }}"
  loop:
    - { toggle: distro_packages_install_basic_tools,   enabled: "{{ distro_packages_install_basic_tools }}",   bundle: "{{ distro_packages_basic_tools }}" }
    - { toggle: distro_packages_install_sys_tools,     enabled: "{{ distro_packages_install_sys_tools }}",     bundle: "{{ distro_packages_sys_tools }}" }
    - { toggle: distro_packages_install_net_tools,     enabled: "{{ distro_packages_install_net_tools }}",     bundle: "{{ distro_packages_net_tools }}" }
    - { toggle: distro_packages_install_wayland_tools, enabled: "{{ distro_packages_install_wayland_tools }}", bundle: "{{ distro_packages_wayland_tools }}" }
  when: item.enabled | bool
  loop_control:
    label: "{{ item.toggle }}={{ item.enabled }}"

# One include for all enabled bundles: build the per-`os_family` install list
# as `common (all bundles) + that family's overlay (only bundles that define
# it)`. `_install_distro_packages` then picks the host's `os_family` key and
# installs via the right package manager. Skipped entirely when every toggle
# is off (empty list would trip the sub-role's non-empty assert).
- name: Install enabled `distro_packages_*` bundles via `roles/_install_distro_packages`
  ansible.builtin.include_role:
    name: _install_distro_packages
  vars:
    install_distro_packages:
      Debian:
        install: "{{ (_distro_packages_enabled_bundles | map(attribute='common') | flatten)
                   + (_distro_packages_enabled_bundles | selectattr('debian', 'defined') | map(attribute='debian') | flatten) }}"
      Suse:
        install: "{{ (_distro_packages_enabled_bundles | map(attribute='common') | flatten)
                   + (_distro_packages_enabled_bundles | selectattr('suse', 'defined') | map(attribute='suse') | flatten) }}"
      RedHat:
        install: "{{ (_distro_packages_enabled_bundles | map(attribute='common') | flatten)
                   + (_distro_packages_enabled_bundles | selectattr('redhat', 'defined') | map(attribute='redhat') | flatten) }}"
  when: _distro_packages_enabled_bundles | length > 0
