---
- name: Check whether install manifest `{{ container_apps_root }}/container-apps.manifest.yml` exists
  ansible.builtin.stat:
    path: "{{ container_apps_root }}/container-apps.manifest.yml"
  register: _container_apps_manifest_stat

- name: Skip uninstall - no manifest at `{{ container_apps_root }}/container-apps.manifest.yml` (already uninstalled?)
  ansible.builtin.meta: end_play
  when: not _container_apps_manifest_stat.stat.exists

- name: Slurp install manifest
  ansible.builtin.slurp:
    src: "{{ container_apps_root }}/container-apps.manifest.yml"
  register: _container_apps_manifest_raw

- name: Parse install manifest
  ansible.builtin.set_fact:
    _container_apps_manifest: "{{ _container_apps_manifest_raw.content | b64decode | from_yaml }}"

- name: Show recorded paths before removal
  ansible.builtin.debug:
    var: _container_apps_manifest

- name: Remove launchers (from `~/.local/bin/`, which is outside the namespace dir and therefore not covered by the wipe below)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{
      _container_apps_manifest.apps
      | map(attribute='variants') | flatten
      | map(attribute='launcher_path') | list
    }}

- name: Wipe `container_apps`'s own subdir `{{ _container_apps_manifest.container_apps_root | default(container_apps_root) }}` (templates, completions, ssh keys, manifest itself; siblings under `ansible-managed/` untouched)
  ansible.builtin.file:
    path: "{{ _container_apps_manifest.container_apps_root | default(container_apps_root) }}"
    state: absent
