---
# Shared host-level prep for any incus-using face role (`roles/incus_agents`,
# future `roles/incus_workstations`). Included via `include_role:
# _incus_host_setup` from the caller. Each step is gated on a no-`become`
# probe, so on a fully-set-up host this whole file becomes a no-op that
# doesn't even prompt for sudo; only steps that actually need elevation
# invoke `become`.

# ---------- Pre-flight asserts ----------
# Only distros that ship `incus` in their OFFICIAL repo are supported. We
# intentionally do NOT configure third-party repos here (Zabbly for Ubuntu,
# COPR for RHEL/Rocky/Alma) - that conflicts with the project's
# ansible-core-only / no-curl-pipe-sh posture. Escape hatch: each face role
# exposes its own `*_skip_host_setup` var (e.g. `incus_agents_skip_host_setup:
# true`) which gates the caller's `include_role: _incus_host_setup`. The
# user then provisions `incus` manually.

- name: Assert host distribution ships `incus` in its official repo (Fedora / Debian / openSUSE)
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in _incus_supported_distributions
    fail_msg: >-
      `{{ ansible_facts["distribution"] }}` does not ship `incus` in its
      official repo (as of 2026-05). Supported: Fedora 43+, Debian trixie+
      (or bookworm-backports), openSUSE Tumbleweed, openSUSE Leap 15.6+.
      To run on an unsupported distro, set the calling role's
      `*_skip_host_setup` var to true (e.g. `incus_agents_skip_host_setup:
      true` for `roles/incus_agents`) and provision `incus` manually.
  vars:
    _incus_supported_distributions:
      - Fedora
      - Debian
      - openSUSE Leap
      - openSUSE Tumbleweed

# ---------- Probe phase (no become) ----------

- name: Probe whether `incus.service` is active
  ansible.builtin.command: systemctl is-active incus.service
  register: _incus_svc_check
  changed_when: false
  failed_when: false

- name: Probe whether `{{ ansible_facts['user_id'] }}` is already in the `incus-admin` group
  ansible.builtin.command: id -nG {{ ansible_facts['user_id'] }}
  register: _incus_groups_check
  changed_when: false

# ---------- Mutation phase (become only when probe says so) ----------

- name: Install `incus` package via official distro repo (only if `incus` binary is missing)
  ansible.builtin.include_role:
    name: _install_distro_packages
  vars:
    install_distro_packages:
      Debian:
        install: [incus]
        probe: command -v incus
      Suse:
        install: [incus]
        probe: command -v incus
      RedHat:
        install: [incus]
        probe: command -v incus

# `guestfs-tools` (Red Hat / libguestfs) provides `virt-builder`, used as a
# safer alternative to `curl`-ing raw ISOs when bringing in a custom VM disk
# image (GPG-verified, pre-built qcow2 from libguestfs.org/builder/). All
# three supported families ship this under the same package name since
# libguestfs split its tools out in 2022.
- name: Install `guestfs-tools` package (provides `virt-builder` for GPG-verified VM disk image fetch; only if `virt-builder` binary is missing)
  ansible.builtin.include_role:
    name: _install_distro_packages
  vars:
    install_distro_packages:
      Debian:
        install: [guestfs-tools]
        probe: command -v virt-builder
      Suse:
        install: [guestfs-tools]
        probe: command -v virt-builder
      RedHat:
        install: [guestfs-tools]
        probe: command -v virt-builder

- name: Ensure `incus.service` is started + enabled (only if not already active)
  ansible.builtin.systemd:
    name: incus.service
    state: started
    enabled: true
  become: true
  when: _incus_svc_check.stdout | trim != 'active'

- name: Add `{{ ansible_facts['user_id'] }}` to `incus-admin` group (only if not already a member)
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: incus-admin
    append: true
  become: true
  when: "'incus-admin' not in (_incus_groups_check.stdout.split())"
  register: _incus_group_add

- name: Print re-login warning if the group was just added (group membership only takes effect in NEW shells)
  ansible.builtin.debug:
    msg: |
      `{{ ansible_facts['user_id'] }}` was just added to the `incus-admin` group.
      You MUST log out + back in (or `newgrp incus-admin` in this shell)
      before `v-<agent>` launchers can talk to the incus daemon. The
      preseed step below runs via `become: true` so this playbook is
      unaffected; only your interactive shell needs the re-login.
  when: _incus_group_add.changed

# ---------- Filesystem-level warning ----------
# Warn (don't fail) when defaulting incus storage to /var/lib/incus and /
# is btrfs. qcow2 VM images + btrfs CoW = bad combo: every write triggers
# block-level CoW, leading to space waste and write amplification. User
# is better off pointing `incus_storage_pool_source` at an ext4/xfs path
# OR `chattr +C` on /var/lib/incus/storage-pools/ to disable CoW for that
# subtree.

- name: Probe `/` filesystem type (CoW warning)
  ansible.builtin.command: stat -fc '%T' /
  register: _root_fs_type
  changed_when: false
  when: not incus_storage_pool_source

- name: Warn about btrfs CoW + qcow2 if defaulting to /var/lib/incus on btrfs
  ansible.builtin.debug:
    msg: |
      ⚠️  `incus_storage_pool_source` is empty AND `/` is btrfs.
      VM disks would land at /var/lib/incus/storage-pools/default/ on a CoW
      filesystem, which is a known bad combo for qcow2 (random writes amplify,
      space accounting balloons).
      Either:
        (a) Set `incus_storage_pool_source` to an ext4/xfs path
            (e.g. `/data/vm/incus` or `/home/{{ ansible_facts['user_id'] }}/incus-storage`)
            via host_vars/<hostname>.yml, or
        (b) After this playbook finishes, disable CoW for the storage dir:
              sudo chattr -R +C /var/lib/incus/storage-pools/
            (only affects newly-written files; existing ones need re-cp to
            inherit the flag)
  when:
    - not incus_storage_pool_source
    - _root_fs_type is defined
    - (_root_fs_type.stdout | trim) == 'btrfs'

# ---------- Initialize incus (idempotent: skipped if `default` storage pool already exists) ----------
# Run as root because the user we just added to `incus-admin` doesn't have
# that group active in this shell yet (group membership only refreshes on
# new login).

- name: Probe whether incus is already initialized (default storage pool present)
  ansible.builtin.command:
    cmd: incus storage list --format csv
  register: _incus_storage_list
  changed_when: false
  failed_when: false
  become: true

- name: Initialize incus via `incus admin init --preseed` (only if `default` storage pool not present)
  ansible.builtin.command:
    cmd: incus admin init --preseed
    stdin: "{{ lookup('template', 'incus_preseed.yml.j2') }}"
  when: "'default,' not in _incus_storage_list.stdout"
  become: true
  register: _incus_init
  changed_when: _incus_init.rc == 0

# ---------- firewalld: trust the incusbr0 bridge (only on firewalld hosts) ----------
# On firewalld-managed hosts (Fedora, openSUSE) the `incusbr0` bridge is NOT
# assigned to any zone, so it falls into the default zone (usually `public`),
# which DROPs DHCP (udp/67) on INPUT. Symptom: VMs get an IPv6 SLAAC address
# (ICMPv6 RA is permitted) but never obtain an IPv4 lease, so apt fails with
# "Temporary failure resolving deb.debian.org".
#
# Fix: put `incusbr0` into the built-in `trusted` zone. Scope is this ONE
# interface - a private internal NAT segment (10.x/24) carrying only our own
# VMs - so trusting it does NOT widen the host's real NICs (still in `public`).
# `incusbr0` is the fixed bridge name from `incus_preseed.yml.j2`.
#
# Detection MUST use `systemctl is-active firewalld`, NOT `firewall-cmd`. Any
# `firewall-cmd` call as a non-root user goes through polkit; under Ansible
# (non-interactive, no polkit agent attached) that call BLOCKS FOREVER waiting
# for an auth that never comes - a hang, not just a prompt. `systemctl
# is-active` needs neither root nor polkit (same idiom as the incus probe
# above), so it is the safe no-`become` detector. Hosts without firewalld
# (Debian + bare nftables) report non-active here and skip the apply task -
# incus manages its own rules there.
- name: Probe whether `firewalld` is active (the `incusbr0` zone fix only applies to firewalld hosts)
  ansible.builtin.command: systemctl is-active firewalld
  register: _incus_firewalld_active
  changed_when: false
  failed_when: false

# Everything that touches `firewall-cmd` is done HERE, in ONE `become: true`
# task running fully as root. Root bypasses polkit entirely, so there is no
# hang and no second password prompt (the become password is already cached
# from `--ask-become-pass`). The read-decide-change-reload is collapsed into a
# single privileged invocation so idempotency is decided in-script: if
# `incusbr0` is already in `trusted` it is a true no-op (changed_when false).
- name: Ensure `incusbr0` is in the firewalld `trusted` zone (fixes VMs not getting a DHCPv4 lease; no-op if already trusted)
  ansible.builtin.shell: |
    set -eu
    current_zone_of_incusbr0="$(firewall-cmd --get-zone-of-interface=incusbr0 2>/dev/null || true)"
    if [ "$current_zone_of_incusbr0" = "trusted" ]; then
        echo "INCUSBR0_ALREADY_TRUSTED"
        exit 0
    fi
    firewall-cmd --permanent --zone=trusted --change-interface=incusbr0
    firewall-cmd --reload
    echo "INCUSBR0_MOVED_TO_TRUSTED"
  become: true
  register: _incus_firewalld_zone_apply
  changed_when: "'INCUSBR0_MOVED_TO_TRUSTED' in _incus_firewalld_zone_apply.stdout"
  when: _incus_firewalld_active.stdout | trim == 'active'
