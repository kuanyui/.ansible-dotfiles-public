---
# Internal utility role - shared host-level prep for any incus-using face role
# (currently just `roles/incus_vm`). The face role `include_role`s this and
# supplies whatever VM-level config it needs on top.
#
# ---------- Storage pool config (preseed-only, first-time init) ----------
# These three vars feed into the `default` storage_pool block of
# `templates/incus_preseed.yml.j2`. They are EFFECTIVE ONLY at first-time
# `incus admin init --preseed`; already-initialized incus won't be re-pointed.
# To change pool layout after the fact: `incus storage create <new-pool> ...`
# + manual `incus move` of VMs, then `incus storage delete default`.
#
# ---------- Why this project's default is `btrfs` + loop file on `/home` ----------
# The project targets hosts where `/` is a small btrfs system partition (often
# ~160-180 GB; openSUSE Tumbleweed installer defaults look like this) and
# `/home` is a much larger ext4 partition (e.g. 1.8 TB). Putting Incus VM
# disks directly on `/` would run it out of space fast.
#
# So the role's default is: create a btrfs loop file at `/home/incus-storage.img`
# (sparse - actual `/home` usage starts near zero and grows as VMs write),
# point the `default` pool at it. btrfs gives cheap CoW snapshots; the loop
# file gets us btrfs semantics without repartitioning ext4 `/home`.
#
# Override in `host_vars/<hostname>.yml` for any machine that doesn't fit:
# see Examples block below.


# Examples for `host_vars/<hostname>.yml`:
#
#   # (this role's default - no override needed) btrfs loop file on `/home`.
#   # Recommended for the project's typical hosts (small btrfs `/`, big ext4
#   # `/home`); CoW makes per-VM disk + snapshot cheap.
#   incus_storage_pool_driver: btrfs
#   incus_storage_pool_source: /home/incus-storage.img
#   incus_storage_pool_size: 500GiB
#
#   # Override: Incus's built-in default behavior (dir backend at
#   # `/var/lib/incus/storage-pools/default/` on `/`). No CoW. Only fine on
#   # hosts where `/` has plenty of free space.
#   incus_storage_pool_driver: dir
#   incus_storage_pool_source: ""
#   incus_storage_pool_size: ""
#
#   # Override: plain dir on a sidecar disk mounted at /data
#   incus_storage_pool_driver: dir
#   incus_storage_pool_source: /data/vm/incus
#   incus_storage_pool_size: ""
#
#   # Override: zfs loop file on /home
#   incus_storage_pool_driver: zfs
#   incus_storage_pool_source: /home/incus-storage.zfs
#   incus_storage_pool_size: 500GiB



# `incus_storage_pool_driver`: which backend Incus creates the `default` pool
# with. Affects per-VM disk cost + snapshot semantics:
#   - `dir`        full copy per VM, no CoW. Works on any FS. Slow snapshots.
#   - `btrfs`      CoW reference per VM + per snapshot, near-zero space cost.
#                  This role's default (see rationale above).
#   - `zfs`        same idea, ZFS clones. Requires zfsutils on host.
#   - `lvm-thin`   thin LV per VM. Requires an LVM thin pool already configured.
incus_storage_pool_driver: btrfs

# `incus_storage_pool_source`: where the pool lives on disk. Semantics
# depend on `incus_storage_pool_driver`. See
# https://linuxcontainers.org/incus/docs/main/reference/storage_btrfs/
# (and the equivalent zfs / lvm pages) for the official enumeration:
#
#   - `dir`:    A directory path; Incus drops VM root.img files inside.
#               Empty -> Incus default `/var/lib/incus/storage-pools/default/`.
#
#   - `btrfs`:  THREE valid forms:
#               (a) Path to an existing btrfs SUBVOLUME (e.g. `/srv/incus` if
#                   `/srv` is a btrfs subvolume). No size needed. No loop file.
#               (b) Path to an existing BLOCK DEVICE (e.g. `/dev/nvme0n1p3`).
#                   Incus runs `mkfs.btrfs` on it. No size needed. No loop file.
#               (c) Path to a FILE that doesn't exist yet (e.g.
#                   `/home/incus-storage.img`). Incus creates it as a sparse
#                   file, loop-mounts it, and `mkfs.btrfs` inside. REQUIRES
#                   `incus_storage_pool_size`. This is the project default
#                   because most target hosts (small btrfs `/`, big ext4 `/home`)
#                   can't use (a) or (b) without repartitioning.
#
#   - `zfs`:    THREE valid forms, parallel to btrfs:
#               (a) Name of an existing ZFS dataset (NO leading `/`,
#                   e.g. `tank/incus`).
#               (b) Path to a block device. New ZFS pool created on it.
#               (c) Path to a file that doesn't exist yet -> loop file ZFS
#                   pool. REQUIRES `incus_storage_pool_size`.
#
#   - `lvm-thin`: Name of an existing LVM thin pool (format
#               `<volume-group>/<thinpool>`, NO leading `/`). The thin pool
#               must already be created on the host.
#
incus_storage_pool_source: /home/incus-storage.img

# `incus_storage_pool_size`: required ONLY when `incus_storage_pool_source`
# points at a file path that doesn't exist yet (i.e. you want Incus to
# CREATE a sparse loop file). Incus then creates the loop file with this
# declared apparent size; actual disk usage starts near zero and grows
# as VMs write.
#
# Leave EMPTY for every other form:
#   - dir backend (always)
#   - btrfs / zfs / lvm-thin pointing at an existing subvolume / dataset / LV
#   - btrfs / zfs pointing at an existing block device (size = device size)
#
# Sizes accept `GiB` / `TiB` (binary), e.g. `500GiB`, `2TiB`.
incus_storage_pool_size: 500GiB
