---
- name: Install zsh
  ansible.builtin.package:
    name: zsh
    state: present

- name: Install zsh plugins
  ansible.builtin.package:
    name:
      - zsh-syntax-highlighting
      - zsh-autosuggestions
    state: present
  when:
    - ansible_facts['os_family'] in ['Debian', 'RedHat']

- name: Set zsh as default shell for {{ target_user }}
  ansible.builtin.user:
    name: "{{ target_user }}"
    shell: /bin/zsh

- name: Set zsh as default shell for invoking user
  ansible.builtin.user:
    name: "{{ ansible_facts['env']['SUDO_USER'] }}"
    shell: /bin/zsh
  when:
    - ansible_facts['env']['SUDO_USER'] is defined
    - ansible_facts['env']['SUDO_USER'] != target_user
