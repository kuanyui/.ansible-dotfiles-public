---
# =============================================
# Deploy AppArmor profile
# =============================================

- name: Write Telegram AppArmor profile to /etc/apparmor.d/local_pathbased_telegram
  ansible.builtin.template:
    src: telegram/local_pathbased_telegram.aa.j2
    dest: /etc/apparmor.d/local_pathbased_telegram
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: telegram

# =============================================
# Neutralize conflicting system Telegram profiles
# =============================================
# System profiles 'telegramdesktop' and 'telegram-desktop' auto-attach to the Telegram
# binary and take priority over our profile. Move them into
# _backup_of_default_profiles_from_package_manager/ so AppArmor does not scan them,
# while keeping them available for reference or restoration:
#   sudo cp /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/telegramdesktop /etc/apparmor.d/

- name: Ensure /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/ directory exists
  ansible.builtin.file:
    path: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: telegram

- name: Stat system Telegram profiles in /etc/apparmor.d/
  ansible.builtin.stat:
    path: /etc/apparmor.d/{{ item }}
  loop:
    - telegramdesktop
    - telegram-desktop
  register: apparmor__sys_telegram_stat
  tags: telegram

- name: Back up system Telegram profiles to _backup_of_default_profiles_from_package_manager/
  ansible.builtin.copy:
    remote_src: true
    src: /etc/apparmor.d/{{ item.item }}
    dest: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item.item }}
    owner: root
    group: root
    mode: '0644'
  loop: "{{ apparmor__sys_telegram_stat.results }}"
  when: item.stat.exists
  become: true
  tags: telegram

- name: Remove system Telegram profiles from /etc/apparmor.d/
  ansible.builtin.file:
    path: /etc/apparmor.d/{{ item.item }}
    state: absent
  loop: "{{ apparmor__sys_telegram_stat.results }}"
  when: item.stat.exists
  become: true
  notify: Reload apparmor
  tags: telegram

- name: Flush handlers to trigger AppArmor reload
  ansible.builtin.meta: flush_handlers
  tags: telegram

- name: Remove system Telegram profiles from kernel using backup files
  ansible.builtin.command:
    cmd: apparmor_parser -R /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item }}
  loop:
    - telegramdesktop
    - telegram-desktop
  become: true
  failed_when: false
  changed_when: false
  tags: telegram

# =============================================
# Remove bwrap launcher artifacts (idempotent)
# =============================================
# bwrap dropped: Telegram is now confined by the path-based AppArmor profile
# alone, which auto-attaches at execve of /usr/bin/Telegram regardless of how it
# is launched. Remove the old bwrap wrapper + its .desktop. `state: absent` is a
# no-op on re-runs and when the artifacts were never present (idempotent).

- name: "[IDEMPOTENCE] Remove deprecated file ~/.local/bin/{{ item }}"
  ansible.builtin.file:
    path: "/home/{{ apparmor_target_user }}/.local/bin/{{ item }}"
    state: absent
  loop:
    - Telegram                          # bwrap wrapper script (dropped in this change)
    - telegram-desktop                  # legacy name
    - ansible_bwrap_telegram_desktop    # legacy name
    - ansible_bwrap_telegram            # legacy name
  tags: telegram

- name: "[IDEMPOTENCE] Remove deprecated file ~/.local/share/applications/ansible_bwrap_telegram.desktop"
  ansible.builtin.file:
    path: "/home/{{ apparmor_target_user }}/.local/share/applications/ansible_bwrap_telegram.desktop"
    state: absent
  tags: telegram

# =============================================
# Deploy .desktop launcher (AppArmor-only, no bwrap)
# =============================================
# Exec runs /usr/bin/Telegram directly so the path-based profile attaches.
# `env`: `LIBGL_ALWAYS_SOFTWARE=1` keeps the GPU-off posture (the profile denies
# `/dev/dri`); `LD_LIBRARY_PATH` / `PYTHONPATH` are unset to block library
# injection via the environment (the dropped bwrap wrapper used to do both).

- name: Create directory ~/.local/share/applications for {{ apparmor_target_user }}
  ansible.builtin.file:
    path: "/home/{{ apparmor_target_user }}/.local/share/applications"
    state: directory
    owner: "{{ apparmor_target_user }}"
    mode: '0755'
  tags: telegram

- name: Write ~/.local/share/applications/ansible_telegram.desktop
  ansible.builtin.template:
    src: telegram/ansible_telegram.desktop.j2
    dest: "/home/{{ apparmor_target_user }}/.local/share/applications/ansible_telegram.desktop"
    owner: "{{ apparmor_target_user }}"
    mode: '0644'
  tags: telegram
