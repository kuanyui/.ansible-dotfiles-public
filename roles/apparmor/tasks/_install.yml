- ansible.builtin.import_tasks: seccomp.yml
- ansible.builtin.import_tasks: aaa_helpers.yml

# =============================================
# Idempotent stale file cleanup
# =============================================
# Runs after all deploy tasks so _managed reflects the complete set of files
# owned by this role. Running cleanup mid-deploy risks removing a file that
# another task has not yet re-deployed under its new name.
# Scoped to local_* so system-provided profiles and abstractions are never touched.

- name: Find deployed local_* files in /etc/apparmor.d/ and abstractions/
  ansible.builtin.find:
    paths:
      - /etc/apparmor.d/
      - /etc/apparmor.d/abstractions/
    patterns: "local_*"
  register: apparmor__deployed_local
  become: true
  tags: apparmor

- name: Build the basename allowlist of `local_*` files this role currently manages
  ansible.builtin.set_fact:
    apparmor__managed_local_basenames: >-
      {{ (apparmor_static_profiles | map(attribute='dest') | map('basename') | list)
       + apparmor_template_profile_names
       + apparmor_template_profile_names_own_flags_mode
       + (apparmor_static_abstractions | map(attribute='dest') | map('basename') | list)
       + apparmor_template_abstraction_names
       }}
  tags: apparmor

# Unload BEFORE the file is deleted - `apparmor_parser --remove` reads the profile name out of
# the file, so once the file is gone there is nothing left to name the profile with.
#
# Why this task has to exist at all: the `Reload apparmor` handler runs `systemctl reload
# apparmor`, which is a DIRECTORY SCAN - it only ever adds or replaces what it finds on disk,
# and never removes. Deleting an orphaned profile's file alone therefore leaves that profile
# resident in the kernel, still attached to its executable, still enforcing rules that no
# longer exist anywhere on disk. Only a reboot clears it. (Contrast a plain rule edit, where
# the profile NAME is unchanged: that is a `--replace`, which swaps the policy under running
# processes with no unload step and no restart. That asymmetry is why this gap stays invisible
# until a `local_*` profile is renamed or dropped from defaults/main.yml.)
#
# Same `apparmor_parser --remove` step the per-app neutralize tasks already use
# (tasks/chromium.yml). Deliberately NOT `aa-remove-unknown`: that unloads every loaded profile
# absent from /etc/apparmor.d/, which would rip out the Incus per-instance profiles under
# /var/lib/incus/security/apparmor/profiles/ (openSUSE Security Guide warns about exactly this -
# removal leaves a running instance unconfined, and Incus does not reload it until restart).
#
# Restricted to the top level of /etc/apparmor.d/: entries under abstractions/ declare no
# profile, so there is nothing to unload and `--remove` would just error on them.
- name: Unload orphaned `local_*` profiles from the kernel before deleting their files
  ansible.builtin.command:
    cmd: apparmor_parser --remove {{ item.path }}
  loop: "{{ apparmor__deployed_local.files }}"
  when:
    - item.path | basename not in apparmor__managed_local_basenames
    - item.path | dirname == '/etc/apparmor.d'
  become: true
  # Best-effort: the orphan may already be unloaded, or be too stale to parse. Matches the
  # `failed_when: false` on the per-app neutralize unload tasks.
  failed_when: false
  changed_when: false
  tags: apparmor

- name: Remove local_* files not managed by this role
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ apparmor__deployed_local.files }}"
  when: item.path | basename not in apparmor__managed_local_basenames
  become: true
  notify: Reload apparmor
  tags: apparmor

# =============================================
# Set mode (enforce / complain) on all managed profiles
# =============================================
# Run after all deploy tasks so apparmor_parser sees a consistent set of
# files. Enforcing mid-deploy risks parse failures when one profile
# references another that has not yet been updated (e.g. an include
# syntax change in a template).
#
# Single batched task: `aa-enforce file1 file2 ...` in one invocation
# instead of one task per profile. Previously this section spawned ~14
# individual `command:` tasks (each ~1.3s sudo+python+aa-enforce
# overhead, ~17s total); batched form is one invocation (~1s total).
#
# Tags include every per-app label so a partial run like
# `--tags chromium` still triggers the enforcement step. Side-effect:
# the partial run re-enforces every other profile too (aa-enforce on an
# already-enforced profile is functionally a no-op at the kernel level).

- name: Set mode (`aa-enforce` / `aa-complain` per `apparmor_profile_mode`) on all deployed `local_*` profiles (batched single invocation)
  ansible.builtin.command:
    argv: "{{ [_aa_mode_command] + _aa_mode_paths }}"
  vars:
    # `aa-complain` for the validation pass after an abi / mediation change, else `aa-enforce`.
    _aa_mode_command: "{{ 'aa-complain' if (apparmor_profile_mode | default('enforce')) == 'complain' else 'aa-enforce' }}"
    # Deliberately EXCLUDES apparmor_template_profile_names_own_flags_mode: `aa-enforce` /
    # `aa-complain` rewrite a profile's `flags=(...)` header, which would strip a deliberate
    # in-file flag - a `flags=(complain)` draft (silently promoted to enforce before it is tuned)
    # or a `flags=(default_allow)` profile (turned into default-deny, breaking the app). Those are
    # loaded as-is by the `Reload apparmor` handler and never mode-switched here. Do NOT add that
    # list to this path.
    _aa_mode_paths: >-
      {{ ((apparmor_static_profiles | map(attribute='dest') | list)
          + apparmor_template_profile_names)
         | map('regex_replace', '^', '/etc/apparmor.d/')
         | list }}
  become: true
  changed_when: false
  tags:
    - apparmor
    - firefox
    - chromium
    - msedge
    - telegram
    - vscode
    - mpv
    - stardict
    - gwenview
    - mcomix
    - okular
    - vlc
    - mscore3
    - mscore
    - anydesk
