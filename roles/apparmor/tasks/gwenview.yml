---
# =============================================
# Deploy AppArmor profile
# =============================================

- name: Write Gwenview AppArmor profile to /etc/apparmor.d/local_pathbased_gwenview
  ansible.builtin.template:
    src: gwenview/local_pathbased_gwenview.aa.j2
    dest: /etc/apparmor.d/local_pathbased_gwenview
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: gwenview

# =============================================
# Neutralize conflicting system Gwenview profiles
# =============================================

- name: Ensure /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/ directory exists
  ansible.builtin.file:
    path: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: gwenview

- name: Stat system Gwenview profiles in /etc/apparmor.d/
  ansible.builtin.stat:
    path: /etc/apparmor.d/{{ item }}
  loop:
    - gwenview
  register: apparmor__sys_gwenview_stat
  tags: gwenview

- name: Back up system Gwenview profiles to _backup_of_default_profiles_from_package_manager/
  ansible.builtin.copy:
    remote_src: true
    src: /etc/apparmor.d/{{ item.item }}
    dest: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item.item }}
    owner: root
    group: root
    mode: '0644'
  loop: "{{ apparmor__sys_gwenview_stat.results }}"
  when: item.stat.exists
  become: true
  tags: gwenview

- name: Remove system Gwenview profiles from /etc/apparmor.d/
  ansible.builtin.file:
    path: /etc/apparmor.d/{{ item.item }}
    state: absent
  loop: "{{ apparmor__sys_gwenview_stat.results }}"
  when: item.stat.exists
  become: true
  notify: Reload apparmor
  tags: gwenview

- name: Flush handlers to trigger AppArmor reload
  ansible.builtin.meta: flush_handlers
  tags: gwenview

- name: Remove system Gwenview profiles from kernel using backup files
  ansible.builtin.command:
    cmd: apparmor_parser -R /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item }}
  loop:
    - gwenview
  become: true
  failed_when: false
  changed_when: false
  tags: gwenview
