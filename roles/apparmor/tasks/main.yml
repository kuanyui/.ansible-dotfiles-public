---
# `python3-jsonschema` is a hard dep of the validator script invoked by
# common.yml's build step. Delegate install to the shared sub-role; it
# handles the openSUSE / Debian / RedHat split with ansible-core only
# (the `community.general.zypper` workaround).
#
# Skipped when `apparmor_non_interactive=true` because both pre-flights
# that set that var (`make apply-apparmor` script, `make sandbox-apparmor`
# `_pre_flight`) install jsonschema themselves before ansible starts -
# faster (no ansible startup + sub-role for a probe that always rc=0 on
# repeat runs) and avoids a second sudo prompt mid-playbook.
- name: Ensure `python3-jsonschema` (hard dep of `roles/apparmor/scripts/gen_customized_extra_dirs_aa_mixins.py`)
  ansible.builtin.include_role:
    name: _install_distro_packages
    apply:
      tags: apparmor
  vars:
    install_distro_packages:
      Debian:
        install: [python3-jsonschema]
        probe: 'python3 -c "import jsonschema"'
      Suse:
        install: [python3-jsonschema]
        probe: 'python3 -c "import jsonschema"'
      RedHat:
        install: [python3-jsonschema]
        probe: 'python3 -c "import jsonschema"'
  when:
    - not (apparmor_non_interactive | default(false) | bool)
  tags: apparmor

# Preview + confirm. Uses `ansible.builtin.pause` for BOTH display and the
# y/N prompt - `pause` writes its `prompt:` straight to /dev/tty (it has to,
# to read input), bypassing `debug`'s JSON-list formatting. The validator
# script renders a syntax-highlighted preview to stdout (path / category /
# `*` each get their own ANSI color); we register that stdout and feed it
# into the prompt below, so this flow and the sandbox `_pre_flight` show
# the same coloring (DRY - one preview implementation, two callers).
# `--color=always` forces ANSI on even though ansible captures stdout
# (i.e. no TTY); pause then writes the ANSI bytes to /dev/tty where they
# render. If validation fails, the script exits non-zero and the playbook
# aborts before this prompt is reached. Skipped in sandbox flow via the
# var below, because sandbox does its own preview in `_pre_flight` before
# podman starts.
- name: Schema-validate and render preview of `customized_extra_dirs.yml` via `--validate-only`
  ansible.builtin.command:
    cmd: python3 {{ role_path }}/scripts/gen_customized_extra_dirs_aa_mixins.py --validate-only --color=always
  register: _customized_extra_dirs_preview
  changed_when: false
  when:
    - not (apparmor_non_interactive | default(false) | bool)
  tags: apparmor

- name: Preview `customized_extra_dirs.yml` and confirm before applying
  ansible.builtin.pause:
    prompt: |
      {{ _customized_extra_dirs_preview.stdout }}

      Proceed with applying the AppArmor profiles? [y/N]
  register: _apparmor_confirm
  when:
    - not (apparmor_non_interactive | default(false) | bool)
  tags: apparmor

- name: Abort if user did not say yes
  ansible.builtin.fail:
    msg: Aborted by user (no `y` / `yes` at confirmation prompt).
  when:
    - not (apparmor_non_interactive | default(false) | bool)
    - (_apparmor_confirm.user_input | default('') | lower) not in ['y', 'yes']
  tags: apparmor

- ansible.builtin.include_tasks: _install.yml
