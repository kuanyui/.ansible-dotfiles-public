---
# =============================================
# Deploy AppArmor profile
# =============================================

- name: Write Chromium AppArmor profile to /etc/apparmor.d/local_pathbased_chromium
  ansible.builtin.template:
    src: chromium/local_pathbased_chromium.aa.j2
    dest: /etc/apparmor.d/local_pathbased_chromium
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: chromium

# =============================================
# Neutralize conflicting system Chromium profiles
# =============================================
# The system profiles 'chrome' and 'chromium' auto-attach to the Chromium binary
# and take priority over our glob-based attachment. Move them into
# _backup_of_default_profiles_from_package_manager/ so AppArmor does not scan them, while keeping
# the latest package version available for reference or restoration:
#   sudo cp /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/chrome /etc/apparmor.d/

- name: Ensure /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/ directory exists
  ansible.builtin.file:
    path: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: chromium

- name: Stat system Chromium profiles in /etc/apparmor.d/
  ansible.builtin.stat:
    path: /etc/apparmor.d/{{ item }}
  loop: "{{ apparmor_shadowed_system_profiles['chromium'] }}"
  register: apparmor__sys_chromium_stat
  tags: chromium

- name: Back up system Chromium profiles to _backup_of_default_profiles_from_package_manager/
  ansible.builtin.copy:
    remote_src: true
    src: /etc/apparmor.d/{{ item.item }}
    dest: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item.item }}
    owner: root
    group: root
    mode: '0644'
  loop: "{{ apparmor__sys_chromium_stat.results }}"
  when: item.stat.exists
  become: true
  tags: chromium

- name: Remove system Chromium profiles from /etc/apparmor.d/
  ansible.builtin.file:
    path: /etc/apparmor.d/{{ item.item }}
    state: absent
  loop: "{{ apparmor__sys_chromium_stat.results }}"
  when: item.stat.exists
  become: true
  notify: Reload apparmor
  tags: chromium

- name: Flush handlers to trigger AppArmor reload
  ansible.builtin.meta: flush_handlers
  tags: chromium

- name: Remove system Chromium profiles from kernel using backup files
  ansible.builtin.command:
    cmd: apparmor_parser -R /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item }}
  loop: "{{ apparmor_shadowed_system_profiles['chromium'] }}"
  become: true
  failed_when: false
  changed_when: false
  tags: chromium
