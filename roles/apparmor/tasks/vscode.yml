---
# =============================================
# Deploy AppArmor profile
# =============================================

- name: Write VS Code AppArmor profile to /etc/apparmor.d/local_pathbased_vscode
  ansible.builtin.template:
    src: vscode/local_pathbased_vscode.aa.j2
    dest: /etc/apparmor.d/local_pathbased_vscode
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: vscode

# =============================================
# Neutralize conflicting system VS Code profiles
# =============================================
# System profiles 'code' and 'vscode' auto-attach to the VS Code binary and take
# priority over our profile. Move them into _backup_of_default_profiles_from_package_manager/
# so AppArmor does not scan them, while keeping them available for reference or restoration:
#   sudo cp /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/code /etc/apparmor.d/

- name: Ensure /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/ directory exists
  ansible.builtin.file:
    path: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: vscode

- name: Stat system VS Code profiles in /etc/apparmor.d/
  ansible.builtin.stat:
    path: /etc/apparmor.d/{{ item }}
  loop:
    - code
    - vscode
  register: apparmor__sys_vscode_stat
  tags: vscode

- name: Back up system VS Code profiles to _backup_of_default_profiles_from_package_manager/
  ansible.builtin.copy:
    remote_src: true
    src: /etc/apparmor.d/{{ item.item }}
    dest: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item.item }}
    owner: root
    group: root
    mode: '0644'
  loop: "{{ apparmor__sys_vscode_stat.results }}"
  when: item.stat.exists
  become: true
  tags: vscode

- name: Remove system VS Code profiles from /etc/apparmor.d/
  ansible.builtin.file:
    path: /etc/apparmor.d/{{ item.item }}
    state: absent
  loop: "{{ apparmor__sys_vscode_stat.results }}"
  when: item.stat.exists
  become: true
  notify: Reload apparmor
  tags: vscode

- name: Flush handlers to trigger AppArmor reload
  ansible.builtin.meta: flush_handlers
  tags: vscode

- name: Remove system VS Code profiles from kernel using backup files
  ansible.builtin.command:
    cmd: apparmor_parser -R /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item }}
  loop:
    - code
    - vscode
  become: true
  failed_when: false
  changed_when: false
  tags: vscode
