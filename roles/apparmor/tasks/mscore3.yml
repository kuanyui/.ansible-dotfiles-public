---
# =============================================
# Deploy AppArmor profile
# =============================================

- name: Write MuseScore 3 AppArmor profile to /etc/apparmor.d/local_pathbased_mscore3
  ansible.builtin.template:
    src: mscore3/local_pathbased_mscore3.aa.j2
    dest: /etc/apparmor.d/local_pathbased_mscore3
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: mscore3

# =============================================
# Neutralize conflicting system MuseScore 3 profiles
# =============================================

- name: Ensure /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/ directory exists
  ansible.builtin.file:
    path: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: mscore3

- name: Stat system MuseScore 3 profiles in /etc/apparmor.d/
  ansible.builtin.stat:
    path: /etc/apparmor.d/{{ item }}
  loop:
    - mscore3
  register: apparmor__sys_mscore3_stat
  tags: mscore3

- name: Back up system MuseScore 3 profiles to _backup_of_default_profiles_from_package_manager/
  ansible.builtin.copy:
    remote_src: true
    src: /etc/apparmor.d/{{ item.item }}
    dest: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item.item }}
    owner: root
    group: root
    mode: '0644'
  loop: "{{ apparmor__sys_mscore3_stat.results }}"
  when: item.stat.exists
  become: true
  tags: mscore3

- name: Remove system MuseScore 3 profiles from /etc/apparmor.d/
  ansible.builtin.file:
    path: /etc/apparmor.d/{{ item.item }}
    state: absent
  loop: "{{ apparmor__sys_mscore3_stat.results }}"
  when: item.stat.exists
  become: true
  notify: Reload apparmor
  tags: mscore3

- name: Flush handlers to trigger AppArmor reload
  ansible.builtin.meta: flush_handlers
  tags: mscore3

- name: Remove system MuseScore 3 profiles from kernel using backup files
  ansible.builtin.command:
    cmd: apparmor_parser -R /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item }}
  loop:
    - mscore3
  become: true
  failed_when: false
  changed_when: false
  tags: mscore3
