---
# =============================================
# Deploy AppArmor profile
# =============================================

- name: Write StarDict AppArmor profile to /etc/apparmor.d/local_pathbased_stardict
  ansible.builtin.template:
    src: stardict/local_pathbased_stardict.aa.j2
    dest: /etc/apparmor.d/local_pathbased_stardict
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: stardict

# =============================================
# Neutralize conflicting system StarDict profiles
# =============================================

- name: Ensure /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/ directory exists
  ansible.builtin.file:
    path: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: stardict

- name: Stat system StarDict profiles in /etc/apparmor.d/
  ansible.builtin.stat:
    path: /etc/apparmor.d/{{ item }}
  loop:
    - stardict
  register: apparmor__sys_stardict_stat
  tags: stardict

- name: Back up system StarDict profiles to _backup_of_default_profiles_from_package_manager/
  ansible.builtin.copy:
    remote_src: true
    src: /etc/apparmor.d/{{ item.item }}
    dest: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item.item }}
    owner: root
    group: root
    mode: '0644'
  loop: "{{ apparmor__sys_stardict_stat.results }}"
  when: item.stat.exists
  become: true
  tags: stardict

- name: Remove system StarDict profiles from /etc/apparmor.d/
  ansible.builtin.file:
    path: /etc/apparmor.d/{{ item.item }}
    state: absent
  loop: "{{ apparmor__sys_stardict_stat.results }}"
  when: item.stat.exists
  become: true
  notify: Reload apparmor
  tags: stardict

- name: Flush handlers to trigger AppArmor reload
  ansible.builtin.meta: flush_handlers
  tags: stardict

- name: Remove system StarDict profiles from kernel using backup files
  ansible.builtin.command:
    cmd: apparmor_parser -R /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item }}
  loop:
    - stardict
  become: true
  failed_when: false
  changed_when: false
  tags: stardict
