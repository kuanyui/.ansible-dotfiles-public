---
# =============================================
# Deploy AppArmor profile
# =============================================

- name: Write AnyDesk AppArmor profile to /etc/apparmor.d/local_pathbased_anydesk
  ansible.builtin.template:
    src: anydesk/local_pathbased_anydesk.aa.j2
    dest: /etc/apparmor.d/local_pathbased_anydesk
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: anydesk

# =============================================
# Neutralize conflicting system AnyDesk profiles
# =============================================

- name: Ensure /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/ directory exists
  ansible.builtin.file:
    path: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: anydesk

- name: Stat system AnyDesk profiles in /etc/apparmor.d/
  ansible.builtin.stat:
    path: /etc/apparmor.d/{{ item }}
  loop:
    - anydesk
    - usr.bin.anydesk
    - usr.local.bin.anydesk
  register: apparmor__sys_anydesk_stat
  tags: anydesk

- name: Back up system AnyDesk profiles to _backup_of_default_profiles_from_package_manager/
  ansible.builtin.copy:
    remote_src: true
    src: /etc/apparmor.d/{{ item.item }}
    dest: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item.item }}
    owner: root
    group: root
    mode: '0644'
  loop: "{{ apparmor__sys_anydesk_stat.results }}"
  when: item.stat.exists
  become: true
  tags: anydesk

- name: Remove system AnyDesk profiles from /etc/apparmor.d/
  ansible.builtin.file:
    path: /etc/apparmor.d/{{ item.item }}
    state: absent
  loop: "{{ apparmor__sys_anydesk_stat.results }}"
  when: item.stat.exists
  become: true
  notify: Reload apparmor
  tags: anydesk

- name: Flush handlers to trigger AppArmor reload
  ansible.builtin.meta: flush_handlers
  tags: anydesk

- name: Remove system AnyDesk profiles from kernel using backup files
  ansible.builtin.command:
    cmd: apparmor_parser -R /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item }}
  loop:
    - anydesk
    - usr.bin.anydesk
    - usr.local.bin.anydesk
  become: true
  failed_when: false
  changed_when: false
  tags: anydesk
