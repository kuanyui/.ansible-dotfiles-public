---
# =============================================
# Read XDG user directories
# =============================================
# Reads ~/.config/user-dirs.dirs to extract XDG_DOWNLOAD_DIR.
# AppArmor resolves symlinks at policy check time, so allowing the real path
# (what XDG_DOWNLOAD_DIR points to) is sufficient even if a translated name
# symlinks to it or vice versa.

- name: Read XDG user dirs config for {{ apparmor_target_user }}
  ansible.builtin.slurp:
    src: "/home/{{ apparmor_target_user }}/.config/user-dirs.dirs"
  register: apparmor__xdg_user_dirs
  failed_when: false
  tags: apparmor

- name: Set apparmor_xdg_download_subdir from user-dirs.dirs
  ansible.builtin.set_fact:
    apparmor_xdg_download_subdir: "{{ _match | first }}"
  vars:
    _content: "{{ apparmor__xdg_user_dirs.content | b64decode }}"
    _match: "{{ _content | regex_search('XDG_DOWNLOAD_DIR=\"\\$HOME/([^\"]+)\"', '\\1') }}"
  when:
    - apparmor__xdg_user_dirs.content is defined
    - _match is not none
    - _match | length > 0
  tags: apparmor

- name: Set apparmor_xdg_pictures_subdir from user-dirs.dirs
  ansible.builtin.set_fact:
    apparmor_xdg_pictures_subdir: "{{ _match | first }}"
  vars:
    _content: "{{ apparmor__xdg_user_dirs.content | b64decode }}"
    _match: "{{ _content | regex_search('XDG_PICTURES_DIR=\"\\$HOME/([^\"]+)\"', '\\1') }}"
  when:
    - apparmor__xdg_user_dirs.content is defined
    - _match is not none
    - _match | length > 0
  tags: apparmor

- name: Stat XDG Pictures/Screenshots directory
  ansible.builtin.stat:
    path: "/home/{{ apparmor_target_user }}/{{ apparmor_xdg_pictures_subdir }}/Screenshots"
  register: apparmor__xdg_screenshots_stat
  tags: apparmor

- name: Set apparmor_xdg_screenshots_exists fact
  ansible.builtin.set_fact:
    apparmor_xdg_screenshots_exists: "{{ apparmor__xdg_screenshots_stat.stat.exists | default(false) }}"
  tags: apparmor

# =============================================
# Deploy shared mixin abstractions (template-rendered)
# =============================================

- name: Write screenshots mixin to /etc/apparmor.d/abstractions/local_mixin_xdg_dir_pictures_screenshots
  ansible.builtin.template:
    src: local_mixin_xdg_dir_pictures_screenshots.aa.j2
    dest: /etc/apparmor.d/abstractions/local_mixin_xdg_dir_pictures_screenshots
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: apparmor

- name: Write XDG downloads mixin to /etc/apparmor.d/abstractions/local_mixin_xdg_dir_downloads
  ansible.builtin.template:
    src: local_mixin_xdg_dir_downloads.aa.j2
    dest: /etc/apparmor.d/abstractions/local_mixin_xdg_dir_downloads
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: apparmor

# =============================================
# DEPRECATED: legacy single-mixin personal_dirs (in-flight migration only)
# =============================================
# These tasks still deploy /etc/apparmor.d/abstractions/local_mixin_deny_personal_dirs
# for profiles that have NOT yet been switched to the per-category includes
# (local_mixin_personal_dirs__for__<category>). Remove this block once every
# pathbased profile has migrated.

- name: Check that `{{ role_path }}/local_vars/deny_personal_dirs.aa` exists (DEPRECATED)
  ansible.builtin.stat:
    path: "{{ role_path }}/local_vars/deny_personal_dirs.aa"
  register: _deny_personal_dirs_stat
  tags: apparmor

- name: Fail with instructions if `{{ role_path }}/local_vars/deny_personal_dirs.aa` is missing (DEPRECATED)
  ansible.builtin.fail:
    msg: >-
      {{ role_path }}/local_vars/deny_personal_dirs.aa not found.
      Run roles/apparmor/scripts/_gen_deny_personal_dirs.py first to generate it.
  when: not _deny_personal_dirs_stat.stat.exists
  tags: apparmor

- name: Write personal dirs deny mixin to /etc/apparmor.d/abstractions/local_mixin_deny_personal_dirs (DEPRECATED)
  ansible.builtin.template:
    src: local_mixin_deny_personal_dirs.aa.j2
    dest: /etc/apparmor.d/abstractions/local_mixin_deny_personal_dirs
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: apparmor

# =============================================
# Per-category personal_dirs abstractions
# =============================================
# Replacement for the deprecated single-mixin above. Source of truth is
# `{{ role_path }}/local_vars/personal_dirs.yml` (gitignored, generated by
# roles/apparmor/scripts/gen_personal_dirs_definitions_yaml.py and then user-edited).
# roles/apparmor/scripts/gen_personal_dirs_aa_mixins.py validates the YAML against a
# JSON Schema and writes one file per category into
# `{{ role_path }}/local_vars/generated_abstractions/`, which is then copied
# into `/etc/apparmor.d/abstractions/`.

# `python3-jsonschema` install is handled earlier in main.yml via the
# `_install_distro_packages` sub-role (probe + distro-aware install). By the
# time this builder runs, jsonschema is guaranteed present.

- name: Stat `{{ role_path }}/local_vars/personal_dirs.yml`
  ansible.builtin.stat:
    path: "{{ role_path }}/local_vars/personal_dirs.yml"
  register: _personal_dirs_yml_stat
  tags: apparmor

- name: Fail with instructions if `{{ role_path }}/local_vars/personal_dirs.yml` is missing
  ansible.builtin.fail:
    msg: >-
      {{ role_path }}/local_vars/personal_dirs.yml not found.
      Run roles/apparmor/scripts/gen_personal_dirs_definitions_yaml.py first to generate it.
  when: not _personal_dirs_yml_stat.stat.exists
  tags: apparmor

- name: Build per-category personal_dirs abstractions via `roles/apparmor/scripts/gen_personal_dirs_aa_mixins.py`
  ansible.builtin.command:
    cmd: >-
      python3 {{ role_path }}/scripts/gen_personal_dirs_aa_mixins.py
      --in {{ role_path }}/local_vars/personal_dirs.yml
      --categories {{ role_path }}/app_categories.yml
      --out {{ role_path }}/local_vars/generated_abstractions
  changed_when: false
  tags: apparmor

- name: Find generated `local_mixin_personal_dirs__for__*` files in `{{ role_path }}/local_vars/generated_abstractions/`
  ansible.builtin.find:
    paths: "{{ role_path }}/local_vars/generated_abstractions"
    patterns: "local_mixin_personal_dirs__for__*"
  register: _personal_dirs_generated
  tags: apparmor

- name: Deploy each `local_mixin_personal_dirs__for__<category>` to `/etc/apparmor.d/abstractions/`
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/etc/apparmor.d/abstractions/{{ item.path | basename }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ _personal_dirs_generated.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  become: true
  notify: Reload apparmor
  tags: apparmor

- name: Write mpv base mixin to /etc/apparmor.d/abstractions/local_base_mpv
  ansible.builtin.template:
    src: mpv/local_base_mpv.aa.j2
    dest: /etc/apparmor.d/abstractions/local_base_mpv
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: apparmor
