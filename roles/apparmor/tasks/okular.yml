---
# =============================================
# Deploy AppArmor profile
# =============================================

- name: Write Okular AppArmor profile to /etc/apparmor.d/local_pathbased_okular
  ansible.builtin.template:
    src: okular/local_pathbased_okular.aa.j2
    dest: /etc/apparmor.d/local_pathbased_okular
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: okular

# =============================================
# Neutralize conflicting system Okular profiles
# =============================================

- name: Ensure /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/ directory exists
  ansible.builtin.file:
    path: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: okular

- name: Stat system Okular profiles in /etc/apparmor.d/
  ansible.builtin.stat:
    path: /etc/apparmor.d/{{ item }}
  loop:
    - okular
    - usr.bin.okular
  register: apparmor__sys_okular_stat
  tags: okular

- name: Back up system Okular profiles to _backup_of_default_profiles_from_package_manager/
  ansible.builtin.copy:
    remote_src: true
    src: /etc/apparmor.d/{{ item.item }}
    dest: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item.item }}
    owner: root
    group: root
    mode: '0644'
  loop: "{{ apparmor__sys_okular_stat.results }}"
  when: item.stat.exists
  become: true
  tags: okular

- name: Remove system Okular profiles from /etc/apparmor.d/
  ansible.builtin.file:
    path: /etc/apparmor.d/{{ item.item }}
    state: absent
  loop: "{{ apparmor__sys_okular_stat.results }}"
  when: item.stat.exists
  become: true
  notify: Reload apparmor
  tags: okular

- name: Flush handlers to trigger AppArmor reload
  ansible.builtin.meta: flush_handlers
  tags: okular

- name: Remove system Okular profiles from kernel using backup files
  ansible.builtin.command:
    cmd: apparmor_parser -R /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item }}
  loop:
    - okular
    - usr.bin.okular
  become: true
  failed_when: false
  changed_when: false
  tags: okular
