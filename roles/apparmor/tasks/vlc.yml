---
# =============================================
# Deploy AppArmor profile
# =============================================

- name: Write VLC AppArmor profile to /etc/apparmor.d/local_pathbased_vlc
  ansible.builtin.template:
    src: vlc/local_pathbased_vlc.aa.j2
    dest: /etc/apparmor.d/local_pathbased_vlc
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: vlc

# =============================================
# Neutralize conflicting system VLC profiles
# =============================================

- name: Ensure /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/ directory exists
  ansible.builtin.file:
    path: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: vlc

- name: Stat system VLC profiles in /etc/apparmor.d/
  ansible.builtin.stat:
    path: /etc/apparmor.d/{{ item }}
  loop:
    - vlc
    - usr.bin.vlc
  register: apparmor__sys_vlc_stat
  tags: vlc

- name: Back up system VLC profiles to _backup_of_default_profiles_from_package_manager/
  ansible.builtin.copy:
    remote_src: true
    src: /etc/apparmor.d/{{ item.item }}
    dest: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item.item }}
    owner: root
    group: root
    mode: '0644'
  loop: "{{ apparmor__sys_vlc_stat.results }}"
  when: item.stat.exists
  become: true
  tags: vlc

- name: Remove system VLC profiles from /etc/apparmor.d/
  ansible.builtin.file:
    path: /etc/apparmor.d/{{ item.item }}
    state: absent
  loop: "{{ apparmor__sys_vlc_stat.results }}"
  when: item.stat.exists
  become: true
  notify: Reload apparmor
  tags: vlc

- name: Flush handlers to trigger AppArmor reload
  ansible.builtin.meta: flush_handlers
  tags: vlc

- name: Remove system VLC profiles from kernel using backup files
  ansible.builtin.command:
    cmd: apparmor_parser -R /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item }}
  loop:
    - vlc
    - usr.bin.vlc
  become: true
  failed_when: false
  changed_when: false
  tags: vlc
