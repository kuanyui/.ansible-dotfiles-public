---
# =============================================
# Deploy AppArmor profile
# =============================================
# COMPLAIN-MODE DRAFT: the template ships `flags=(complain)` and `local_pathbased_handy` is
# registered in `apparmor_template_profile_names_own_flags_mode` (defaults/main.yml), so the
# batched aa-enforce step in _install.yml never rewrites its header. Promotion: TODO.md.

- name: Write Handy AppArmor profile (complain-mode draft) to /etc/apparmor.d/local_pathbased_handy
  ansible.builtin.template:
    src: handy/local_pathbased_handy.aa.j2
    dest: /etc/apparmor.d/local_pathbased_handy
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: handy

# =============================================
# Neutralize conflicting system Handy profiles
# =============================================
# Neither upstream (the Tauri-built .rpm / .deb carries no maintainer scripts, let alone a
# profile) nor any distro ships a Handy AppArmor profile today; the names in
# `apparmor_shadowed_system_profiles['handy']` are the packaged spellings (`handy`,
# path-convention `usr.bin.handy`) so a future one cannot silently take attachment priority
# over our profile on the same /usr/bin/handy. Moved into
# _backup_of_default_profiles_from_package_manager/ so AppArmor does not scan them, while
# keeping them available for reference or restoration:
#   sudo cp /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/handy /etc/apparmor.d/

- name: Ensure /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/ directory exists
  ansible.builtin.file:
    path: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: handy

- name: Stat system Handy profiles in /etc/apparmor.d/
  ansible.builtin.stat:
    path: /etc/apparmor.d/{{ item }}
  loop: "{{ apparmor_shadowed_system_profiles['handy'] }}"
  register: apparmor__sys_handy_stat
  tags: handy

- name: Back up system Handy profiles to _backup_of_default_profiles_from_package_manager/
  ansible.builtin.copy:
    remote_src: true
    src: /etc/apparmor.d/{{ item.item }}
    dest: /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item.item }}
    owner: root
    group: root
    mode: '0644'
  loop: "{{ apparmor__sys_handy_stat.results }}"
  when: item.stat.exists
  become: true
  tags: handy

- name: Remove system Handy profiles from /etc/apparmor.d/
  ansible.builtin.file:
    path: /etc/apparmor.d/{{ item.item }}
    state: absent
  loop: "{{ apparmor__sys_handy_stat.results }}"
  when: item.stat.exists
  become: true
  notify: Reload apparmor
  tags: handy

- name: Flush handlers to trigger AppArmor reload
  ansible.builtin.meta: flush_handlers
  tags: handy

- name: Remove system Handy profiles from kernel using backup files
  ansible.builtin.command:
    cmd: apparmor_parser -R /etc/apparmor.d/_backup_of_default_profiles_from_package_manager/{{ item }}
  loop: "{{ apparmor_shadowed_system_profiles['handy'] }}"
  become: true
  failed_when: false
  changed_when: false
  tags: handy
