---
# =============================================
# Pre-flight checks
# =============================================

- name: Assert that neither the runner nor target_user is root
  ansible.builtin.assert:
    that:
      - ansible_facts['user_id'] != 'root'
      - apparmor_target_user != 'root'
    fail_msg: "Do not run as root. Set apparmor_target_user in host_vars if your login user differs."
  tags: firefox

- name: Stat Firefox profile base directory
  ansible.builtin.stat:
    path: "{{ apparmor_firefox_base_path }}"
  register: apparmor__ff_dir
  tags: firefox

- name: Abort if Firefox profile base directory not found
  ansible.builtin.fail:
    msg: "Firefox profile directory not found: {{ apparmor_firefox_base_path }}"
  when: not apparmor__ff_dir.stat.exists
  tags: firefox

# =============================================
# Read profiles.ini
# =============================================
# Two-step parse: grep finds which [ProfileN] sections actually exist (handles gaps in
# numbering), then ansible.builtin.ini reads Name/Path from each confirmed section.
# ansible.builtin.ini raises an error for missing sections, so we must not query sections
# blindly -- only those grep confirmed. Sections without Name or Path are skipped by when.
# configparser lowercases option names, so 'Name=' is read as 'name', 'Path=' as 'path'.
#
# Final order (drives the launcher's list order): the profiles designated by an
# [Install<HASH>] section first, then everything else, each group by its [ProfileN] number.
# [Install<HASH>] is Firefox's profile-per-install marker - HASH is a hex hash of the
# installation directory, NOT a number - and the section carries no Name/Path of its own,
# only `Default=<profile path>` naming which profile that installation launches by default.
# So "install first" means: the profile its `Default=` points at leads the list.

- name: Initialize apparmor_firefox_profiles and apparmor_firefox_install_default_dirs to empty lists
  ansible.builtin.set_fact:
    apparmor_firefox_profiles: []
    apparmor_firefox_install_default_dirs: []
  tags: firefox

- name: Find all [Install<HASH>] section headers in profiles.ini
  ansible.builtin.command:
    cmd: grep -E '^\[Install[0-9A-Fa-f]+\]' {{ apparmor_firefox_base_path }}/profiles.ini
  register: apparmor__raw_install_sections
  changed_when: false
  check_mode: false
  # grep exits 1 when nothing matches. Unlike [ProfileN], having no [Install<HASH>] section is
  # normal (older profiles.ini predating profile-per-install), so an empty result is not an error.
  failed_when: false
  tags: firefox

- name: Collect the `Default=` profile path of each [Install<HASH>] section
  ansible.builtin.set_fact:
    apparmor_firefox_install_default_dirs: "{{ apparmor_firefox_install_default_dirs + [_install_default_dir] }}"
  vars:
    _section: "{{ item | regex_replace('^\\[(.+)\\]$', '\\1') }}"
    _install_default_dir: "{{ lookup('ansible.builtin.ini', 'default', section=_section, file=apparmor_firefox_base_path ~ '/profiles.ini', default='') }}"
  loop: "{{ apparmor__raw_install_sections.stdout_lines }}"
  when: _install_default_dir != ''
  tags: firefox

- name: Find all [ProfileN] section headers in profiles.ini
  ansible.builtin.command:
    cmd: grep -E '^\[Profile[0-9]+\]' {{ apparmor_firefox_base_path }}/profiles.ini
  register: apparmor__raw_profile_sections
  changed_when: false
  check_mode: false
  tags: firefox

- name: Build apparmor_firefox_profiles list from profiles.ini
  ansible.builtin.set_fact:
    apparmor_firefox_profiles: "{{ apparmor_firefox_profiles | default([]) + [{'label_name': _label, 'dir_name': _dir, 'section_sort_key': _section_sort_key}] }}"
  vars:
    _section: "{{ item | regex_replace('^\\[(.+)\\]$', '\\1') }}"
    _label: "{{ lookup('ansible.builtin.ini', 'name', section=_section, file=apparmor_firefox_base_path ~ '/profiles.ini', default='') }}"
    _dir: "{{ lookup('ansible.builtin.ini', 'path', section=_section, file=apparmor_firefox_base_path ~ '/profiles.ini', default='') }}"
    # Zero-padded on purpose. Jinja's `sort` is lexicographic and a templated dict value is a
    # string, so a bare "10" would sort before "2". Padding makes lexicographic == numeric.
    _section_sort_key: "{{ '%04d' | format(item | regex_replace('^\\[Profile([0-9]+)\\]$', '\\1') | int) }}"
  loop: "{{ apparmor__raw_profile_sections.stdout_lines }}"
  when: _label != '' and _dir != ''
  tags: firefox

- name: Sort apparmor_firefox_profiles - [Install<HASH>] defaults first, then by [ProfileN] number
  ansible.builtin.set_fact:
    apparmor_firefox_profiles: "{{ (_install_default_profiles | sort(attribute='section_sort_key'))
                                   + (_remaining_profiles | sort(attribute='section_sort_key')) }}"
  vars:
    _install_default_profiles: "{{ apparmor_firefox_profiles | selectattr('dir_name', 'in', apparmor_firefox_install_default_dirs) | list }}"
    _remaining_profiles: "{{ apparmor_firefox_profiles | rejectattr('dir_name', 'in', apparmor_firefox_install_default_dirs) | list }}"
  tags: firefox

# =============================================
# Deploy AppArmor profile
# =============================================

- name: Write shared Firefox AppArmor rules to /etc/apparmor.d/abstractions/local_base_firefox
  ansible.builtin.template:
    src: firefox/local_base_firefox.aa.j2
    dest: /etc/apparmor.d/abstractions/local_base_firefox
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: firefox

- name: Write all per-profile Firefox AppArmor rules to /etc/apparmor.d/local_attachmentless_firefox
  ansible.builtin.template:
    src: firefox/local_attachmentless_firefox.aa.j2
    dest: /etc/apparmor.d/local_attachmentless_firefox
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload apparmor
  tags: firefox


# =============================================
# Deploy the touch-friendly profile launcher
# =============================================
# One launcher replaces the former one-.desktop-per-Firefox-profile layout: with ~10 profiles
# those entries flooded both the application menu and KRunner, and a right-click Desktop Action
# submenu is a long-press on a touchscreen. See templates/firefox/aa-firefox-launcher.j2.

- name: Resolve home-relative launcher paths for {{ apparmor_target_user }}
  ansible.builtin.set_fact:
    _aa_firefox_launcher_dir: "/home/{{ apparmor_target_user }}/.local/bin"
    _aa_firefox_launcher: "/home/{{ apparmor_target_user }}/.local/bin/aa-firefox-launcher"
  tags: firefox

- name: Create directory {{ _aa_firefox_launcher_dir }}
  ansible.builtin.file:
    path: "{{ _aa_firefox_launcher_dir }}"
    state: directory
    owner: "{{ apparmor_target_user }}"
    mode: '0755'
  become: true
  tags: firefox

- name: Write the Firefox profile launcher to {{ _aa_firefox_launcher }}
  ansible.builtin.template:
    src: firefox/aa-firefox-launcher.j2
    dest: "{{ _aa_firefox_launcher }}"
    owner: "{{ apparmor_target_user }}"
    mode: '0755'
    # Fail loud at deploy time if the rendered Python is syntactically broken.
    validate: python3 -m py_compile %s
  become: true
  tags: firefox


# =============================================
# Deploy .desktop launcher
# =============================================

- name: Create directory ~/.local/share/applications for {{ apparmor_target_user }}
  ansible.builtin.file:
    path: "/home/{{ apparmor_target_user }}/.local/share/applications"
    state: directory
    owner: "{{ apparmor_target_user }}"
    mode: '0755'
  become: true
  tags: firefox

- name: Remove stale desktop launchers superseded by ansible_aa_firefox_* rename
  ansible.builtin.find:
    paths: "/home/{{ apparmor_target_user }}/.local/share/applications"
    patterns:
      - "aa-firefox-*.desktop"
      - "ansible_firefox_*.desktop"
  register: apparmor__stale_desktops
  tags: firefox

- name: Delete stale desktop launchers
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ apparmor__stale_desktops.files }}"
  tags: firefox

- name: Write the single ansible_aa_firefox.desktop entry (its `Exec` runs {{ _aa_firefox_launcher }})
  ansible.builtin.template:
    src: firefox/ansible_aa_firefox.desktop.j2
    dest: "/home/{{ apparmor_target_user }}/.local/share/applications/ansible_aa_firefox.desktop"
    owner: "{{ apparmor_target_user }}"
    mode: '0644'
  become: true
  tags: firefox

# The per-profile launchers an earlier version of this role deployed
# (ansible_aa_firefox_isolated_<label>.desktop + ansible_aa_firefox_all_profiles.desktop) are
# all superseded by the single ansible_aa_firefox.desktop above. Everything the glob matches is
# deprecated, so no allowlist is needed - the trailing `_` in the pattern is what keeps the
# surviving `ansible_aa_firefox.desktop` (no underscore) out of the match.

- name: "[IDEMPOTENCE] Enumerate deprecated per-profile ansible_aa_firefox_*.desktop launchers"
  ansible.builtin.find:
    paths: "/home/{{ apparmor_target_user }}/.local/share/applications"
    patterns: "ansible_aa_firefox_*.desktop"
  register: apparmor__existing_desktops
  tags: firefox

- name: "[IDEMPOTENCE] Remove deprecated file ~/.local/share/applications/ansible_aa_firefox_*.desktop"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  become: true
  loop: "{{ apparmor__existing_desktops.files }}"
  tags: firefox
