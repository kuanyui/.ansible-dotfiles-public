---
# =============================================
# Deploy the aaa-rpmnew post-update reconciler
# =============================================
# aaa-rpmnew reconciles /etc/apparmor.d/ after a distro package update: it adopts vendor
# `.rpmnew` updates for profiles we do not manage, and re-neutralizes distro profiles that a
# `local_*` profile shadows (list baked in from `apparmor_shadowed_system_profiles`), then
# reloads AppArmor once. Named `aaa-` (three a's) on purpose, to sort clear of the built-in
# `aa-*` tools (aa-status / aa-complain / aa-logprof / ...) and not be mistaken for one.
# See roles/apparmor/docs/RPMNEW_STALE_DISTRO_PROFILES.md.

- name: Deploy the aaa-rpmnew helper to /usr/local/sbin/aaa-rpmnew
  ansible.builtin.template:
    src: aaa-rpmnew.py.j2
    dest: /usr/local/sbin/aaa-rpmnew
    owner: root
    group: root
    mode: '0755'
    # Fail loud at deploy time if the rendered Python is syntactically broken,
    # rather than at first run on the host.
    validate: python3 -m py_compile %s
  become: true
  tags: [apparmor, rpmnew]
