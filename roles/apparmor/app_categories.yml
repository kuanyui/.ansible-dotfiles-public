# =============================================
# App categories - source of truth
# =============================================
# Categories used in roles/apparmor/local_vars/personal_dirs.yml `allow` lists,
# and to name the abstractions generated by
# roles/apparmor/scripts/gen_personal_dirs_aa_mixins.py:
#   /etc/apparmor.d/abstractions/local_mixin_personal_dirs__for__<category>
#
# Every pathbased profile must `#include` exactly one of these abstractions.
# Apps that do not fit a specific category use `others`.
#
# In personal_dirs.yml, `allow: ["*"]` is a reserved sentinel meaning "every
# abstraction allows this path". It is NOT listed here.
#
# Each category has:
#   name         identifier used in YAML, profile #include names, etc.
#   description  shown by IDE hover/autocomplete via the generated JSON Schema.
#                Required (schema enforces it). Write multi-line with `|`.

categories:
  - name: web_browser
    description: |
      e.g. Firefox, Chromium, Microsoft Edge.

      Note: modern web browsers rely on user-namespace capabilities for their
      own renderer sandbox. AppArmor confinement here is a second layer on top
      of that, not a replacement. Be deliberate about what you allow - a
      browser CAN reach paths it should not, e.g. via a malicious extension
      or a download from a compromised site.

  - name: image_viewer
    description: |
      e.g. Gwenview, gThumb, feh, MComix.

      Includes comic readers (CBZ / CBR), which are just zipped image bundles.

  - name: pdf_viewer
    description: |
      e.g. Okular, Evince, MuPDF.

      PDF parsers are a historical attack surface (font / JS / embedded media
      handlers). Limit access to directories that actually contain PDFs.

  - name: video_player
    description: |
      e.g. mpv, VLC.

      Includes any app whose primary purpose is rendering audio / video
      streams from local files.

  - name: ide
    description: |
      e.g. Visual Studio Code, JetBrains, Sublime Text.

      IDEs typically need broad read/write access to one or more project
      trees. They also run arbitrary code from extensions and from the
      project itself (test runners, build tools), so the threat model is
      closer to "trusted dev shell" than "sandboxed viewer".

  - name: music_score_editor
    description: |
      e.g. MuseScore.

      Sheet-music notation apps that read and write proprietary scores plus
      import / export PDF and audio. Treated separately from `pdf_viewer`
      because the write surface is wider.

  - name: others
    description: |
      Catch-all for apps that do not fit a specific category above.

      Examples: IM clients (Telegram), dictionaries (StarDict), remote
      desktop (AnyDesk). Use sparingly - if several profiles end up here
      and share an access pattern, that pattern probably deserves its own
      named category.
