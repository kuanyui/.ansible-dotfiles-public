---
# Producer of the SHARED, regenerable provision-asset cache that every provisioning
# backend consumes: `ivm` guests (now), `qvm` guests + `pvm` images (later). The host
# itself reads the registry VARS directly (no JSON); the non-ansible consumers have no
# ansible at provision time, so this role snapshots the registries to JSON + stages the
# dotfiles ONCE, host-side, into a shared dir they all read.
#
# Internal `_`-role: `include_role`-only (no playbook / Makefile target). Output lives
# under `_shared_prebuilt_provision_assets_dir`:
#   distro-package-groups.json   `provision_distro_packages_*` registry, serialized
#   thirdparty-software.json     `provision_thirdparty_software_*` registry, serialized
#   dotfiles/<feature>/{__common__,Debian,Suse,RedHat}/{home/user,root}/  feature-first
#
# Single source of truth stays the registry files in `roles/provision/defaults/main/`;
# each JSON is that file's registry dict serialized VERBATIM - every entry ships,
# including its `available_on` (if any). Per-consumer visibility is enforced by the
# CONSUMERS: each launcher's registry loader (and its shell completions) drops entries
# whose `available_on` excludes it. No hand-maintained key list here - adding a bundle /
# recipe to the registry file is the whole job.

- name: Ensure the shared asset dir `{{ _shared_prebuilt_provision_assets_dir }}` exists
  ansible.builtin.file:
    path: "{{ _shared_prebuilt_provision_assets_dir }}"
    state: directory
    mode: "0755"

# ---------- Serialize the provision_distro_packages registry ----------
- name: Load the `provision_distro_packages` bundle registry (sibling `roles/provision` defaults)
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../provision/defaults/main/distro_packages.yml"

- name: Render `provision_distro_packages` to `{{ _shared_prebuilt_provision_assets_dir }}/distro-package-groups.json`
  ansible.builtin.copy:
    dest: "{{ _shared_prebuilt_provision_assets_dir }}/distro-package-groups.json"
    mode: "0644"
    content: "{{ provision_distro_packages | to_nice_json }}"

# ---------- Serialize the provision_thirdparty_software registry ----------
- name: Load the `provision_thirdparty_software` recipe registry (sibling `roles/provision` defaults)
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../provision/defaults/main/thirdparty_software.yml"

- name: Render `provision_thirdparty_software` to `{{ _shared_prebuilt_provision_assets_dir }}/thirdparty-software.json`
  ansible.builtin.copy:
    dest: "{{ _shared_prebuilt_provision_assets_dir }}/thirdparty-software.json"
    mode: "0644"
    content: "{{ provision_thirdparty_software | to_nice_json }}"

# ---------- Stage the feature-first dotfiles tree ----------
- name: Stage the feature-first dotfiles tree (tasks/stage_dotfiles.yml)
  ansible.builtin.include_tasks: stage_dotfiles.yml
