---
- name: Skip `incus_agents` role unless `setup_incus_agents` is true
  ansible.builtin.debug:
    msg: "Skipping incus_agents (setup_incus_agents={{ setup_incus_agents | default(false) }})."
  when: not setup_incus_agents | default(false) | bool

- when: setup_incus_agents | default(false) | bool
  block:
    - name: Validate `incus_apps_state` is `present` or `absent`
      ansible.builtin.assert:
        that: incus_apps_state in ['present', 'absent']
        fail_msg: "incus_apps_state must be `present` or `absent`, got `{{ incus_apps_state }}`."

    - name: Validate each `incus_apps` entry has exactly one install method
      ansible.builtin.assert:
        that:
          # Exactly one of `install_script_url` / `install_via_npm` must be set.
          - (item.agent.install_script_url is defined) != (item.agent.install_via_npm is defined)
          - item.agent.command is defined
          - item.agent.display_name is defined
          - item.name is defined
          # `item.name` is the launcher name `v-<name>` (templates/v-launcher.sh.j2).
          # The per-agent subcommand was removed (run the agent via `shell`), so
          # `name` is NOT a dispatch token anymore; this list is now a defensive
          # naming guard so a name never matches a built-in subcommand.
          - item.name not in ['help', 'env', 'init', 'overwrite-dotfiles', 'start', 'stop', 'shell', 'shell-user', 'shell-root', 'set-root-password', 'unset-root-password', 'delete']
        fail_msg: |
          incus_apps entry `{{ item.name | default('<unnamed>') }}` is malformed.
          Required fields: name, agent.command, agent.display_name, AND exactly
          one of agent.install_script_url / agent.install_via_npm.
          `name` also must not be a reserved launcher subcommand: help, env, init,
          overwrite-dotfiles, start, stop, shell, shell-user, shell-root,
          set-root-password, unset-root-password, delete (would be shadowed).
          Got: {{ item }}
      loop: "{{ incus_apps }}"
      loop_control:
        label: "{{ item.name | default('<unnamed>') }}"

    - name: Run shared host-level prep (apt install incus + guestfs-tools, preseed init, group add) via `roles/_incus_host_setup`
      ansible.builtin.include_role:
        name: _incus_host_setup
      when:
        - incus_apps_state == 'present'
        - not (incus_agents_skip_host_setup | default(false) | bool)

    - ansible.builtin.include_tasks: install.yml
      when: incus_apps_state == 'present'

    - ansible.builtin.include_tasks: uninstall.yml
      when: incus_apps_state == 'absent'
