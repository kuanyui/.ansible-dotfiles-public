---
# Host-level setup (apt install incus, daemon start, group add, preseed init)
# already done by tasks/host_setup.yml. From here on this file is user-space:
# render `v-<agent>` launchers + completions + manifest into ~/.local/.

- name: Ensure `incus_bin_dir`, `incus_zsh_completion_dir`, `incus_bash_completion_dir` exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ incus_bin_dir }}"
    - "{{ incus_zsh_completion_dir }}"
    - "{{ incus_bash_completion_dir }}"

- name: Install launcher script `{{ incus_bin_dir }}/v-<name>`
  ansible.builtin.template:
    src: v-launcher.sh.j2
    dest: "{{ incus_bin_dir }}/v-{{ incus_app.name }}"
    mode: "0755"
  loop: "{{ incus_apps }}"
  loop_control:
    loop_var: incus_app
    label: "v-{{ incus_app.name }}"
  vars:
    vm_cfg: "{{ incus_vm_defaults | combine(incus_app.vm | default({})) }}"

- name: Install zsh completion `{{ incus_zsh_completion_dir }}/_v-<name>`
  ansible.builtin.template:
    src: _v-launcher.zsh.j2
    dest: "{{ incus_zsh_completion_dir }}/_v-{{ incus_app.name }}"
    mode: "0644"
  loop: "{{ incus_apps }}"
  loop_control:
    loop_var: incus_app
    label: "_v-{{ incus_app.name }}"
  vars:
    launcher_name: "v-{{ incus_app.name }}"

- name: Install bash completion `{{ incus_bash_completion_dir }}/v-<name>`
  ansible.builtin.template:
    src: _v-launcher.bash.j2
    dest: "{{ incus_bash_completion_dir }}/v-{{ incus_app.name }}"
    mode: "0644"
  loop: "{{ incus_apps }}"
  loop_control:
    loop_var: incus_app
    label: "v-{{ incus_app.name }}"
  vars:
    launcher_name: "v-{{ incus_app.name }}"

- name: Write install manifest `{{ incus_manifest_path }}`
  ansible.builtin.template:
    src: manifest.yml.j2
    dest: "{{ incus_manifest_path }}"
    mode: "0644"

# ---------- Stage VM dotfiles (TWO variants: `user` and `root`) ----------
# Render `.bashrc` / `.tmux.conf` / `.zshrc` into host-side staging dirs;
# `v-launcher.sh` pushes them into the VM via `incus file push` at `init` time
# (see `_provision_vm`). The VM's `user` and `root` are DIFFERENT identities,
# so each gets its OWN `is_root` render - mirroring how
# `roles/container_templates` renders per-`who` dotfiles for podman. This is
# why `root` gets the red prompt / the `{% if is_root %}` blocks while `user`
# does not. `_push_dotfiles` pushes `vm-rootfs/home/user` -> /home/user and
# `vm-rootfs/root` -> /root. Rendered host-side once at apply time; VM-side
# `init` is just a file copy.
#
# `override_os_family: Debian` is the only fact override we need: VM is always
# Debian 13 (per `incus_vm_defaults.base_image`), and `.zshrc.j2` reads
# `ansible_facts['os_family']` to pick the per-distro min-install helper
# (`apt-min` on Debian, `zypper-min` / `dnf-min` elsewhere). Without this, a
# non-Debian HOST (Fedora / openSUSE / etc.) would bake its own helper into the
# VM's `.zshrc` instead of `apt-min`. `.bashrc.j2` has no `ansible_facts` refs.
- name: Ensure VM dotfiles staging dirs (`home/user` + `root`) exist under `{{ incus_root }}/vm-rootfs/` (roles/dotfiles only creates SUB-dirs of `target_home`, not `target_home` itself)
  ansible.builtin.file:
    path: "{{ incus_root }}/vm-rootfs/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - home/user
    - root

- name: Stage VM `user` dotfiles via `roles/dotfiles` into `{{ incus_root }}/vm-rootfs/home/user/`
  ansible.builtin.include_role:
    name: dotfiles
  vars:
    target_home: "{{ incus_root }}/vm-rootfs/home/user"
    target_user: "{{ ansible_facts['user_id'] }}"
    target_group: "{{ ansible_facts['user_id'] }}"
    is_root: false

- name: "Stage VM `user` `.zshrc` via `roles/zsh tasks_from: deploy-zsh-config.yml` into `{{ incus_root }}/vm-rootfs/home/user/.zshrc`"
  ansible.builtin.include_role:
    name: zsh
    tasks_from: deploy-zsh-config.yml
  vars:
    target_home: "{{ incus_root }}/vm-rootfs/home/user"
    target_user: "{{ ansible_facts['user_id'] }}"
    target_group: "{{ ansible_facts['user_id'] }}"
    is_root: false
    override_os_family: Debian

- name: Stage VM `root` dotfiles via `roles/dotfiles` into `{{ incus_root }}/vm-rootfs/root/`
  ansible.builtin.include_role:
    name: dotfiles
  vars:
    target_home: "{{ incus_root }}/vm-rootfs/root"
    target_user: "{{ ansible_facts['user_id'] }}"
    target_group: "{{ ansible_facts['user_id'] }}"
    is_root: true

- name: "Stage VM `root` `.zshrc` via `roles/zsh tasks_from: deploy-zsh-config.yml` into `{{ incus_root }}/vm-rootfs/root/.zshrc`"
  ansible.builtin.include_role:
    name: zsh
    tasks_from: deploy-zsh-config.yml
  vars:
    target_home: "{{ incus_root }}/vm-rootfs/root"
    target_user: "{{ ansible_facts['user_id'] }}"
    target_group: "{{ ansible_facts['user_id'] }}"
    is_root: true
    override_os_family: Debian
