---
# Host-level setup (apt install incus, daemon start, group add, preseed init)
# already done by tasks/host_setup.yml. From here on this file is user-space:
# render `v-<agent>` launchers + completions + manifest into ~/.local/.

- name: Ensure `incus_bin_dir`, `incus_zsh_completion_dir`, `incus_bash_completion_dir` exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ incus_bin_dir }}"
    - "{{ incus_zsh_completion_dir }}"
    - "{{ incus_bash_completion_dir }}"

- name: Install launcher script `{{ incus_bin_dir }}/v-<name>`
  ansible.builtin.template:
    src: v-launcher.sh.j2
    dest: "{{ incus_bin_dir }}/v-{{ incus_app.name }}"
    mode: "0755"
  loop: "{{ incus_apps }}"
  loop_control:
    loop_var: incus_app
    label: "v-{{ incus_app.name }}"
  vars:
    vm_cfg: "{{ incus_vm_defaults | combine(incus_app.vm | default({})) }}"

- name: Install zsh completion `{{ incus_zsh_completion_dir }}/_v-<name>`
  ansible.builtin.template:
    src: _v-launcher.zsh.j2
    dest: "{{ incus_zsh_completion_dir }}/_v-{{ incus_app.name }}"
    mode: "0644"
  loop: "{{ incus_apps }}"
  loop_control:
    loop_var: incus_app
    label: "_v-{{ incus_app.name }}"
  vars:
    launcher_name: "v-{{ incus_app.name }}"

- name: Install bash completion `{{ incus_bash_completion_dir }}/v-<name>`
  ansible.builtin.template:
    src: _v-launcher.bash.j2
    dest: "{{ incus_bash_completion_dir }}/v-{{ incus_app.name }}"
    mode: "0644"
  loop: "{{ incus_apps }}"
  loop_control:
    loop_var: incus_app
    label: "v-{{ incus_app.name }}"
  vars:
    launcher_name: "v-{{ incus_app.name }}"

- name: Write install manifest `{{ incus_manifest_path }}`
  ansible.builtin.template:
    src: manifest.yml.j2
    dest: "{{ incus_manifest_path }}"
    mode: "0644"

# ---------- Stage VM dotfiles ----------
# Render `.bashrc` / `.tmux.conf` / `.zshrc` into a host-side staging dir.
# `v-launcher.sh` pushes this dir into the VM via `incus file push` at
# `init` time (see `_provision_vm`). Rendered host-side once at apply
# time - VM-side `init` is just a file copy, no per-VM templating.
#
# `override_os_family: Debian` is the only fact override we need: VM is
# always Debian 13 (per `incus_vm_defaults.base_image`), and `.zshrc.j2`
# has exactly one `ansible_facts['os_family']` reference (the
# `apt-install-without-recommends` helper). Without this, the helper
# would silently disappear from the VM's `.zshrc` when the HOST is
# Fedora / openSUSE / etc. `.bashrc.j2` has no `ansible_facts` refs at all.
- name: Stage VM dotfiles via `roles/dotfiles` into `{{ incus_root }}/vm-rootfs/home/user/`
  ansible.builtin.include_role:
    name: dotfiles
  vars:
    target_home: "{{ incus_root }}/vm-rootfs/home/user"
    target_user: "{{ ansible_facts['user_id'] }}"
    target_group: "{{ ansible_facts['user_id'] }}"

- name: Stage VM `.zshrc` via `roles/zsh tasks_from: deploy-zsh-config.yml` into `{{ incus_root }}/vm-rootfs/home/user/.zshrc`
  ansible.builtin.include_role:
    name: zsh
    tasks_from: deploy-zsh-config.yml
  vars:
    target_home: "{{ incus_root }}/vm-rootfs/home/user"
    target_user: "{{ ansible_facts['user_id'] }}"
    target_group: "{{ ansible_facts['user_id'] }}"
    is_root: false
    override_os_family: Debian
