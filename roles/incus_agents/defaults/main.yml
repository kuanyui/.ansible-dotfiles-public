---
# `incus_agents_skip_host_setup`: skip the shared host-level prep done by
# `roles/_incus_host_setup` (apt install incus + guestfs-tools, daemon
# enable + start, `incus-admin` group add, `incus admin init --preseed`).
# Only the user-space launcher render in `install.yml` runs. Used by the
# sandbox (which can't satisfy incus's KVM/network requirements inside a
# rootless container) and as an escape hatch for users who want to manage
# host-level incus setup themselves. Off by default - normal
# `make apply-incus-agents` does the host setup.
# Note: `incus_storage_pool_source` lives in `roles/_incus_host_setup`'s
# defaults (it's host-level, shared with any future incus-using role).
incus_agents_skip_host_setup: false

# `incus_apps_state` mirrors `container_apps_state`:
#   - `present` (default): render launchers, completions, install manifest.
#   - `absent`: read manifest, remove everything it recorded. Used by
#     `playbooks/incus_agents_uninstall.yml`.
incus_apps_state: present

# `roles/incus_agents`'s own subdir under the shared `~/.local/share/ansible-managed/`
# parent (sibling of `container_apps`'s `container-apps/` subdir). Each role
# owns its own subdir, so uninstall = `rm -rf {{ incus_root }}` cleanly
# without touching siblings. Completions live under here too and are
# auto-discovered by `.zshrc` / `.bashrc` via the
# `ansible-managed/*/zsh-completions` glob - no per-role rc edit needed.
# `incus_bin_dir` stays at the standard `~/.local/bin/` alongside other
# user-local binaries; per-launcher paths are tracked in the manifest and
# removed individually on uninstall (filename prefix `v-` vs container_apps's
# `c-` keeps them distinguishable in `~/.local/bin/`).
incus_root: "{{ ansible_facts['env']['HOME'] }}/.local/share/ansible-managed/incus_agents"
incus_bin_dir: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
incus_zsh_completion_dir: "{{ incus_root }}/zsh-completions"
incus_bash_completion_dir: "{{ incus_root }}/bash-completions"
incus_manifest_path: "{{ incus_root }}/incus-apps.manifest.yml"

# Default resource allocation when an `incus_apps` entry doesn't override.
# Tight enough for a single agent under Debian-minimal; user bumps per app
# if they hit OOM.
incus_vm_defaults:
  base_image: images:debian/13
  cpu: 4
  memory: 4GiB
  disk: 10GiB

# Each entry produces one `~/.local/bin/v-<name>` launcher. The `agent.*`
# block intentionally duplicates fields from `roles/container_templates/
# defaults/main.yml` for now (see Task #27 - merging the schemas is a
# separate refactor).
#
# `install_script_url`: agent installed via `curl -fsSL <url> | bash` inside
# the VM as `user`. Native binary, no node needed.
# `install_via_npm`: agent installed via `npm install -g <pkg>`. Requires
# nodejs/npm to be apt-installed by the VM provisioning step.
# Exactly one of the two must be set.
incus_apps:
  - name: claude
    agent:
      command: claude
      display_name: claude-code
      install_script_url: https://claude.ai/install.sh
    # vm: {}   # optional override of incus_vm_defaults

  - name: codex
    agent:
      command: npx codex
      display_name: codex
      install_via_npm: "@openai/codex"
