---
# Stage the guest VM's shell dotfiles host-side, in TWO variants (`user` +
# `root`), for the incus launcher to push at `init` time. Shared by
# `roles/incus_agents` and `roles/incus_vm` - they differ only in the
# staging root, passed as `incus_guest_setup_dotfiles_root`.
#
# Renders ONE tree per ansible os_family (the only distro-dependent bit of the
# dotfiles is the min-install helper in `.zshrc.j2`: `apt-min` vs `zypper-min`
# / `dnf-min`). Which families to produce is controlled by
# `incus_guest_setup_dotfiles_os_families` (default `['Debian']`):
#   <root>/vm-rootfs/<os_family>/home/user/   (is_root=false)
#   <root>/vm-rootfs/<os_family>/root/        (is_root=true)
#   - `roles/incus_agents` (Debian-only agents) keeps the default -> just `Debian/`.
#   - `roles/incus_vm` passes all guest families it can build, and `ivm` pushes
#     the subtree matching the template's `os.distro` -> os_family.
# The launcher's push sends `<family>/home/user` -> /home/user and
# `<family>/root` -> /root. `user` and `root` are different identities, so each
# needs its own `is_root` render (e.g. root gets the red prompt, no redundant
# `sudo`). Mirrors how `roles/container_templates` renders per-`who` dotfiles.
#
# This is the LINUX/unix guest path. A future Windows guest needs a different
# host-side payload (unattend.xml / cloudbase-init) and has no shell dotfiles /
# /home/user / /root - it will be its OWN role, dispatched from the caller.

- name: Assert `incus_guest_setup_dotfiles_root` was provided by the caller
  ansible.builtin.assert:
    that:
      - incus_guest_setup_dotfiles_root is defined
      - incus_guest_setup_dotfiles_root | length > 0
    fail_msg: >-
      `incus_guest_setup_dotfiles_root` must be set by the caller (the face
      role's ansible-managed root, e.g. `{{ incus_root | default('<unset>') }}`).
      Staging is created at `<root>/vm-rootfs/<os_family>/{home/user,root}`.

- name: "Stage dotfiles per `incus_guest_setup_dotfiles_os_families` entry (one tree per family)"
  ansible.builtin.include_tasks: _stage_family.yml
  loop: "{{ incus_guest_setup_dotfiles_os_families | default(['Debian']) }}"
  loop_control:
    loop_var: incus_guest_setup_dotfiles_os_family
