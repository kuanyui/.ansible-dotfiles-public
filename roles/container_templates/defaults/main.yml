---
# `container_templates_output_dir` is where the rendered Makefile + Dockerfile
# + dotfiles trees land. The default is the install location used by daily
# workflows (Makefile invoked via `make -C` or, after PR2 step 3b, by launcher
# scripts in `~/.local/bin/`). Callers (e.g. `roles/container_apps` via
# `include_role`, or one-off `ansible-playbook -e ...`) can override this to
# stage rendered output elsewhere - useful for scaffolding a new project from
# a template without touching the user's install.
container_templates_output_dir: "{{ ansible_env.HOME }}/.local/share/ansible-managed/container-templates"

# `container_templates_with_systemd`: when rendering `Dockerfile.j2`, include
# the systemd + sshd installation tail block. Used internally by `tasks/main.yml`
# to render two flavors of Dockerfile per container template:
#   - false -> assets/Dockerfile         (lightweight, for `--runtime crun`)
#   - true  -> assets/Dockerfile.systemd (PID 1 = systemd, sshd as service, for `--runtime krun`)
# Default `false` mirrors "this var is the OFF case unless task overrides it",
# but in practice tasks always set this via task-level `vars:` to render both
# flavors regardless. Set externally only if you want to globally force one.
container_templates_with_systemd: false

# `container_templates` enumerates every container variant this role renders.
# Each entry mirrors the dataclass `ContainerConfig` in the legacy
# `render_j2.py`; adding a new container only requires appending here.
container_templates:
  - name: claude
    naming_prefix: claude_code
    image_platform: linux/amd64
    image_name: debian:13
    tz: Asia/Taipei
    distro_pkgs: []
    feature_presets:
      - zsh
      - qemacs
    # claude itself is pulled via Anthropic's official curl installer
    # (`install_script_url` below), which drops a native binary at
    # `~/.local/bin/claude` and avoids the npm bootstrapping overhead.
    # The `nodejs` block is kept here as a schema placeholder; flip
    # `install_via` to `distro` and add packages if you ever want npm.
    nodejs:
      install_via: none
      npm_global_pkgs: []
    install_script_url: https://claude.ai/install.sh
    agent:
      target_suffix: claude
      command: claude
      display_name: claude-code
    publish_ports: []

  - name: codex
    naming_prefix: codex
    image_platform: linux/amd64
    image_name: debian:13
    tz: Asia/Taipei
    distro_pkgs:
      - links2
    feature_presets:
      - zsh
      - qemacs
    nodejs:
      install_via: distro
      npm_global_pkgs:
        - "@openai/codex"
    agent:
      target_suffix: codex
      command: npx codex
      display_name: codex
      auth_note: "⚠️ Then use `links2` browser in container to finish the authentication to openai"
    publish_ports:
      - "1455:1455/tcp"
