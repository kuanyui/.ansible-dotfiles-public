---
- name: Provision AppArmor profiles via `roles/apparmor`
  hosts: localhost
  connection: local
  gather_facts: true
  # `become: false` at play level per `roles/apparmor/CLAUDE.md` (role mixes
  # privileged and unprivileged tasks; `become` is set per-task).
  become: false
  roles:
    - apparmor
