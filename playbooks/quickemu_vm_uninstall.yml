---
- name: Uninstall the `qvm` quickemu VM launcher via `roles/quickemu_vm` (VM data + packages untouched)
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    setup_quickemu_vm: true  # dedicated entry point: bypass the host-level opt-in gate
    quickemu_vm_state: absent
  roles:
    - quickemu_vm
