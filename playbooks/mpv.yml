---
- name: Deploy mpv player config for the current user via `roles/mpv`
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    target_home: "{{ ansible_facts['env']['HOME'] }}"
    target_user: "{{ ansible_facts['user_id'] }}"
    target_group: "{{ ansible_facts['user_id'] }}"
  roles:
    - mpv
