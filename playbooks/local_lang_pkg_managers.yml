---
- name: Redirect language package managers' global installs into ~/.local-lang-pkg-managers/
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    target_home: "{{ ansible_facts['env']['HOME'] }}"
    target_user: "{{ ansible_facts['user_id'] }}"
    target_group: "{{ ansible_facts['user_id'] }}"
  roles:
    - local_lang_pkg_managers
