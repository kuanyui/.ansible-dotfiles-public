---
- name: Configure podman OCI runtimes
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    setup_podman_oci_runtimes: true  # dedicated entry point - bypass the host-level opt-in gate
    target_home: "{{ ansible_facts['env']['HOME'] }}"
    target_user: "{{ ansible_facts['user_id'] }}"
  roles:
    - podman_oci_runtimes
