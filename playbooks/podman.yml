---
- name: Configure podman runtime
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    setup_podman: true  # dedicated podman entry point - bypass the host-level opt-in gate
    target_home: "{{ ansible_facts['env']['HOME'] }}"
    target_user: "{{ ansible_facts['user_id'] }}"
  roles:
    - podman
