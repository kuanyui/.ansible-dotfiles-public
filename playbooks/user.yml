---
- name: Provision current user
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    target_home: "{{ ansible_facts['env']['HOME'] }}"
    target_user: "{{ ansible_facts['user_id'] }}"
    target_group: "{{ ansible_facts['user_id'] }}"
    is_root: false
  roles:
    # Essentials only. Optional features (vm_podman, apparmor, trusted_pubkeys,
    # firefox_tunes, mpv, centralize_lang_pkgs_dir, ...) are no longer gated here -
    # run each via its own `make` target / playbook when a host wants it.
    - zsh
    - emacs
    - bash
    - tmux
