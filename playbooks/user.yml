---
- name: Provision current user
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    target_home: "{{ ansible_facts['env']['HOME'] }}"
    target_user: "{{ ansible_facts['user_id'] }}"
    target_group: "{{ ansible_facts['user_id'] }}"
    is_root: false
  roles:
    - local_pkgs       # gated by `setup_local_pkgs` (default false in group_vars/all.yml); first so PATH redirection is in place before downstream roles run any user-level package install
    - zsh
    - emacs
    - dotfiles
    - container_apps   # gated by `setup_container_apps` (default false in group_vars/all.yml)
    - apparmor         # gated by `setup_apparmor` (default false in group_vars/all.yml)
    - trusted_pubkeys  # gated by `setup_trusted_pubkeys` (default false in group_vars/all.yml)
