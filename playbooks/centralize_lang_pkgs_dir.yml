---
- name: Redirect language package managers' global installs into ~/.centralized-lang-pkgs/
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    target_home: "{{ ansible_facts['env']['HOME'] }}"
    target_user: "{{ ansible_facts['user_id'] }}"
    target_group: "{{ ansible_facts['user_id'] }}"
  roles:
    - centralize_lang_pkgs_dir
