# `shared_*` vars expose byte-identical fragments stored under
# `roles/_shared_j2_snippets/templates/`. See `roles/_shared_j2_snippets/README.md` for the rationale.
# Lookup is lazy (runs each reference); fine for our scale.
shared_zsh_ps1_lines: "{{ lookup('template', playbook_dir + '/../roles/_shared_j2_snippets/templates/zsh_ps1_lines.j2') }}"
shared_zsh_history: "{{ lookup('template', playbook_dir + '/../roles/_shared_j2_snippets/templates/zsh_history.j2') }}"
shared_zsh_compinit_and_zstyles: "{{ lookup('template', playbook_dir + '/../roles/_shared_j2_snippets/templates/zsh_compinit_and_zstyles.j2') }}"
shared_bash_ps1_line: "{{ lookup('template', playbook_dir + '/../roles/_shared_j2_snippets/templates/bash_ps1_line.j2') }}"
shared_shell_aliases_ls: "{{ lookup('template', playbook_dir + '/../roles/_shared_j2_snippets/templates/shell_aliases_ls.j2') }}"
shared_shell_aliases_cd_shortcuts: "{{ lookup('template', playbook_dir + '/../roles/_shared_j2_snippets/templates/shell_aliases_cd_shortcuts.j2') }}"
shared_shell_aliases_llmagents: "{{ lookup('template', playbook_dir + '/../roles/_shared_j2_snippets/templates/shell_aliases_llmagents.j2') }}"

# NOTE: this file is now ONLY the cross-role `shared_*` fragments. The former
# `setup_*` opt-in gates are GONE - a feature runs by running its role's
# playbook / `make` target, not by flipping a gate (essentials: zsh/emacs/bash/
# tmux via `apply-essentials-*`; everything else via its dedicated target).
# Per-role config moved into each role's `defaults/main.yml` (override here or in
# host_vars only when a host differs): `has_gui_support` -> roles/emacs,
# `provision_distro_packages_install_*` -> roles/provision,
# `podman_runtime` / `podman_runtime_scope` -> roles/podman_oci_runtimes.
